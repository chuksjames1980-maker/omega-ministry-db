        // Professional In-App Modal Handler
        function showModal(title, message, callback = null, isSuccess = true) {
            const modal = document.getElementById('customModal');

            const msgEl = document.getElementById('modalMessage');
            const iconEl = document.getElementById('modalIcon');

            msgEl.innerText = message;
            modalCallback = callback;

                iconEl.className = "w-12 h-12 mx-auto rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl";

                iconEl.className = "w-12 h-12 mx-auto rounded-full bg-red-500/20 text-red-400 flex items-center justify-center text-xl";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            modal.classList.remove('hidden');
        }

        function closeCustomModal() {
            const modal = document.getElementById('customModal');
            modal.classList.add('hidden');

                modalCallback();
                modalCallback = null;
            }

        // PIN SHA-256 helper
        async function hashPin(pin) {
            const encoder = new TextEncoder();
            const data = encoder.encode("OCM_SALT_" + pin);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        function showAlert(elementId, message, isError = true) {
            const el = document.getElementById(elementId);

            el.className = `mb-4 p-3 rounded-lg text-xs ${isError ? 'bg-red-500/10 border border-red-500/30 text-red-400' : 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400'}`;
            el.innerText = message;
            el.classList.remove('hidden');
        }

        async function handleAdminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('adminAuthBtn');
            if (!email || !password) {
                showAlert('adminLoginAlert', 'Please enter your Admin Email and Password.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            try {
                // Check admin table in Supabase
                const { data: adminRow, error: adminErr } = await supabaseClient
                    .from('admin_users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (adminErr || !adminRow || adminRow.password !== password) {
                    throw new Error('Invalid Admin Email or Password.');
                }

                activeAdminSession = adminRow;
                localStorage.setItem('ocm_admin_session', JSON.stringify(activeAdminSession));
                renderFullAdminDashboard();
            } catch (err) {
                showAlert('adminLoginAlert', err.message || 'Invalid admin credentials.');
                btn.disabled = false;
                btn.innerText = 'Authenticate Admin Access';

        async function sendAdminResetCode() {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) {
                showAlert('forgotAlert', 'Please enter your admin email.');
                return;
            }
            const { data: adminRow } = await supabaseClient.from('admin_users').select('*').eq('email', email).single();
            if (!adminRow) {
                showAlert('forgotAlert', 'Admin email not found in database.');
                return;
            }
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            await supabaseClient.from('admin_users').update({ reset_code: code }).eq('email', email);
            
            showModal("Reset Code Sent", `A password reset code has been sent to ${email}. (Demo Code: ${code})`, () => {
                renderAdminResetPassword(email);
            });
        }

        function renderAdminResetPassword(email) {
            const container = document.getElementById('appContainer');
            container.innerHTML = `

                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Confirm New Password</label>
                                <input type="password" id="confirmNewPassword" placeholder="••••••••" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                            </div>
                            <button onclick="verifyAndResetAdminPassword('${email}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-lg">
                                Update Password & Login
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function verifyAndResetAdminPassword(email) {
            const code = document.getElementById('resetCode').value.trim();
            const pass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;

            if (pass !== confirmPass) {
                showAlert('resetAlert', 'Passwords do not match.');
                return;
            }

            const { data: adminRow } = await supabaseClient.from('admin_users').select('*').eq('email', email).single();
            if (!adminRow || adminRow.reset_code !== code) {
                showAlert('resetAlert', 'Invalid reset code.');
                return;
            }

            await supabaseClient.from('admin_users').update({ password: pass, reset_code: null }).eq('email', email);
            showModal("Password Updated", "Your new password is now active. Please log in.", () => {
                renderAdminLoginModal();
            });
        }

        // --- 3. REGISTRATION FLOW ---

        function saveRegStep1(e) {
            e.preventDefault();

        async function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            const btn = document.getElementById('regSubmitBtn');
            if (pin !== confirmPin) {
                showAlert('regAlert', 'PIN numbers do not match! Please verify.');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                showAlert('regAlert', 'PIN must be exactly 4 numeric digits.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Saving to Database...';
            try {
                registrationData.dateJoined = document.getElementById('regDateJoined').value;
                const hashedPin = await hashPin(pin);
                const generatedMemberId = `OCM/MEM/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
                const formattedJoinDate = registrationData.dateJoined ? `${registrationData.dateJoined}-01` : new Date().toISOString().split('T')[0];

                const { data: insertedMember, error: memberError } = await supabaseClient
                    .from('members')
                    .insert([{
                        member_id: generatedMemberId,
                        full_name: registrationData.fullName,
                        gender: registrationData.gender,
                        phone: registrationData.phone,
                        whatsapp: registrationData.whatsapp || null,
                        email: registrationData.email || null,
                        address: registrationData.address,
                        date_of_birth: registrationData.dob,
                        nationality: registrationData.nationality,
                        state: registrationData.stateOfOrigin,
                        residence_state: registrationData.stateOfResidence,
                        is_married: registrationData.isMarried === 'yes',
                        is_worker: registrationData.isWorker === 'yes',
                        date_joined: formattedJoinDate,
                        pin_code: hashedPin
                    }])
                    .select()
                    .single();
                if (memberError) throw memberError;

                const { data: fellowshipRow } = await supabaseClient.from('fellowships').select('id').eq('name', registrationData.fellowship).single();
                if (fellowshipRow) {
                    await supabaseClient.from('member_fellowships').insert([{ member_id: insertedMember.id, fellowship_id: fellowshipRow.id }]);
                }

                if (registrationData.isWorker === 'yes' && registrationData.department !== 'None') {
                    const { data: deptRow } = await supabaseClient.from('departments').select('id').eq('name', registrationData.department).single();
                    if (deptRow) {
                        await supabaseClient.from('member_departments').insert([{ member_id: insertedMember.id, department_id: deptRow.id }]);
                    }
                }

                showModal(
                    "Registration Successful", 
                    `Your membership profile has been created successfully. Your assigned Member ID is ${generatedMemberId} (${registrationData.fellowship}). Please proceed to log in.`,
                    () => { renderLoginPage(); }
                );
            } catch (err) {
                showAlert('regAlert', err.message || 'Error saving registration.');
                btn.disabled = false;
                btn.innerHTML = 'Save & Login <i class="fa-solid fa-check ml-1"></i>';
            }
        }

        // --- 4. MEMBER LOGIN HANDLER ---
        async function handleMemberLogin() {
            const identifier = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const btn = document.getElementById('memberLoginBtn');
            if (!identifier || !pin) {
                showAlert('loginAlert', 'Please enter your Phone Number / Member ID and PIN.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Verifying PIN...';
            try {
                const hashedPin = await hashPin(pin);
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select(`*, member_fellowships(fellowships(name)), member_departments(departments(name)), group_leaders(is_active, fellowships(name)), executive_assignments(is_active, role_type, fellowships(name))`)
                    .or(`phone.eq.${identifier},member_id.eq.${identifier}`)
                    .eq('pin_code', hashedPin)
                    .single();

                if (error || !member) throw new Error('Invalid Phone Number/Member ID or 4-Digit PIN.');
                if (member.membership_status !== 'Active') throw new Error(`Account is currently ${member.membership_status}.`);

                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
                renderMemberDashboardShell();
            } catch (err) {
                showAlert('loginAlert', err.message || 'Login failed.');
                btn.disabled = false;
                btn.innerText = 'Member Login';
            }
        }

        async function updateAdminProfile(e) {
            e.preventDefault();
            const fullName = document.getElementById('profFullName').value.trim();
            const phone = document.getElementById('profPhone').value.trim();
            const whatsapp = document.getElementById('profWhatsapp').value.trim();
            const dob = document.getElementById('profDob').value;
            const avatarUrl = document.getElementById('profAvatar').value.trim();

            const { error } = await supabaseClient
                .from('admin_users')
                .update({ full_name: fullName, phone, whatsapp, dob, avatar_url: avatarUrl })
                .eq('id', activeAdminSession.id);

            if (error) {
                showModal('Error', error.message, null, false);
                return;
            }

            activeAdminSession.full_name = fullName;
            activeAdminSession.phone = phone;
            activeAdminSession.whatsapp = whatsapp;
            activeAdminSession.dob = dob;
            activeAdminSession.avatar_url = avatarUrl;
            localStorage.setItem('ocm_admin_session', JSON.stringify(activeAdminSession));

            showModal('Success', 'Admin profile updated successfully. Avatar updated at top right.', () => {
                renderFullAdminDashboard();
            });
        }

        async function saveNewAdminPin() {
            const pin1 = document.getElementById('newAdminPin').value;
            const pin2 = document.getElementById('confirmAdminPin').value;
            if (pin1 !== pin2 || !/^\d{8}$/.test(pin1)) {
                showModal('Error', 'PIN must be exactly 8 numeric digits and match confirmation.', null, false);
                return;
            }
            await supabaseClient.from('admin_users').update({ login_pin: pin1 }).eq('id', activeAdminSession.id);
            showModal('Success', '8-digit login PIN updated successfully.');
        }

        async function sendEmailChangeCode() {
            const newEmail = document.getElementById('newAdminEmail').value.trim();
            if (!newEmail) {
                showModal('Error', 'Please enter a valid email address.', null, false);
                return;
            }
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            window.pendingNewAdminEmail = newEmail;
            await supabaseClient.from('admin_users').update({ reset_code: code }).eq('id', activeAdminSession.id);
            
            document.getElementById('emailStep1Container').classList.add('hidden');
            document.getElementById('emailStep2Container').classList.remove('hidden');
            showModal('Code Sent', `Verification code sent to ${newEmail}. (Demo Code: ${code})`);
        }

        async function verifyAndSaveNewEmail() {
            const code = document.getElementById('emailChangeCode').value.trim();
            const { data: adminRow } = await supabaseClient.from('admin_users').select('*').eq('id', activeAdminSession.id).single();
            if (!adminRow || adminRow.reset_code !== code) {
                showModal('Error', 'Invalid verification code.', null, false);
                return;
            }
            const newEmail = window.pendingNewAdminEmail;
            await supabaseClient.from('admin_users').update({ email: newEmail, reset_code: null }).eq('id', activeAdminSession.id);
            activeAdminSession.email = newEmail;
            localStorage.setItem('ocm_admin_session', JSON.stringify(activeAdminSession));
            showModal('Success', 'Login email changed successfully. Old email is now inactive.', () => {
                renderFullAdminDashboard();
            });
        }

            main.innerHTML = `
                <div class="card-bg p-6 rounded-xl border border-white/5 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">${fellowshipName} Member Directory</h3>
                            <p class="text-xs text-gray-400">Search member names, click to assign or remove Group Leader role.</p>
                        </div>
                        <input type="text" id="leaderSearchInput" oninput="filterLeaderSearch()" placeholder="Search member name..." class="w-full sm:w-72 bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div id="leaderListContainer" class="divide-y divide-white/5 overflow-x-auto">
                        <p class="py-4 text-center text-gray-400 text-xs">Loading members...</p>
                    </div>
                </div>
            `;

            const { data: fellowshipRow } = await supabaseClient.from('fellowships').select('id').eq('name', fellowshipName).single();
            if (!fellowshipRow) {
                document.getElementById('leaderListContainer').innerHTML = `<p class="py-4 text-center text-gray-400 text-xs">Fellowship not found in database.</p>`;
                return;
            }

            const { data: memberLinks } = await supabaseClient
                .from('member_fellowships')
                .select('member_id, members(*), group_leaders(is_active)')
                .eq('fellowship_id', fellowshipRow.id);

            window.currentFellowshipMembers = (memberLinks || []).map(ml => ({
                ...ml.members,
                isGroupLeader: (ml.members.group_leaders || []).some(gl => gl.is_active)
            }));

            displayMemberList(window.currentFellowshipMembers, "");
        }

        function displayMemberList(members, searchQuery) {
            const container = document.getElementById('leaderListContainer');
            if (!container) return;

            if (members.length === 0) {
                container.innerHTML = `<p class="py-4 text-center text-gray-400 text-xs">No members found in this fellowship.</p>`;
                return;
            }

            container.innerHTML = members.map(m => {
                const nameMatch = searchQuery && m.full_name.toLowerCase().includes(searchQuery.toLowerCase());
                return `
                    <div class="py-3 px-4 flex items-center justify-between hover:bg-white/5 transition rounded-lg ${nameMatch ? 'bg-amber-500/10 border border-amber-500/30' : ''}">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-xs">
                                ${m.full_name.charAt(0)}
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold ${nameMatch ? 'text-amber-300 font-bold' : 'text-white'}">${m.full_name}</h4>
                                <p class="text-[11px] text-gray-400">${m.member_id} • Phone: ${m.phone} ${m.isGroupLeader ? '• <span class="text-amber-400 font-semibold">Group Leader</span>' : ''}</p>
                            </div>
                        </div>
                        <div class="relative">
                            <button onclick="toggleLeaderDropdown('${m.id}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                Action <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
                            </button>
                            <div id="actionDropdown-${m.id}" class="hidden absolute right-0 mt-2 w-48 card-bg border border-white/10 rounded-xl shadow-2xl z-50 p-2 space-y-1">
                                <button onclick="saveGroupLeaderRole('${m.id}', true)" class="w-full text-left px-3 py-2 text-xs rounded hover:bg-emerald-500/20 text-emerald-400 font-medium transition">
                                    <i class="fa-solid fa-crown mr-1.5"></i> Group Leader
                                </button>
                                <button onclick="saveGroupLeaderRole('${m.id}', false)" class="w-full text-left px-3 py-2 text-xs rounded hover:bg-red-500/20 text-red-400 font-medium transition">
                                    <i class="fa-solid fa-user-minus mr-1.5"></i> Remove as Leader
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterLeaderSearch() {
            const query = document.getElementById('leaderSearchInput').value.trim();
            const filtered = (window.currentFellowshipMembers || []).filter(m => m.full_name.toLowerCase().includes(query.toLowerCase()));
            displayMemberList(filtered, query);
        }

        function toggleLeaderDropdown(memberId) {
            document.querySelectorAll('[id^="actionDropdown-"]').forEach(el => {
                if (el.id !== `actionDropdown-${memberId}`) el.classList.add('hidden');
            });
            const drop = document.getElementById(`actionDropdown-${memberId}`);
            if (drop) drop.classList.toggle('hidden');
        }

        async function saveGroupLeaderRole(memberId, makeLeader) {
            try {
                if (makeLeader) {
                    const { data: mf } = await supabaseClient.from('member_fellowships').select('fellowship_id').eq('member_id', memberId).single();
                    if (mf) {
                        await supabaseClient.from('group_leaders').upsert([{
                            member_id: memberId,
                            fellowship_id: mf.fellowship_id,
                            is_active: true
                        }], { onConflict: 'member_id,fellowship_id' });
                    }
                    showModal("Role Assigned", "Successfully assigned as Group Leader!");
                } else {
                    await supabaseClient.from('group_leaders').update({ is_active: false }).eq('member_id', memberId);
                    showModal("Role Revoked", "Successfully removed Group Leader role.");
                }
                switchAdminView('assign-men');
            } catch (err) {
                showModal("Error", 'Error updating leader status: ' + err.message, null, false);
            }
        }

        async function loadAdminMemberCount() {
            const { count } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            const el = document.getElementById('statTotalMembers');
            if (el) el.innerText = count !== null ? count : '0';
        }

        function initChart() {
            const ctx = document.getElementById('financialChart');
            if (!ctx) return;
            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [
                        { label: 'Dues', data: [300, 340, 320, 410, 390, 482], borderColor: '#10b981', tension: 0.4 },
                        { label: 'Expenses', data: [90, 110, 95, 130, 115, 125], borderColor: '#ef4444', tension: 0.4 },
                        { label: 'Balance', data: [210, 230, 225, 280, 275, 356], borderColor: '#2563eb', tension: 0.4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- GROUP LEADER DASHBOARD ---
        function renderGroupLeaderDashboard() {
            const m = activeMemberSession;
            const fellowshipName = m?.member_fellowships?.[0]?.fellowships?.name || 'Fellowship';
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-screen overflow-hidden">
                    <header class="card-bg border-b border-white/10 h-16 flex items-center justify-between px-6 z-40">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9">${getLogoHtml("w-9 h-9")}</div>
                            <div>
                                <h2 class="text-sm font-bold text-amber-400">${fellowshipName.toUpperCase()} – GROUP LEADER PORTAL</h2>
                                <p class="text-xs text-gray-400">Leader: ${m.full_name}</p>
                            </div>
                        </div>
                        <button onclick="renderMemberDashboardShell()" class="text-xs text-blue-400 hover:underline">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Back to Member Dashboard
                        </button>
                    </header>
                    <main class="flex-1 overflow-y-auto p-6 space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Fellowship Members</p>
                                <h3 class="text-lg sm:text-2xl font-bold mt-1 text-emerald-400">Active</h3>
                            </div>
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Fellowship Dues</p>
                                <h3 class="text-lg sm:text-2xl font-bold mt-1 text-blue-400">₦150,000</h3>
                            </div>
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Total Arrears</p>
                                <h3 class="text-lg sm:text-2xl font-bold mt-1 text-red-400">₦12,000</h3>
                            </div>
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Fellowship Balance</p>
                                <h3 class="text-lg sm:text-2xl font-bold mt-1 text-purple-400">₦138,000</h3>
                            </div>
                        </div>
                        <div class="card-bg p-6 rounded-xl border border-white/5">
                            <h3 class="text-base font-bold mb-3">${fellowshipName} Overview & Quick Actions</h3>
                            <p class="text-xs text-gray-400 mb-4">Manage attendance, view member contributions, and coordinate group activities for ${fellowshipName}.</p>
                            <button onclick="showModal('Register Export', 'Group Leader attendance register export initiated successfully.')" class="bg-amber-600 hover:bg-amber-700 text-black font-semibold px-4 py-2 rounded-lg text-xs transition">
                                Export Fellowship Register
                            </button>
                        </div>
                    </main>
                </div>
            `;
        }

        async function adminLogout() {
            activeAdminSession = null;
            localStorage.removeItem('ocm_admin_session');
            renderLoginPage();
        }

        // Initialize application on load with Session Persistence check
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true' || activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoadingScreen();
            }
        });
    </script>
</body>
</html>
