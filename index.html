<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega City of Mercy Glorious Ministry Database</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js for Financial Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #070b19;
            --card-dark: #101833;
            --accent-blue: #2563eb;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --project-purple: #8b5cf6;
            --warning-amber: #f59e0b;
        }
        body {
            background-color: var(--bg-deep);
            color: #f9f9fa;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card-bg {
            background-color: var(--card-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideInRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 3s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <!-- MAIN VIEWPORT CONTAINER -->
    <div id="appContainer" class="flex-1 flex flex-col">
        <!-- Dynamically rendered views load here -->
    </div>

    <!-- JAVASCRIPT APPLICATION CONTROLLER -->
    <script>
        // Official Ministry Logo Embedded as Base64 to guarantee loading on Vercel
        const ministryLogo = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAH0CAMAAAC8jfaQAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAXVBMVEUAAAAAAAAvLz8xMTEvLz8uLi8wMDAtLS4rKygxMTEsLCwxMTEuLi4wMDAvLz8vLz8wMDAtLS4rKygxMTEsLCwxMTEuLi4wMDAvLz8vLz8wMDAtLS4rKygxMTEsLCwxMTEuLi4wMDCrMh6fAAAAO0lEQVR42u3BMQEAAADCoPVPbQ0PoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4A8B9AABU4m1xQAAAABJRU5ErkJggg==";
        // Note: For full high-res display, we fall back to a reliable styling or placeholder if needed, but we will use an SVG/Canvas emblem + uploaded aesthetic.
        // Let's use a robust SVG representation of the gold ministry seal with dove, flame and sword for 100% crisp rendering across all devices:
        const logoHtml = `
            <div class="relative w-36 h-36 mx-auto rounded-full bg-gradient-to-tr from-yellow-600 via-amber-400 to-yellow-200 flex items-center justify-center p-1.5 shadow-2xl">
                <div class="w-full h-full rounded-full bg-black flex flex-col items-center justify-center relative overflow-hidden border-2 border-amber-300">
                    <div class="absolute inset-0 opacity-30 bg-[radial-gradient(#f59e0b_1px,transparent_1px)] [background-size:8px_8px]"></div>
                    <i class="fa-solid fa-dove text-amber-400 text-3xl mb-1 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]"></i>
                    <div class="flex space-x-1 items-end">
                        <div class="w-2 h-8 bg-amber-600 rounded-t"></div>
                        <div class="w-3 h-12 bg-red-600 rounded-t shadow-[0_0_10px_#ef4444]"></div>
                        <div class="w-2 h-8 bg-amber-600 rounded-t"></div>
                    </div>
                </div>
            </div>
        `;

        // State Management
        let registrationData = {
            fullName: '', phone: '', whatsapp: '', dob: '', email: '',
            address: '', stateOfOrigin: '', stateOfResidence: '', nationality: 'Nigeria',
            gender: '', isMarried: '', fellowship: '', isWorker: '', department: '',
            dateJoined: '', pin: ''
        };

        let loadingTimer = null;

        // --- 1. LOADING SCREEN VIEW ---
        function renderLoadingScreen() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                    <div class="mb-6 relative">
                        ${logoHtml}
                        <div class="absolute -bottom-1 right-6 w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg animate-spin-slow border-2 border-amber-300">
                            <i class="fa-solid fa-pen-nib text-sm"></i>
                        </div>
                    </div>
                    <h1 class="text-xl md:text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-blue-400 to-white uppercase mb-2 animate-slide-in">
                        OMEGA CITY OF MERCY GLORIOUS MINISTRY DATABASE
                    </h1>
                    <p class="text-sm text-gray-300 italic mb-8 max-w-md">keeping your detail save and fincial transparency.</p>
                    
                    <div class="flex items-center space-x-3 text-gray-400 text-xs">
                        <i class="fa-solid fa-spinner animate-spin text-blue-400 text-base"></i>
                        <span>Loading secure database environment... (Redirecting in 10s)</span>
                    </div>
                    <button onclick="renderLoginPage()" class="mt-6 text-xs text-blue-400 underline hover:text-white">Skip Loading</button>
                </div>
            `;

            // 10-second automatic redirect to Login Page
            loadingTimer = setTimeout(() => {
                renderLoginPage();
            }, 10000);
        }

        // --- 2. LOGIN PAGE VIEW ---
        function renderLoginPage() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="card-bg w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/10">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 mx-auto mb-3">
                                ${logoHtml}
                            </div>
                            <h2 class="text-lg font-bold">Welcome Back</h2>
                            <p class="text-xs text-gray-400">"Keeping record clean and safe."</p>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Phone Number / Member ID</label>
                                <input type="text" id="loginPhone" placeholder="e.g. 08031234567" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">4-Digit PIN</label>
                                <input type="password" id="loginPin" maxlength="4" placeholder="••••" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white tracking-widest focus:outline-none focus:border-blue-500">
                            </div>

                            <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg">
                                Member Login
                            </button>

                            <div class="grid grid-cols-2 gap-3 pt-2">
                                <button onclick="renderAdminLoginModal()" class="card-bg hover:bg-white/5 py-2.5 rounded-lg text-xs font-medium text-amber-400 border border-amber-500/30 transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-shield-halved"></i><span>Main Admin Login</span>
                                </button>
                                <button onclick="alert('Place finger on biometric scanner or device sensor.')" class="card-bg hover:bg-white/5 py-2.5 rounded-lg text-xs font-medium text-blue-400 border border-blue-500/30 transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-fingerprint"></i><span>Fingerprint Login</span>
                                </button>
                            </div>

                            <div class="text-center pt-4 border-t border-white/10">
                                <p class="text-xs text-gray-400">Don't have an account yet?</p>
                                <button onclick="renderRegistrationStep1()" class="mt-2 text-xs text-blue-400 font-semibold hover:underline">
                                    <i class="fa-solid fa-user-plus mr-1"></i> Proceed to Registration
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 2.1. MAIN ADMIN LOGIN MODAL / VIEW ---
        function renderAdminLoginModal() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="card-bg w-full max-w-md p-8 rounded-2xl shadow-2xl border border-amber-500/30">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 mx-auto mb-3">
                                ${logoHtml}
                            </div>
                            <h2 class="text-lg font-bold text-amber-400">Main Administrator Portal</h2>
                            <p class="text-xs text-gray-400">Secure Super Admin Access</p>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Admin Username / Email</label>
                                <input type="text" id="adminUser" placeholder="admin@omegacity.org" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Admin Security Password / PIN</label>
                                <input type="password" id="adminPassword" placeholder="••••••••" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                            </div>

                            <button onclick="handleAdminLogin()" class="w-full bg-amber-600 hover:bg-amber-700 text-black font-bold py-2.5 rounded-lg text-sm transition shadow-lg">
                                Authenticate Admin Access
                            </button>

                            <div class="text-center pt-3">
                                <button onclick="renderLoginPage()" class="text-xs text-gray-400 hover:text-white">
                                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Member Login
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPassword').value;
            if (!user || !pass) {
                alert('Please enter admin credentials.');
                return;
            }
            // Redirect to Full Admin Dashboard
            window.location.href = window.location.pathname + "?admin=true";
        }

        // --- 3. MULTI-STEP REGISTRATION FLOW ---
        function renderRegistrationStep1() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="card-bg w-full max-w-lg p-8 rounded-2xl shadow-2xl border border-white/10 my-8">
                        <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
                            <div>
                                <h2 class="text-base font-bold text-blue-400">Member Registration (Step 1 of 5)</h2>
                                <p class="text-xs text-gray-400">Personal Identification & Contact</p>
                            </div>
                            <button onclick="renderLoginPage()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        <form onsubmit="saveRegStep1(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">Full Name (Compulsory)</label>
                                <input type="text" id="regFullName" required value="${registrationData.fullName}" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">Phone Number (Compulsory)</label>
                                    <input type="tel" id="regPhone" required value="${registrationData.phone}" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">WhatsApp Number</label>
                                    <input type="tel" id="regWhatsapp" value="${registrationData.whatsapp}" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">Date of Birth (Compulsory)</label>
                                    <input type="date" id="regDob" required value="${registrationData.dob}" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">Email Address</label>
                                    <input type="email" id="regEmail" value="${registrationData.email}" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">House Address (Compulsory)</label>
                                <textarea id="regAddress" required rows="2" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">${registrationData.address}</textarea>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">State of Origin (Compulsory)</label>
                                    <input type="text" id="regStateOrigin" required value="${registrationData.stateOfOrigin}" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">State of Residence (Compulsory)</label>
                                    <input type="text" id="regStateResidence" required value="${registrationData.stateOfResidence}" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-300 mb-1">Nationality (Compulsory)</label>
                                    <input type="text" id="regNationality" required value="${registrationData.nationality || 'Nigeria'}" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                                </div>
                            </div>

                            <div class="pt-4 flex justify-end">
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition">
                                    Continue <i class="fa-solid fa-arrow-right ml-1"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function saveRegStep1(e) {
            e.preventDefault();
            registrationData.fullName = document.getElementById('regFullName').value;
            registrationData.phone = document.getElementById('regPhone').value;
            registrationData.whatsapp = document.getElementById('regWhatsapp').value;
            registrationData.dob = document.getElementById('regDob').value;
            registrationData.email = document.getElementById('regEmail').value;
            registrationData.address = document.getElementById('regAddress').value;
            registrationData.stateOfOrigin = document.getElementById('regStateOrigin').value;
            registrationData.stateOfResidence = document.getElementById('regStateResidence').value;
            registrationData.nationality = document.getElementById('regNationality').value;
            renderRegistrationStep2();
        }

        function renderRegistrationStep2() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="card-bg w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/10">
                        <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
                            <div>
                                <h2 class="text-base font-bold text-blue-400">Member Registration (Step 2 of 5)</h2>
                                <p class="text-xs text-gray-400">Gender & Fellowship Assignment</p>
                            </div>
                            <button onclick="renderRegistrationStep1()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                        </div>

                        <form onsubmit="saveRegStep2(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">Gender (Compulsory)</label>
                                <select id="regGender" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                                    <option value="">Select Gender</option>
                                    <option value="Male" ${registrationData.gender === 'Male' ? 'selected' : ''}>Male</option>
                                    <option value="Female" ${registrationData.gender === 'Female' ? 'selected' : ''}>Female</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">Are you married? (Compulsory)</label>
                                <select id="regIsMarried" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                                    <option value="">Select Option</option>
                                    <option value="yes" ${registrationData.isMarried === 'yes' ? 'selected' : ''}>Yes</option>
                                    <option value="no" ${registrationData.isMarried === 'no' ? 'selected' : ''}>No</option>
                                </select>
                            </div>
                            <p class="text-xs text-blue-300 bg-blue-600/10 p-3 rounded-lg border border-blue-500/20">
                                <i class="fa-solid fa-circle-info mr-1"></i> Fellowship assignment is automatically calculated: Married Male → Men Fellowship; Married Female → Women Fellowship; Unmarried → Youth Fellowship.
                            </p>

                            <div class="pt-4 flex justify-between">
                                <button type="button" onclick="renderRegistrationStep1()" class="card-bg hover:bg-white/5 text-gray-300 px-5 py-2.5 rounded-lg text-sm">Back</button>
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition">
                                    Continue <i class="fa-solid fa-arrow-right ml-1"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function saveRegStep2(e) {
            e.preventDefault();
            const gender = document.getElementById('regGender').value;
            const isMarried = document.getElementById('regIsMarried').value;
            registrationData.gender = gender;
            registrationData.isMarried = isMarried;

            if (isMarried === 'yes') {
                registrationData.fellowship = (gender === 'Male') ? 'Men Fellowship' : 'Women Fellowship';
            } else {
                registrationData.fellowship = 'Youth Fellowship';
            }
            renderRegistrationStep3();
        }

        function renderRegistrationStep3() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="card-bg w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/10">
                        <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
                            <div>
                                <h2 class="text-base font-bold text-blue-400">Member Registration (Step 3 of 5)</h2>
                                <p class="text-xs text-gray-400">Worker & Department Assignment</p>
                            </div>
                            <button onclick="renderRegistrationStep2()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                        </div>

                        <form onsubmit="saveRegStep3(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">Are you a worker? (Compulsory)</label>
                                <select id="regIsWorker" onchange="toggleDeptDropdown(this.value)" required class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                                    <option value="">Select Option</option>
                                    <option value="yes" ${registrationData.isWorker === 'yes' ? 'selected' : ''}>Yes</option>
                                    <option value="no" ${registrationData.isWorker === 'no' ? 'selected' : ''}>No</option>
                                </select>
                            </div>
                            <div id="deptContainer" class="${registrationData.isWorker === 'yes' ? '' : 'hidden'}">
                                <label class="block text-xs font-medium text-gray-300 mb-1">Select Department</label>
                                <select id="regDepartment" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                                    <option value="">Select Department</option>
                                    <option value="Security" ${registrationData.department === 'Security' ? 'selected' : ''}>Security</option>
                                    <option value="Usher" ${registrationData.department === 'Usher' ? 'selected' : ''}>Usher</option>
                                    <option value="Sanitation" ${registrationData.department === 'Sanitation' ? 'selected' : ''}>Sanitation</option>
                                    <option value="Choir" ${registrationData.department === 'Choir' ? 'selected' : ''}>Choir</option>
                                    <option value="Technical" ${registrationData.department === 'Technical' ? 'selected' : ''}>Technical</option>
                                    <option value="Children Teacher" ${registrationData.department === 'Children Teacher' ? 'selected' : ''}>Children Teacher</option>
                                </select>
                            </div>

                            <div class="pt-4 flex justify-between">
                                <button type="button" onclick="renderRegistrationStep2()" class="card-bg hover:bg-white/5 text-gray-300 px-5 py-2.5 rounded-lg text-sm">Back</button>
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition">
                                    Continue <i class="fa-solid fa-arrow-right ml-1"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function toggleDeptDropdown(val) {
            const deptContainer = document.getElementById('deptContainer');
            if (val === 'yes') {
                deptContainer.classList.remove('hidden');
            } else {
                deptContainer.classList.add('hidden');
                document.getElementById('regDepartment').value = '';
            }
        }

        function saveRegStep3(e) {
            e.preventDefault();
            registrationData.isWorker = document.getElementById('regIsWorker').value;
            registrationData.department = registrationData.isWorker === 'yes' ? document.getElementById('regDepartment').value : 'None';
            renderRegistrationStep4();
        }

        function renderRegistrationStep4() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="card-bg w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/10">
                        <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
                            <div>
                                <h2 class="text-base font-bold text-blue-400">Member Registration (Step 4 of 5)</h2>
                                <p class="text-xs text-gray-400">Join Date & Security PIN</p>
                            </div>
                            <button onclick="renderRegistrationStep3()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                        </div>

                        <form onsubmit="saveRegStep4(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">When did you join us? (Month and Year)</label>
                                <input type="month" id="regDateJoined" required value="${registrationData.dateJoined}" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">Enter 4-Digit PIN</label>
                                <input type="password" id="regPin" maxlength="4" required placeholder="••••" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white tracking-widest focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-300 mb-1">Confirm 4-Digit PIN</label>
                                <input type="password" id="regConfirmPin" maxlength="4" required placeholder="••••" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white tracking-widest focus:outline-none focus:border-blue-500">
                            </div>

                            <div class="pt-4 flex justify-between">
                                <button type="button" onclick="renderRegistrationStep3()" class="card-bg hover:bg-white/5 text-gray-300 px-5 py-2.5 rounded-lg text-sm">Back</button>
                                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition shadow-lg">
                                    Save & Login <i class="fa-solid fa-check ml-1"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            if (pin !== confirmPin) {
                alert('PIN numbers do not match! Please verify and re-enter.');
                return;
            }
            registrationData.dateJoined = document.getElementById('regDateJoined').value;
            registrationData.pin = pin;

            alert(`Registration successful! Assigned to: ${registrationData.fellowship} (${registrationData.department !== 'None' ? registrationData.department + ' Dept' : 'General Worker'}). Redirecting to Login.`);
            renderLoginPage();
        }

        // --- 4. AUTH & DASHBOARD HANDLERS ---
        function handleLogin() {
            const phone = document.getElementById('loginPhone').value;
            const pin = document.getElementById('loginPin').value;
            if (!phone || !pin) {
                alert('Please enter your phone number and 4-digit PIN.');
                return;
            }
            renderMemberDashboard();
        }

        function renderMemberDashboard() {
            if (loadingTimer) clearTimeout(loadingTimer);
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-screen overflow-hidden">
                    <header class="card-bg border-b border-white/10 h-16 flex items-center justify-between px-6 z-40">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white shadow">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold">${registrationData.fullName || 'Member Portal'}</h2>
                                <p class="text-xs text-blue-400">${registrationData.fellowship || 'Member Dashboard'}</p>
                            </div>
                        </div>
                        <button onclick="renderLoginPage()" class="text-xs text-red-400 hover:underline"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
                    </header>
                    <main class="flex-1 overflow-y-auto p-6 space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                            <div class="card-bg p-5 rounded-xl border border-white/5">
                                <p class="text-sm text-gray-400">Current Dues</p>
                                <h3 class="text-2xl font-bold mt-1 text-emerald-400">₦15,000</h3>
                            </div>
                            <div class="card-bg p-5 rounded-xl border border-white/5">
                                <p class="text-sm text-gray-400">Dues Arrears</p>
                                <h3 class="text-2xl font-bold mt-1 text-red-400">₦0</h3>
                            </div>
                            <div class="card-bg p-5 rounded-xl border border-white/5">
                                <p class="text-sm text-gray-400">Project Contribution</p>
                                <h3 class="text-2xl font-bold mt-1 text-purple-400">₦25,000</h3>
                            </div>
                        </div>
                        <div class="card-bg p-8 rounded-xl border border-white/5 text-center">
                            <h3 class="text-lg font-bold mb-2">Welcome to Omega City of Mercy Glorious Ministry</h3>
                            <p class="text-xs text-gray-400">"Keeping record clean and safe." Your profile and financial records are fully secure.</p>
                        </div>
                    </main>
                </div>
            `;
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                // Render full admin dashboard if admin query param is set
                renderFullAdminDashboard();
            } else {
                renderLoadingScreen();
            }
        });

        function renderFullAdminDashboard() {
            // Renders the master admin view
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center card-bg">
                    <h1 class="text-2xl font-bold text-amber-400 mb-2">Omega City Super Admin Dashboard</h1>
                    <p class="text-sm text-gray-300 mb-6">Full administrative control panel active.</p>
                    <button onclick="window.location.href = window.location.pathname" class="bg-blue-600 px-4 py-2 rounded text-sm">Return to Main Portal</button>
                </div>
            `;
        }
    </script>
</body>
</html>
