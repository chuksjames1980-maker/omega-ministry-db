        async function hashPin(pin) {
            const encoder = new TextEncoder();
            const data = encoder.encode("OCM_SALT_" + pin);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

            el.classList.remove('hidden');

        async function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            const btn = document.getElementById('regSubmitBtn');
            if (pin !== confirmPin) {
                showAlert('regAlert', 'PIN numbers do not match! Please verify.');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                showAlert('regAlert', 'PIN must be exactly 4 numeric digits.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Saving to Database...';
            try {
                registrationData.dateJoined = document.getElementById('regDateJoined').value;
                const hashedPin = await hashPin(pin);
                const generatedMemberId = `OCM/MEM/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
                const formattedJoinDate = registrationData.dateJoined ? `${registrationData.dateJoined}-01` : new Date().toISOString().split('T')[0];

                const { data: insertedMember, error: memberError } = await supabaseClient
                    .from('members')
                    .insert([{
                        member_id: generatedMemberId,
                        full_name: registrationData.fullName,
                        gender: registrationData.gender,
                        phone: registrationData.phone,
                        whatsapp: registrationData.whatsapp || null,
                        email: registrationData.email || null,
                        address: registrationData.address,
                        date_of_birth: registrationData.dob,
                        nationality: registrationData.nationality,
                        state: registrationData.stateOfOrigin,
                        residence_state: registrationData.stateOfResidence,
                        is_married: registrationData.isMarried === 'yes',
                        is_worker: registrationData.isWorker === 'yes',
                        date_joined: formattedJoinDate,
                        pin_code: hashedPin
                    }])
                    .select()
                    .single();
                if (memberError) throw memberError;

                const { data: fellowshipRow } = await supabaseClient.from('fellowships').select('id').eq('name', registrationData.fellowship).single();
                if (fellowshipRow) {
                    await supabaseClient.from('member_fellowships').insert([{ member_id: insertedMember.id, fellowship_id: fellowshipRow.id }]);
                }

                if (registrationData.isWorker === 'yes' && registrationData.department !== 'None') {
                    const { data: deptRow } = await supabaseClient.from('departments').select('id').eq('name', registrationData.department).single();
                    if (deptRow) {
                        await supabaseClient.from('member_departments').insert([{ member_id: insertedMember.id, department_id: deptRow.id }]);
                    }
                }

                showModal(
                    "Registration Successful", 
                    `Your membership profile has been created successfully. Your assigned Member ID is ${generatedMemberId} (${registrationData.fellowship}). Please proceed to log in.`,
                    () => { renderLoginPage(); }
                );
            } catch (err) {
                showAlert('regAlert', err.message || 'Error saving registration.');
                btn.disabled = false;
                btn.innerHTML = 'Save & Login <i class="fa-solid fa-check ml-1"></i>';
            }
        }

        // --- 4. MEMBER LOGIN HANDLER ---
        async function handleMemberLogin() {
            const identifier = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const btn = document.getElementById('memberLoginBtn');
            if (!identifier || !pin) {
                showAlert('loginAlert', 'Please enter your Phone Number / Member ID and PIN.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Verifying PIN...';
            try {
                const hashedPin = await hashPin(pin);
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select(`*, member_fellowships(fellowships(name)), member_departments(departments(name)), group_leaders(is_active, fellowships(name)), report_takers(is_active)`)
                    .or(`phone.eq.${identifier},member_id.eq.${identifier}`)
                    .eq('pin_code', hashedPin)
                    .single();

                if (error || !member) throw new Error('Invalid Phone Number/Member ID or 4-Digit PIN.');
                if (member.membership_status !== 'Active') throw new Error(`Account is currently ${member.membership_status}.`);

                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
                renderMemberDashboardShell();
            } catch (err) {
                showAlert('loginAlert', err.message || 'Login failed.');
                btn.disabled = false;
                btn.innerText = 'Member Login';
            }
        }

        function calculatePopulationBalance() {
            const aud = parseInt(document.getElementById('repAuditorium')?.value || 0);
            const child = parseInt(document.getElementById('repChildren')?.value || 0);
            const workers = parseInt(document.getElementById('repWorkers')?.value || 0);

            const totalPop = aud + child;
            const balance = totalPop - workers;

            const popEl = document.getElementById('calcPopTotal');
            const workerEl = document.getElementById('calcWorkerTotal');
            const balEl = document.getElementById('calcNetBalance');

            if (popEl) popEl.innerText = totalPop.toLocaleString();
            if (workerEl) workerEl.innerText = workers.toLocaleString();
            if (balEl) balEl.innerText = balance.toLocaleString();
        }

        async function submitPopulationReport(e) {
            e.preventDefault();
            const btn = document.getElementById('submitReportBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Submitting...';

            try {
                const aud = parseInt(document.getElementById('repAuditorium').value || 0);
                const child = parseInt(document.getElementById('repChildren').value || 0);
                const workers = parseInt(document.getElementById('repWorkers').value || 0);
                const totalPop = aud + child;
                const netBalance = totalPop - workers;

                const payload = {
                    member_id: activeMemberSession.id,
                    taker_name: activeMemberSession.full_name,
                    day: document.getElementById('repDay').value,
                    program: document.getElementById('repProgram').value.trim(),
                    topic: document.getElementById('repTopic').value.trim(),
                    auditorium: aud,
                    children: child,
                    workers: workers,
                    total_population: totalPop,
                    net_balance: netBalance,
                    vehicle: parseInt(document.getElementById('repVehicle').value || 0),
                    keke: parseInt(document.getElementById('repKeke').value || 0),
                    bike: parseInt(document.getElementById('repBike').value || 0),
                    remark: document.getElementById('repRemark').value.trim(),
                    submitted_at: new Date().toISOString()
                };

                const { error } = await supabaseClient.from('population_reports').insert([payload]);
                if (error) throw error;

                showModal("Report Submitted Successfully", "Your service population report has been successfully transmitted to the Admin Dashboard.", () => {
                    switchMemberView('dashboard');
                });
            } catch (err) {
                showModal("Submission Error", err.message || 'Error saving report.', null, false);
                btn.disabled = false;
                btn.innerHTML = 'Submit Report to Admin <i class="fa-solid fa-paper-plane ml-1"></i>';
            }
        }

        async function updateAdminProfile(e) {
            e.preventDefault();
            const admin = await getVerifiedAdminSession();
            if (!admin) {
                showModal('Error', 'Admin session not found. Please log in again.', null, false);
                return;
            }

            const fullName = document.getElementById('profFullName').value.trim();
            const phone = document.getElementById('profPhone').value.trim();
            const whatsapp = document.getElementById('profWhatsapp').value.trim();
            const dob = document.getElementById('profDob').value;
            const avatarUrl = document.getElementById('profAvatar').value.trim();

            const { error } = await supabaseClient
                .from('admin_users')
                .update({ full_name: fullName, phone, whatsapp, dob, avatar_url: avatarUrl })
                .eq('id', admin.id);

            if (error) {
                showModal('Error', error.message, null, false);
                return;
            }

            admin.full_name = fullName;
            admin.phone = phone;
            admin.whatsapp = whatsapp;
            admin.dob = dob;
            admin.avatar_url = avatarUrl;
            activeAdminSession = admin;
            localStorage.setItem('ocm_admin_session', JSON.stringify(admin));

            showModal('Success', 'Admin profile updated successfully.', () => {
                renderFullAdminDashboard();
            });
        }

        async function saveNewAdminPassword() {
            const admin = await getVerifiedAdminSession();
            if (!admin) {
                showModal('Error', 'Admin session not found. Please log in again.', null, false);
                return;
            }

            const p1 = document.getElementById('newAdminPass').value;
            const p2 = document.getElementById('confirmAdminPass').value;
            if (!p1 || p1 !== p2) {
                showModal('Error', 'Passwords do not match or are empty.', null, false);
                return;
            }

            const { error } = await supabaseClient.from('admin_users').update({ password: p1 }).eq('id', admin.id);
            if (error) {
                showModal('Error', error.message, null, false);
                return;
            }

            admin.password = p1;
            activeAdminSession = admin;
            localStorage.setItem('ocm_admin_session', JSON.stringify(admin));
            showModal('Success', 'Admin password updated successfully and is now active for login.');
        }

        async function saveDirectAdminEmail() {
            const admin = await getVerifiedAdminSession();
            if (!admin) {
                showModal('Error', 'Admin session not found. Please log in again.', null, false);
                return;
            }

            const newEmail = document.getElementById('newAdminEmailInput').value.trim();
            if (!newEmail) {
                showModal('Error', 'Please enter a valid email.', null, false);
                return;
            }

            const { error } = await supabaseClient.from('admin_users').update({ email: newEmail }).eq('id', admin.id);
            if (error) {
                showModal('Error', error.message, null, false);
                return;
            }

            admin.email = newEmail;
            activeAdminSession = admin;
            localStorage.setItem('ocm_admin_session', JSON.stringify(admin));
            showModal('Success', `Login email updated to ${newEmail} immediately! Old email is now inactive.`, () => {
                renderFullAdminDashboard();
            });
        }

        // --- ADMIN POPULATION REPORT DIRECTORY & READ-ONLY VIEWER ---
        async function renderAdminPopulationReportsView() {
            const main = document.getElementById('mainAdminContent');
            main.innerHTML = `
                <div class="card-bg p-6 rounded-xl border border-white/5 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">Submitted Population Reports</h3>
                            <p class="text-xs text-gray-400">Select a date using the calendar picker or view reports (Read-only)</p>
                        </div>
                        <input type="date" id="reportDateFilter" onchange="filterPopulationReportsByDate()" class="bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div id="populationReportListContainer" class="divide-y divide-white/5 overflow-x-auto">
                        <p class="py-4 text-center text-gray-400 text-xs">Loading reports...</p>
                    </div>
                </div>
            `;

            const { data: reports, error } = await supabaseClient
                .from('population_reports')
                .select('*')
                .order('submitted_at', { ascending: false });

            if (error) {
                document.getElementById('populationReportListContainer').innerHTML = `<p class="py-4 text-center text-red-400 text-xs">Error loading reports: ${error.message}</p>`;
                return;
            }

            window.allPopulationReports = reports || [];
            displayPopulationReportList(window.allPopulationReports);
        }

        function displayPopulationReportList(reports) {
            const container = document.getElementById('populationReportListContainer');
            if (!container) return;

            if (reports.length === 0) {
                container.innerHTML = `<p class="py-4 text-center text-gray-400 text-xs">No population reports found.</p>`;
                return;
            }

            container.innerHTML = reports.map(r => {
                const subDate = new Date(r.submitted_at).toLocaleString();
                return `
                    <div class="py-3 px-4 flex items-center justify-between hover:bg-white/5 transition rounded-lg cursor-pointer" onclick="viewPopulationReportDetails('${r.id}')">
                        <div>
                            <h4 class="text-sm font-semibold text-white">${r.program} (${r.day})</h4>
                            <p class="text-[11px] text-gray-400">Submitted by: <span class="text-amber-400">${r.taker_name}</span> • ${subDate}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-emerald-400">Pop: ${r.total_population}</span>
                            <p class="text-[10px] text-gray-400">Balance: ${r.net_balance}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterPopulationReportsByDate() {
            const dateVal = document.getElementById('reportDateFilter').value;
            if (!dateVal) {
                displayPopulationReportList(window.allPopulationReports);
                return;
            }
            const filtered = (window.allPopulationReports || []).filter(r => r.submitted_at.startsWith(dateVal));
            displayPopulationReportList(filtered);
        }

        async function viewPopulationReportDetails(reportId) {
            const report = (window.allPopulationReports || []).find(r => r.id === reportId);
            if (!report) return;

            const subDate = new Date(report.submitted_at).toLocaleString();
            showModal(
                `Report: ${report.program} (${report.day})`,
                `Submitted By: ${report.taker_name}\nDate & Time: ${subDate}\nTopic: ${report.topic}\n\nAuditorium: ${report.auditorium}\nChildren: ${report.children}\nWorkers: ${report.workers}\nTotal Population: ${report.total_population}\nNet Balance (Pop - Workers): ${report.net_balance}\n\nVehicles: ${report.vehicle} | Kekes: ${report.keke} | Bikes: ${report.bike}\n\nRemark: ${report.remark || 'None'}\n\n[Note: This record is secured and cannot be edited by anyone.]`,
                null,
                true
            );
        }

        // --- ASSIGN POPULATION TAKER ---
        async function renderAssignReportTakerView() {
            const main = document.getElementById('mainAdminContent');
            main.innerHTML = `
                <div class="card-bg p-6 rounded-xl border border-white/5 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">Department Member Directory</h3>
                            <p class="text-xs text-gray-400">Search workers across Security, Usher, Sanitation, Choir, Technical, Children Teacher.</p>
                        </div>
                        <input type="text" id="takerSearchInput" oninput="filterTakerSearch()" placeholder="Search member name..." class="w-full sm:w-72 bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div id="takerListContainer" class="divide-y divide-white/5 overflow-x-auto">
                        <p class="py-4 text-center text-gray-400 text-xs">Loading department members...</p>
                    </div>
                </div>
            `;

            const { data: memberDepts, error } = await supabaseClient
                .from('member_departments')
                .select('member_id, members(*), departments(name)');

            if (error) {
                document.getElementById('takerListContainer').innerHTML = `<p class="py-4 text-center text-red-400 text-xs">Error: ${error.message}</p>`;
                return;
            }

            const { data: takers } = await supabaseClient.from('report_takers').select('*');
            const activeTakerIds = new Set((takers || []).filter(t => t.is_active).map(t => t.member_id));

            window.allDepartmentMembers = (memberDepts || []).map(md => ({
                ...md.members,
                departmentName: md.departments?.name || 'Worker',
                isReportTaker: activeTakerIds.has(md.members.id)
            }));

            displayTakerMemberList(window.allDepartmentMembers, "");
        }

        function displayTakerMemberList(members, searchQuery) {
            const container = document.getElementById('takerListContainer');
            if (!container) return;

            if (members.length === 0) {
                container.innerHTML = `<p class="py-4 text-center text-gray-400 text-xs">No department members found.</p>`;
                return;
            }

            container.innerHTML = members.map(m => {
                const nameMatch = searchQuery && m.full_name.toLowerCase().includes(searchQuery.toLowerCase());
                return `
                    <div class="py-3 px-4 flex items-center justify-between hover:bg-white/5 transition rounded-lg ${nameMatch ? 'bg-amber-500/10 border border-amber-500/30' : ''}">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-xs">
                                ${m.full_name.charAt(0)}
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold ${nameMatch ? 'text-amber-300 font-bold' : 'text-white'}">${m.full_name}</h4>
                                <p class="text-[11px] text-gray-400">Dept: <span class="text-blue-400">${m.departmentName}</span> • Phone: ${m.phone} ${m.isReportTaker ? '• <span class="text-emerald-400 font-semibold">Report Taker</span>' : ''}</p>
                            </div>
                        </div>
                        <div class="relative">
                            <button onclick="toggleTakerDropdown('${m.id}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                Action <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
                            </button>
                            <div id="takerDropdown-${m.id}" class="hidden absolute right-0 mt-2 w-48 card-bg border border-white/10 rounded-xl shadow-2xl z-50 p-2 space-y-1">
                                <button onclick="saveReportTakerRole('${m.id}', true)" class="w-full text-left px-3 py-2 text-xs rounded hover:bg-emerald-500/20 text-emerald-400 font-medium transition">
                                    <i class="fa-solid fa-file-pen mr-1.5"></i> Assign Report Taker
                                </button>
                                <button onclick="saveReportTakerRole('${m.id}', false)" class="w-full text-left px-3 py-2 text-xs rounded hover:bg-red-500/20 text-red-400 font-medium transition">
                                    <i class="fa-solid fa-user-minus mr-1.5"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterTakerSearch() {
            const query = document.getElementById('takerSearchInput').value.trim();
            const filtered = (window.allDepartmentMembers || []).filter(m => m.full_name.toLowerCase().includes(query.toLowerCase()));
            displayTakerMemberList(filtered, query);
        }

        function toggleTakerDropdown(memberId) {
            document.querySelectorAll('[id^="takerDropdown-"]').forEach(el => {
                if (el.id !== `takerDropdown-${memberId}`) el.classList.add('hidden');
            });
            const drop = document.getElementById(`takerDropdown-${memberId}`);
            if (drop) drop.classList.toggle('hidden');
        }

        async function saveReportTakerRole(memberId, makeTaker) {
            try {
                if (makeTaker) {
                    await supabaseClient.from('report_takers').upsert([{
                        member_id: memberId,
                        is_active: true
                    }], { onConflict: 'member_id' });
                    showModal("Role Assigned", "Successfully assigned as Population Report Taker! The submission card is now active on their dashboard.");
                } else {
                    await supabaseClient.from('report_takers').update({ is_active: false }).eq('member_id', memberId);
                    showModal("Role Revoked", "Successfully removed Report Taker role.");
                }
                switchAdminView('assign-report-taker');
            } catch (err) {
                showModal("Error", 'Error updating role: ' + err.message, null, false);
            }
        }

        async function loadAdminMemberCount() {
            const { count } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            const el = document.getElementById('statTotalMembers');
            if (el) el.innerText = count !== null ? count : '0';
        }

        function initChart() {
            const ctx = document.getElementById('financialChart');
            if (!ctx) return;
            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [
                        { label: 'Dues', data: [300, 340, 320, 410, 390, 482], borderColor: '#10b981', tension: 0.4 },
                        { label: 'Expenses', data: [90, 110, 95, 130, 115, 125], borderColor: '#ef4444', tension: 0.4 },
                        { label: 'Balance', data: [210, 230, 225, 280, 275, 356], borderColor: '#2563eb', tension: 0.4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
