        async function saveEditedMemberName() {
            const memberId = document.getElementById('editMemberIdInput').value;
            const newName = document.getElementById('editMemberNameInput').value.trim();
            const btn = document.getElementById('saveEditMemberBtn');

            if (!newName) {
                showModal('Validation Error', 'Member name cannot be empty.', null, false);
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Saving...';

            const { error } = await supabaseClient
                .from('members')
                .update({ full_name: newName })
                .eq('id', memberId);

            btn.disabled = false;
            btn.innerText = 'Save Name';

            if (error) {
                showModal('Update Failed', error.message, null, false);
                return;
            }

            closeEditMemberModal();
            showModal('Name Updated', `Member name updated to "${newName}".`, () => {
                if (activeFellowshipContext) {
                    loadFellowshipGroupMembers(activeFellowshipContext);
                }
            });
        }

        async function deleteFellowshipMember(memberId, memberName) {
            const { error } = await supabaseClient

            });

        async function hashPin(pin) {
            const encoder = new TextEncoder();
            const data = encoder.encode("OCM_SALT_" + pin);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        function showAlert(elementId, message, isError = true) {

            el.innerText = message;
            el.classList.remove('hidden');

        async function ensureFellowshipRecord(fellowshipName) {
            if (!fellowshipName) return { row: null, error: null };
            const { data: existing, error: selErr } = await supabaseClient
                .from('fellowships')
                .select('id, name')
                .eq('name', fellowshipName)
                .maybeSingle();

            if (selErr) {
                return { row: null, error: selErr };
            }
            if (existing) {
                return { row: existing, error: null };
            }

            const { data: inserted, error: insErr } = await supabaseClient
                .from('fellowships')
                .insert([{ name: fellowshipName }])
                .select('id, name')
                .maybeSingle();

            return { row: inserted || null, error: insErr };
        }

        async function ensureDepartmentRecord(departmentName) {
            if (!departmentName || departmentName === 'None') return { row: null, error: null };
            const { data: existing, error: selErr } = await supabaseClient
                .from('departments')
                .select('id, name')
                .eq('name', departmentName)
                .maybeSingle();

            if (selErr) {
                return { row: null, error: selErr };
            }
            if (existing) {
                return { row: existing, error: null };
            }

            const { data: inserted, error: insErr } = await supabaseClient
                .from('departments')
                .insert([{ name: departmentName }])
                .select('id, name')
                .maybeSingle();

            return { row: inserted || null, error: insErr };
        }

        async function resolveMemberDepartmentName(member) {
            const joinedDept = member?.member_departments?.[0]?.departments?.name;
            if (joinedDept && joinedDept !== 'None') {
                return joinedDept;
            }

            if (member?.id) {
                try {
                    const { data: mdRow } = await supabaseClient
                        .from('member_departments')
                        .select('department_id, departments(name)')
                        .eq('member_id', member.id)
                        .maybeSingle();

                    if (mdRow?.departments?.name && mdRow.departments.name !== 'None') {
                        return mdRow.departments.name;
                    }

                    if (mdRow?.department_id) {
                        const { data: dRow } = await supabaseClient
                            .from('departments')
                            .select('name')
                            .eq('id', mdRow.department_id)
                            .maybeSingle();
                        if (dRow?.name && dRow.name !== 'None') {
                            return dRow.name;
                        }
                    }
                } catch (e) {
                    console.warn('Department lookup fallback:', e);
                }
            }

            if (member?.assigned_department && member.assigned_department !== 'None') {
                return member.assigned_department;
            }

            return 'None';
        }

        function inferFellowshipFromMember(member) {
            const married = Boolean(member?.is_married);
            const gender = (member?.gender || '').toLowerCase();
            if (married) {

            }
            return 'Youth Fellowship';

        // --- WORKERS LEADER & VICE LEADER STORAGE & SYNC HELPERS ---
        function getLocalWorkersLeadershipState() {
            try {
                const parsed = JSON.parse(localStorage.getItem('ocm_workers_leadership_state') || '{}');
                return {
                    workersLeaderId: parsed.workersLeaderId || null,
                    viceLeaderId: parsed.viceLeaderId || null
                };
            } catch (e) {
                return { workersLeaderId: null, viceLeaderId: null };
            }
        }

        function setLocalWorkersLeadershipState(state) {
            localStorage.setItem('ocm_workers_leadership_state', JSON.stringify({
                workersLeaderId: state.workersLeaderId || null,
                viceLeaderId: state.viceLeaderId || null
            }));
        }

        async function fetchWorkersLeadershipState() {
            const localState = getLocalWorkersLeadershipState();
            try {
                const { data, error } = await supabaseClient
                    .from('workers_leaders')
                    .select('member_id, is_active, role_type');
                if (!error && Array.isArray(data)) {
                    let dbLeaderId = null;
                    let dbViceId = null;
                    data.forEach(row => {
                        if (row.is_active) {
                            if (row.role_type === 'vice_leader') {
                                dbViceId = row.member_id;
                            } else {
                                dbLeaderId = row.member_id;
                            }
                        }
                    });
                    return {
                        workersLeaderId: dbLeaderId || localState.workersLeaderId,
                        viceLeaderId: dbViceId || localState.viceLeaderId
                    };
                }
            } catch (e) {
                console.warn('workers_leaders fallback:', e);
            }
            return localState;
        }

        async function persistWorkersLeadershipAction(memberId, actionType) {
            const current = await fetchWorkersLeadershipState();
            let nextLeaderId = current.workersLeaderId;
            let nextViceId = current.viceLeaderId;

            if (actionType === 'assign_workers_leader') {
                nextLeaderId = memberId;
                if (nextViceId === memberId) nextViceId = null;
            } else if (actionType === 'remove_as_workers_leader') {
                if (nextLeaderId === memberId) nextLeaderId = null;
            } else if (actionType === 'assign_vice_leader') {
                nextViceId = memberId;
                if (nextLeaderId === memberId) nextLeaderId = null;
            } else if (actionType === 'remove_as_vice_leader') {
                if (nextViceId === memberId) nextViceId = null;
            }

            setLocalWorkersLeadershipState({
                workersLeaderId: nextLeaderId,
                viceLeaderId: nextViceId
            });

            try {
                if (actionType === 'assign_workers_leader') {
                    await supabaseClient.from('workers_leaders').update({ is_active: false }).eq('role_type', 'workers_leader');
                    const { data: existing } = await supabaseClient.from('workers_leaders').select('id').eq('member_id', memberId).maybeSingle();
                    if (existing?.id) {
                        await supabaseClient.from('workers_leaders').update({ is_active: true, role_type: 'workers_leader' }).eq('id', existing.id);
                    } else {
                        await supabaseClient.from('workers_leaders').insert([{ member_id: memberId, is_active: true, role_type: 'workers_leader' }]);
                    }
                } else if (actionType === 'remove_as_workers_leader') {
                    await supabaseClient.from('workers_leaders').update({ is_active: false }).eq('member_id', memberId);
                } else if (actionType === 'assign_vice_leader') {
                    await supabaseClient.from('workers_leaders').update({ is_active: false }).eq('role_type', 'vice_leader');
                    const { data: existing } = await supabaseClient.from('workers_leaders').select('id').eq('member_id', memberId).maybeSingle();
                    if (existing?.id) {
                        await supabaseClient.from('workers_leaders').update({ is_active: true, role_type: 'vice_leader' }).eq('id', existing.id);
                    } else {
                        await supabaseClient.from('workers_leaders').insert([{ member_id: memberId, is_active: true, role_type: 'vice_leader' }]);
                    }
                } else if (actionType === 'remove_as_vice_leader') {
                    await supabaseClient.from('workers_leaders').update({ is_active: false }).eq('member_id', memberId);
                }
            } catch (e) {
                console.warn('workers_leaders table sync fallback:', e);
            }

            return { workersLeaderId: nextLeaderId, viceLeaderId: nextViceId };
        }

        async function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            const btn = document.getElementById('regSubmitBtn');
            if (pin !== confirmPin) {
                showAlert('regAlert', 'PIN numbers do not match! Please verify.');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                showAlert('regAlert', 'PIN must be exactly 4 numeric digits.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Saving to Database...';
            try {
                registrationData.dateJoined = document.getElementById('regDateJoined').value;
                const hashedPin = await hashPin(pin);
                const generatedMemberId = `OCM/MEM/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
                const formattedJoinDate = registrationData.dateJoined ? `${registrationData.dateJoined}-01` : new Date().toISOString().split('T')[0];

                const { data: insertedMember, error: memberError } = await supabaseClient
                    .from('members')
                    .insert([{
                        member_id: generatedMemberId,
                        full_name: registrationData.fullName,
                        gender: registrationData.gender,
                        phone: registrationData.phone,
                        whatsapp: registrationData.whatsapp || null,
                        email: registrationData.email || null,
                        address: registrationData.address,
                        date_of_birth: registrationData.dob,
                        nationality: registrationData.nationality,
                        state: registrationData.stateOfOrigin,
                        residence_state: registrationData.stateOfResidence,
                        is_married: registrationData.isMarried === 'yes',
                        is_worker: registrationData.isWorker === 'yes',
                        date_joined: formattedJoinDate,
                        pin_code: hashedPin
                    }])
                    .select()
                    .single();
                if (memberError) throw memberError;

                const { row: fellowshipRow } = await ensureFellowshipRecord(registrationData.fellowship);
                if (fellowshipRow) {
                    await supabaseClient.from('member_fellowships').insert([{ member_id: insertedMember.id, fellowship_id: fellowshipRow.id }]);
                }

                if (registrationData.isWorker === 'yes' && registrationData.department && registrationData.department !== 'None') {
                    const { row: deptRow, error: deptErr } = await ensureDepartmentRecord(registrationData.department);
                    if (deptErr) throw deptErr;
                    if (deptRow) {
                        const { error: mdErr } = await supabaseClient
                            .from('member_departments')
                            .upsert([{ member_id: insertedMember.id, department_id: deptRow.id }], { onConflict: 'member_id,department_id' });
                        if (mdErr) {
                            await supabaseClient.from('member_departments').insert([{ member_id: insertedMember.id, department_id: deptRow.id }]);
                        }
                    }
                }

                const deptSummary = (registrationData.isWorker === 'yes' && registrationData.department && registrationData.department !== 'None')
                    ? ` | Department: ${registrationData.department}`
                    : '';

                showModal(
                    "Registration Successful",
                    `Your membership profile has been created successfully. Your assigned Member ID is ${generatedMemberId} (${registrationData.fellowship}${deptSummary}). Please proceed to log in.`,
                    () => { renderLoginPage(); }
                );
            } catch (err) {
                showAlert('regAlert', err.message || 'Error saving registration.');
                btn.disabled = false;
                btn.innerHTML = 'Save & Login <i class="fa-solid fa-check ml-1"></i>';
            }
        }

        // --- 4. MEMBER LOGIN HANDLER ---
        async function refreshMemberSession(memberId) {
            const { data: member } = await supabaseClient
                .from('members')
                .select(`*, member_fellowships(fellowships(id, name)), member_departments(departments(id, name)), group_leaders(id, is_active, fellowship_id, fellowships(id, name)), report_takers(is_active)`)
                .eq('id', memberId)
                .maybeSingle();
            if (member) {
                const resolvedDept = await resolveMemberDepartmentName(member);
                member.assigned_department = resolvedDept;
                if (resolvedDept !== 'None' && (!member.member_departments || member.member_departments.length === 0)) {
                    member.member_departments = [{ departments: { name: resolvedDept } }];
                }

                const wState = await fetchWorkersLeadershipState();
                member.is_workers_leader = wState.workersLeaderId === member.id;
                member.is_vice_president = wState.viceLeaderId === member.id;
                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
            }
            return member;
        }

        async function handleMemberLogin() {
            const identifier = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const btn = document.getElementById('memberLoginBtn');
            if (!identifier || !pin) {
                showAlert('loginAlert', 'Please enter your Phone Number / Member ID and PIN.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Verifying PIN...';
            try {
                const hashedPin = await hashPin(pin);
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select(`*, member_fellowships(fellowships(id, name)), member_departments(departments(id, name)), group_leaders(id, is_active, fellowship_id, fellowships(id, name)), report_takers(is_active)`)
                    .or(`phone.eq.${identifier},member_id.eq.${identifier}`)
                    .eq('pin_code', hashedPin)
                    .maybeSingle();

                if (error || !member) throw new Error('Invalid Phone Number/Member ID or 4-Digit PIN.');
                if (member.membership_status !== 'Active') throw new Error(`Account is currently ${member.membership_status}.`);

                const resolvedDept = await resolveMemberDepartmentName(member);
                member.assigned_department = resolvedDept;
                if (resolvedDept !== 'None' && (!member.member_departments || member.member_departments.length === 0)) {
                    member.member_departments = [{ departments: { name: resolvedDept } }];
                }

                const wState = await fetchWorkersLeadershipState();
                member.is_workers_leader = wState.workersLeaderId === member.id;
                member.is_vice_president = wState.viceLeaderId === member.id;

                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
                renderMemberDashboardShell();
            } catch (err) {
                showAlert('loginAlert', err.message || 'Login failed.');
                btn.disabled = false;
                btn.innerText = 'Member Login';
            }
        }

        async function loadWorkersPortalData() {
            const { data: deptRows } = await supabaseClient
                .from('member_departments')
                .select('member_id, members(id, full_name, phone), departments(name)');

            const workersList = (deptRows || [])
                .filter(r => r.members)
                .map(r => ({
                    id: r.members.id,
                    full_name: r.members.full_name,
                    phone: r.members.phone || '',
                    department: r.departments?.name || 'Worker'
                }));

            const totalDues = 165000;
            const totalArrears = 32000;
            const totalOldDues = 28000;
            const totalProjectPaid = 85000;
            const projectUnpaid = 45000;
            const totalExpenses = 28500;
            const saveMoney = 40000;
            const totalInflow = totalDues + totalProjectPaid + totalOldDues;
            const totalBalance = totalDues + totalProjectPaid - totalExpenses - saveMoney;

            currentWorkersPortalMetrics = {
                workersList,
                totalInflow,
                totalDues,
                totalArrears,
                projectPaid: totalProjectPaid,
                projectUnpaid,
                totalOldDues,
                expenses: totalExpenses,
                saveMoney,
                totalBalance
            };
        }

        async function loadGroupLeaderFinancialData(fellowshipName, fellowshipId) {
            let resolvedFellowshipId = fellowshipId;
            if (!resolvedFellowshipId && fellowshipName) {
                const { row: fRow } = await ensureFellowshipRecord(fellowshipName);
                resolvedFellowshipId = fRow?.id || null;
            }

            let groupMembers = [];
            if (resolvedFellowshipId) {
                const { data: mfRows } = await supabaseClient
                    .from('member_fellowships')
                    .select('member_id, members(id, full_name, phone, date_of_birth)')
                    .eq('fellowship_id', resolvedFellowshipId);
                groupMembers = (mfRows || []).map(r => r.members).filter(Boolean);
            }

            const duesHistory = [
                { date: '2026-01-15', amount: 45000 },
                { date: '2026-02-14', amount: 52000 },
                { date: '2026-03-18', amount: 48500 },
                { date: '2026-04-12', amount: 60000 }
            ];
            const totalDues = duesHistory.reduce((sum, item) => sum + Number(item.amount), 0);

            const oldDuesItems = [
                { label: '2025 Brought-Forward Dues', date: '2025-12-28', amount: 35000 },
                { label: 'Previous Quarter Arrears Recovered', date: '2026-01-20', amount: 15000 }
            ];
            const totalOldDues = oldDuesItems.reduce((sum, item) => sum + Number(item.amount), 0);

            const expensesList = [
                { title: 'Fellowship Welfare & Visitation', date: '2026-02-10', amount: 22000 },
                { title: 'Group Meeting Refreshment & Printing', date: '2026-03-22', amount: 18500 },
                { title: 'Outreach Logistics', date: '2026-04-05', amount: 14000 }
            ];
            const totalExpenses = expensesList.reduce((sum, item) => sum + Number(item.amount), 0);

            const memberNamesList = groupMembers.length > 0
                ? groupMembers.map(gm => gm.full_name)
                : ['Samuel Okafor', 'Grace Eze', 'Daniel Musa', 'Esther Obi'];

            const halfIndex = Math.max(1, Math.ceil(memberNamesList.length / 2));
            const defaultPaidMembers = memberNamesList.slice(0, halfIndex);
            const defaultUnpaidMembers = memberNamesList.slice(halfIndex);

            const projectsList = [
                {
                    topic: `${fellowshipName} Hall Chairs & Sound Project`,
                    targetPerMember: 20000,
                    paidEntries: defaultPaidMembers.map((name, idx) => ({ name, amount: 20000, date: `2026-03-0${(idx % 9) + 1}` })),
                    unpaidEntries: defaultUnpaidMembers.map(name => ({ name, balanceDue: 20000 }))
                },
                {
                    topic: 'Annual Fellowship Retreat & Outreach Fund',
                    targetPerMember: 10000,
                    paidEntries: defaultPaidMembers.slice(0, Math.max(1, defaultPaidMembers.length - 1)).map((name, idx) => ({ name, amount: 10000, date: `2026-04-0${(idx % 9) + 1}` })),
                    unpaidEntries: [
                        ...(defaultPaidMembers.length > 1 ? [{ name: defaultPaidMembers[defaultPaidMembers.length - 1], balanceDue: 10000 }] : []),
                        ...defaultUnpaidMembers.map(name => ({ name, balanceDue: 10000 }))
                    ]
                }
            ];

            const totalProjectPaid = projectsList.reduce((sum, proj) => {
                return sum + proj.paidEntries.reduce((pSum, p) => pSum + Number(p.amount), 0);
            }, 0);

            const totalProjectUnpaid = projectsList.reduce((sum, proj) => {
                return sum + proj.unpaidEntries.reduce((uSum, u) => uSum + Number(u.balanceDue), 0);
            }, 0);

            const savedMoneyList = [
                { amount: 50000, date: '2026-02-25', approvalName: 'Chuks James' },
                { amount: 40000, date: '2026-04-15', approvalName: 'Chuks James' }
            ];
            const totalSavedMoney = savedMoneyList.reduce((sum, s) => sum + Number(s.amount), 0);

            const totalInflow = totalDues + totalProjectPaid + totalOldDues;
            const totalArrears = Math.max(1, memberNamesList.length) * 5000;
            const totalBalance = totalDues + totalProjectPaid - totalExpenses - totalSavedMoney;

            currentGroupLeaderMetrics = {
                fellowshipName,
                groupMembers,
                duesHistory,
                totalDues,
                totalArrears,
                oldDuesItems,
                totalOldDues,
                expensesList,
                totalExpenses,
                projectsList,
                totalProjectPaid,
                totalProjectUnpaid,
                totalInflow,
                savedMoneyList,
                totalSavedMoney,
                totalBalance
            };
        }

        function saveGroupExcoAssignment() {

        function submitMoneyApprovalRequest() {
            const amt = Number(document.getElementById('approvalAmountInput')?.value || 0);
            const purpose = document.getElementById('approvalPurposeInput')?.value.trim() || 'Fellowship remittance';
            if (amt <= 0) {
                showModal('Invalid Amount', 'Please enter a valid amount greater than zero.', null, false);
                return;

            showModal('Approval Sent', `Request to send ${formatNaira(amt)} (${purpose}) has been submitted for Admin approval.`);
        }

        function calculatePopulationBalance() {
            const aud = parseInt(document.getElementById('repAuditorium')?.value || 0);
            const child = parseInt(document.getElementById('repChildren')?.value || 0);
            const workers = parseInt(document.getElementById('repWorkers')?.value || 0);

            const totalPop = aud + child;
            const balance = totalPop - workers;

            const popEl = document.getElementById('calcPopTotal');
            const workerEl = document.getElementById('calcWorkerTotal');
            const balEl = document.getElementById('calcNetBalance');

            if (popEl) popEl.innerText = totalPop.toLocaleString();
            if (workerEl) workerEl.innerText = workers.toLocaleString();
            if (balEl) balEl.innerText = balance.toLocaleString();
        }

        async function submitPopulationReport(e) {
            e.preventDefault();
            const btn = document.getElementById('submitReportBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Submitting...';

            try {
                const aud = parseInt(document.getElementById('repAuditorium').value || 0);
                const child = parseInt(document.getElementById('repChildren').value || 0);
                const workers = parseInt(document.getElementById('repWorkers').value || 0);
                const totalPop = aud + child;
                const netBalance = totalPop - workers;

                const payload = {
                    member_id: activeMemberSession.id,
                    taker_name: activeMemberSession.full_name,
                    day: document.getElementById('repDay').value,
                    program: document.getElementById('repProgram').value.trim(),
                    topic: document.getElementById('repTopic').value.trim(),
                    auditorium: aud,
                    children: child,
                    workers: workers,
                    total_population: totalPop,
                    net_balance: netBalance,
                    vehicle: parseInt(document.getElementById('repVehicle').value || 0),
                    keke: parseInt(document.getElementById('repKeke').value || 0),
                    bike: parseInt(document.getElementById('repBike').value || 0),
                    remark: document.getElementById('repRemark').value.trim(),
                    submitted_at: new Date().toISOString()
                };

                const { error } = await supabaseClient.from('population_reports').insert([payload]);
                if (error) throw error;

                showModal("Report Submitted Successfully", "Your service population report has been successfully transmitted to the Admin Dashboard.", () => {
                    switchMemberView('dashboard');
                });
            } catch (err) {
                showModal("Submission Error", err.message || 'Error saving report.', null, false);
                btn.disabled = false;
                btn.innerHTML = 'Submit Report to Admin <i class="fa-solid fa-paper-plane ml-1"></i>';
            }
        }

        async function loadAssignWorkersLeaderData() {
            const container = document.getElementById('assignWorkerLeaderContainer');
            const statusEl = document.getElementById('currentWorkersLeaderStatus');
            if (!container) return;

            const { data: deptRows, error } = await supabaseClient
                .from('member_departments')
                .select('member_id, members(id, full_name, phone, member_id), departments(name)');

            if (error) {
                container.innerHTML = `<p class="py-6 text-center text-red-400 text-xs">Could not load workers: ${error.message}</p>`;
                return;
            }

            const wState = await fetchWorkersLeadershipState();

            const workers = (deptRows || [])
                .filter(r => r.members)
                .map(r => ({
                    id: r.members.id,
                    full_name: r.members.full_name,
                    phone: r.members.phone || '',
                    member_id: r.members.member_id || '',
                    department: r.departments?.name || 'Security',
                    isWorkersLeader: wState.workersLeaderId === r.members.id,
                    isViceLeader: wState.viceLeaderId === r.members.id
                }));

            const leaderObj = workers.find(w => w.isWorkersLeader);
            const viceObj = workers.find(w => w.isViceLeader);

            if (statusEl) {
                statusEl.innerHTML = `
                    <span class="block sm:inline">Workers Leader: <span class="text-purple-300 font-semibold">${leaderObj ? `${leaderObj.full_name} (${leaderObj.department})` : 'None Assigned'}</span></span>
                    <span class="hidden sm:inline mx-2 text-gray-600">|</span>
                    <span class="block sm:inline">Vice Leader: <span class="text-indigo-300 font-semibold">${viceObj ? `${viceObj.full_name} (${viceObj.department})` : 'None Assigned'}</span></span>
                `;
            }

            window.assignWorkersLeaderList = workers;
            renderAssignWorkerLeaderGroupedRows(workers);
        }

            const filtered = q ? list.filter(w => (w.full_name || '').toLowerCase().includes(q)) : list;
            renderAssignWorkerLeaderGroupedRows(filtered);

            (workers || []).forEach(w => {

                groupedMap[matchedDept].push(w);

        async function saveWorkerLeaderRole(memberId, memberName) {
            const selectEl = document.getElementById(`workerLeaderActionSelect-${memberId}`);
            const btnEl = document.getElementById(`saveWorkerLeaderBtn-${memberId}`);
            const action = selectEl ? selectEl.value : (selectedWorkerLeaderActionByMember[memberId] || 'assign_workers_leader');

            if (btnEl) {
                btnEl.disabled = true;
                btnEl.innerText = 'Saving...';
            }

            try {
                const updatedState = await persistWorkersLeadershipAction(memberId, action);

                if (activeMemberSession && activeMemberSession.id === memberId) {
                    activeMemberSession.is_workers_leader = updatedState.workersLeaderId === memberId;
                    activeMemberSession.is_vice_president = updatedState.viceLeaderId === memberId;
                    localStorage.setItem('ocm_member_session', JSON.stringify(activeMemberSession));
                }

                let titleMsg = 'Leadership Updated';
                let bodyMsg = '';

                if (action === 'assign_workers_leader') {
                    titleMsg = 'Workers Leader Assigned';
                    bodyMsg = `${memberName} is now assigned as Workers Leader. You can also search or click a second name to assign a Vice Leader.`;
                } else if (action === 'remove_as_workers_leader') {
                    titleMsg = 'Workers Leader Removed';
                    bodyMsg = `Removed ${memberName} as Workers Leader.`;
                } else if (action === 'assign_vice_leader') {
                    titleMsg = 'Vice Leader Assigned';
                    bodyMsg = `${memberName} is now assigned as Vice Leader. In their Member Dashboard, Vice President will automatically show with all 9 financial cards.`;
                } else if (action === 'remove_as_vice_leader') {
                    titleMsg = 'Vice Leader Removed';
                    bodyMsg = `Removed ${memberName} as Vice Leader.`;
                }

                showModal(titleMsg, bodyMsg, async () => {
                    await loadAssignWorkersLeaderData();
                });
            } catch (err) {
                showModal('Save Failed', err.message || 'Could not update Workers leadership.', null, false);

        async function loadAssignLeaderGroupData(fellowshipName) {
            const container = document.getElementById('assignLeaderMembersContainer');
            const statusEl = document.getElementById('currentFellowshipLeaderStatus');
            if (!container) return;

            const { row: fellowshipRow, error: fErr } = await ensureFellowshipRecord(fellowshipName);

            if (fErr || !fellowshipRow) {
                if (statusEl) statusEl.innerText = 'Current Group Leader: None';
                container.innerHTML = `<p class="py-6 text-center text-red-400 text-xs">Could not load fellowship "${fellowshipName}": ${fErr?.message || 'Check fellowships table permissions.'}</p>`;
                return;
            }

            const { data: mfRows, error: mfErr } = await supabaseClient
                .from('member_fellowships')
                .select('member_id, members(id, full_name, phone, member_id)')
                .eq('fellowship_id', fellowshipRow.id);

            let membersFromJoin = (mfErr ? [] : (mfRows || []).map(r => r.members).filter(Boolean));

            if (membersFromJoin.length === 0) {
                const { data: allMembers } = await supabaseClient
                    .from('members')
                    .select('id, full_name, phone, member_id, gender, is_married');

                const inferredMatches = (allMembers || []).filter(m => inferFellowshipFromMember(m) === fellowshipName);
                for (const mem of inferredMatches) {
                    await supabaseClient.from('member_fellowships').upsert(
                        [{ member_id: mem.id, fellowship_id: fellowshipRow.id }],
                        { onConflict: 'member_id,fellowship_id' }
                    );
                }
                membersFromJoin = inferredMatches;
            }

            const { data: leaderRows } = await supabaseClient
                .from('group_leaders')
                .select('member_id, is_active, members(full_name)')
                .eq('fellowship_id', fellowshipRow.id)
                .eq('is_active', true);

            const activeLeader = leaderRows?.[0] || null;
            const activeLeaderId = activeLeader?.member_id || null;
            const activeLeaderName = activeLeader?.members?.full_name || 'None Assigned';

            if (statusEl) {
                statusEl.innerHTML = `Current Group Leader: <span class="text-emerald-400 font-semibold">${activeLeaderName}</span>`;
            }

            const members = membersFromJoin.map(m => ({
                ...m,
                fellowshipId: fellowshipRow.id,
                fellowshipName: fellowshipRow.name,
                isCurrentLeader: m.id === activeLeaderId
            }));

            window.assignLeaderFellowshipId = fellowshipRow.id;
            window.assignLeaderMembersList = members;

            renderAssignLeaderMemberRows(members);
        }

        async function saveGroupLeaderAssignment(memberId, fellowshipId, fellowshipName) {
            const selectEl = document.getElementById(`leaderActionSelect-${memberId}`);
            const btnEl = document.getElementById(`saveLeaderBtn-${memberId}`);
            const action = selectEl ? selectEl.value : (selectedLeaderActionByMember[memberId] || 'assign_group_leader');

            if (btnEl) {
                btnEl.disabled = true;
                btnEl.innerText = 'Saving...';
            }

            try {
                if (action === 'assign_group_leader') {
                    await supabaseClient
                        .from('group_leaders')
                        .update({ is_active: false })
                        .eq('fellowship_id', fellowshipId);

                    const { data: existingRow } = await supabaseClient
                        .from('group_leaders')
                        .select('id')
                        .eq('member_id', memberId)
                        .eq('fellowship_id', fellowshipId)
                        .maybeSingle();

                    if (existingRow?.id) {
                        const { error: updErr } = await supabaseClient
                            .from('group_leaders')
                            .update({ is_active: true })
                            .eq('id', existingRow.id);
                        if (updErr) throw updErr;
                    } else {
                        const { error: insErr } = await supabaseClient
                            .from('group_leaders')
                            .insert([{ member_id: memberId, fellowship_id: fellowshipId, is_active: true }]);
                        if (insErr) throw insErr;
                    }

                    showModal(
                        'Group Leader Assigned',
                        `This member is now the Group Leader of ${fellowshipName}. When they log into their Member Dashboard, Group Dashboard will appear in their sidebar.`,
                        async () => {
                            await loadAssignLeaderGroupData(fellowshipName);
                        }
                    );
                } else {
                    const { error: remErr } = await supabaseClient
                        .from('group_leaders')
                        .update({ is_active: false })
                        .eq('member_id', memberId)
                        .eq('fellowship_id', fellowshipId);
                    if (remErr) throw remErr;

                    showModal(
                        'Group Leader Removed',
                        `Removed this member as Group Leader of ${fellowshipName}.`,
                        async () => {
                            await loadAssignLeaderGroupData(fellowshipName);
                        }
                    );
                }
            } catch (err) {
                showModal('Save Failed', err.message || 'Could not update group leader.', null, false);
            } finally {
                if (btnEl) {
                    btnEl.disabled = false;
                    btnEl.innerText = 'Save';
                }
            }
        }

        function handleProfilePictureFileSelect(event) {
            const file = event?.target?.files?.[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showModal('Invalid File', 'Please select a valid image file (PNG, JPG, JPEG, WebP).', null, false);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 320;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    pendingProfileAvatarDataUrl = compressedDataUrl;

                    const previewBox = document.getElementById('profileAvatarPreviewBox');
                    const fileLabel = document.getElementById('profilePictureFileName');

                    if (previewBox) {
                        previewBox.innerHTML = `<img src="${compressedDataUrl}" alt="Profile Preview" class="w-full h-full object-cover">`;
                    }
                    if (fileLabel) {
                        fileLabel.innerText = `Selected: ${file.name}`;
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

            showModal(
                `Report: ${report.program} (${report.day})`,
                `Submitted By: ${report.taker_name}\nDate & Time: ${subDate}\nTopic: ${report.topic}\n\nAuditorium: ${report.auditorium}\nChildren: ${report.children}\nWorkers: ${report.workers}\nTotal Population: ${report.total_population}\nNet Balance (Pop - Workers): ${report.net_balance}\n\nVehicles: ${report.vehicle} | Kekes: ${report.keke} | Bikes: ${report.bike}\n\nRemark: ${report.remark || 'None'}\n\n[Note: This record is secured and cannot be edited by anyone.]`,
                null,
                true
            );
        }

        // --- ASSIGN POPULATION TAKER ---
        async function renderAssignReportTakerView() {
            const main = document.getElementById('mainAdminContent');
            main.innerHTML = `
                <div class="card-bg p-6 rounded-2xl border border-white/10 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">Department Member Directory</h3>
                            <p class="text-xs text-gray-400">Search workers across Security, Usher, Sanitation, Choir, Technical, Children Teacher.</p>
                        </div>
                        <input type="text" id="takerSearchInput" oninput="filterTakerSearch()" placeholder="Search member name..." class="w-full sm:w-72 bg-black/30 border border-white/10 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div id="takerListContainer" class="divide-y divide-white/5 overflow-x-auto">
                        <p class="py-4 text-center text-gray-400 text-xs">Loading department members...</p>
                    </div>
                </div>
            `;

            const { data: memberDepts, error } = await supabaseClient
                .from('member_departments')
                .select('member_id, members(*), departments(name)');

            if (error) {
                document.getElementById('takerListContainer').innerHTML = `<p class="py-4 text-center text-red-400 text-xs">Error: ${error.message}</p>`;
                return;
            }

            const { data: takers } = await supabaseClient.from('report_takers').select('*');
            const activeTakerIds = new Set((takers || []).filter(t => t.is_active).map(t => t.member_id));

            window.allDepartmentMembers = (memberDepts || []).map(md => ({
                ...md.members,
                departmentName: md.departments?.name || 'Worker',
                isReportTaker: activeTakerIds.has(md.members.id)
            }));

            displayTakerMemberList(window.allDepartmentMembers, "");
        }

        function displayTakerMemberList(members, searchQuery) {
            const container = document.getElementById('takerListContainer');
            if (!container) return;

            if (members.length === 0) {
                container.innerHTML = `<p class="py-4 text-center text-gray-400 text-xs">No department members found.</p>`;
                return;
            }

            container.innerHTML = members.map(m => {
                const nameMatch = searchQuery && m.full_name.toLowerCase().includes(searchQuery.toLowerCase());
                return `
                    <div class="py-3 px-4 flex items-center justify-between hover:bg-white/5 transition rounded-lg ${nameMatch ? 'bg-amber-500/10 border border-amber-500/30' : ''}">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center font-bold text-xs">
                                ${m.full_name.charAt(0)}
                            </div>
                            <div>
                                <h4 class="text-sm font-semibold ${nameMatch ? 'text-amber-300 font-bold' : 'text-white'}">${m.full_name}</h4>
                                <p class="text-[11px] text-gray-400">Dept: <span class="text-blue-400">${m.departmentName}</span> • Phone: ${m.phone} ${m.isReportTaker ? '• <span class="text-emerald-400 font-semibold">Report Taker</span>' : ''}</p>
                            </div>
                        </div>
                        <div class="relative">
                            <button onclick="toggleTakerDropdown('${m.id}')" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                Action <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
                            </button>
                            <div id="takerDropdown-${m.id}" class="hidden absolute right-0 mt-2 w-48 card-bg border border-white/10 rounded-xl shadow-2xl z-50 p-2 space-y-1">
                                <button onclick="saveReportTakerRole('${m.id}', true)" class="w-full text-left px-3 py-2 text-xs rounded hover:bg-emerald-500/20 text-emerald-400 font-medium transition">
                                    <i class="fa-solid fa-file-pen mr-1.5"></i> Assign Report Taker
                                </button>
                                <button onclick="saveReportTakerRole('${m.id}', false)" class="w-full text-left px-3 py-2 text-xs rounded hover:bg-red-500/20 text-red-400 font-medium transition">
                                    <i class="fa-solid fa-user-minus mr-1.5"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterTakerSearch() {
            const query = document.getElementById('takerSearchInput').value.trim();
            const filtered = (window.allDepartmentMembers || []).filter(m => m.full_name.toLowerCase().includes(query.toLowerCase()));
            displayTakerMemberList(filtered, query);
        }

        function toggleTakerDropdown(memberId) {
            document.querySelectorAll('[id^="takerDropdown-"]').forEach(el => {
                if (el.id !== `takerDropdown-${memberId}`) el.classList.add('hidden');
            });
            const drop = document.getElementById(`takerDropdown-${memberId}`);
            if (drop) drop.classList.toggle('hidden');
        }

        async function saveReportTakerRole(memberId, makeTaker) {
            try {
                if (makeTaker) {
                    await supabaseClient.from('report_takers').upsert([{
                        member_id: memberId,
                        is_active: true
                    }], { onConflict: 'member_id' });
                    showModal("Role Assigned", "Successfully assigned as Population Report Taker! The submission card is now active on their dashboard.");
                } else {
                    await supabaseClient.from('report_takers').update({ is_active: false }).eq('member_id', memberId);
                    showModal("Role Revoked", "Successfully removed Report Taker role.");
                }
                switchAdminView('assign-report-taker');
            } catch (err) {
                showModal("Error", 'Error updating role: ' + err.message, null, false);
            }
        }

        async function loadAdminMemberCount() {
            const { count } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            const el = document.getElementById('statTotalMembers');
            if (el) el.innerText = count !== null ? count : '0';
        }

        function initChart() {
            const ctx = document.getElementById('financialChart');
            if (!ctx) return;
            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [
                        { label: 'Dues', data: [300, 340, 320, 410, 390, 482], borderColor: '#10b981', tension: 0.4 },
                        { label: 'Expenses', data: [90, 110, 95, 130, 115, 125], borderColor: '#ef4444', tension: 0.4 },
                        { label: 'Balance', data: [210, 230, 225, 280, 275, 356], borderColor: '#2563eb', tension: 0.4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- GROUP LEADER DASHBOARD (DIRECT VIEW) ---
        function renderGroupLeaderDashboard() {
            openAssignedGroupLeaderWorkspace();
        }

        async function adminLogout() {
            activeAdminSession = null;
            localStorage.removeItem('ocm_admin_session');
            renderLoginPage();
        }

                ], { onConflict: 'email' });
            } catch (e) {
                console.log('Admin auto-seed notice:', e);
            }

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true' || activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoadingScreen();
            }
        });
    </script>
