                        <p class="text-xs text-gray-400">Current Email: <strong class="text-white">${admin.email}</strong></p>
                        <form onsubmit="updateAdminEmail(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">New Admin Login Email</label>
                                <input type="email" id="newAdminEmailInput" required placeholder="newadmin@omegacity.org" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">Verify Current Password</label>
                                <input type="password" id="verifyPassForEmail" required placeholder="••••••••" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white">
                            </div>
                            <button id="saveAdminEmailBtn" type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition shadow-lg">
                                Save New Email
                            </button>
                        </form>
                    </div>
                `;
            } else if (view === 'set-theme') {
                title.innerText = "Change Theme";
                const currentTheme = localStorage.getItem('ocm_theme') || 'dark';
                main.innerHTML = `
                    <div class="card-bg max-w-lg mx-auto p-6 rounded-2xl border border-white/10 space-y-4">
                        <h3 class="text-base font-bold text-amber-400">Dashboard Theme Preferences</h3>
                        <p class="text-xs text-gray-400">Choose your preferred color theme for the portal.</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                            <button type="button" onclick="applyAppTheme('dark')" class="p-4 rounded-xl border ${currentTheme === 'dark' ? 'border-amber-400 bg-amber-500/10' : 'border-white/10 bg-black/30'} text-left space-y-1">
                                <p class="font-bold text-white">Deep Navy Dark (Default)</p>
                                <p class="text-gray-400">High-contrast navy & gold theme</p>
                            </button>
                            <button type="button" onclick="applyAppTheme('midnight')" class="p-4 rounded-xl border ${currentTheme === 'midnight' ? 'border-amber-400 bg-amber-500/10' : 'border-white/10 bg-black/30'} text-left space-y-1">
                                <p class="font-bold text-white">Midnight Slate</p>
                                <p class="text-gray-400">Soft charcoal slate tones</p>
                            </button>
                        </div>
                    </div>
                `;
            } else if (view === 'set-sound') {
                title.innerText = "Change Notification Sound";
                const currentSound = localStorage.getItem('ocm_notif_sound') || 'chime';
                main.innerHTML = `
                    <div class="card-bg max-w-lg mx-auto p-6 rounded-2xl border border-white/10 space-y-4">
                        <h3 class="text-base font-bold text-amber-400">Notification Sound Settings</h3>
                        <form onsubmit="saveNotificationSound(event)" class="space-y-4 text-sm">
                            <div>
                                <label class="block text-xs text-gray-300 mb-1">Select Alert Tone</label>
                                <select id="notifSoundSelect" class="w-full bg-black/30 border border-white/10 rounded-lg px-4 py-2.5 text-white">
                                    <option value="chime" ${currentSound === 'chime' ? 'selected' : ''}>Soft Ministry Chime</option>
                                    <option value="bell" ${currentSound === 'bell' ? 'selected' : ''}>Sanctuary Bell</option>
                                    <option value="pulse" ${currentSound === 'pulse' ? 'selected' : ''}>Digital Pulse</option>
                                    <option value="mute" ${currentSound === 'mute' ? 'selected' : ''}>Muted (Silent)</option>
                                </select>
                            </div>
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition shadow-lg">
                                Save Sound Preference
                            </button>
                        </form>
                    </div>
                `;
            } else {
                title.innerText = view.toUpperCase();
                main.innerHTML = `<div class="card-bg p-8 rounded-xl border border-white/5 text-center py-20"><i class="fa-solid fa-folder-open text-4xl text-blue-500 mb-4"></i><h3 class="text-xl font-bold mb-2">${title.innerText} Module Active</h3><p class="text-gray-400 text-xs">Connected to Supabase database.</p></div>`;
            }
        }

        async function saveAdminProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('saveAdminProfileBtn');
            const fullName = document.getElementById('profName').value.trim();

            if (!fullName) {
                showModal('Validation Error', 'Admin name cannot be empty.', null, false);
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = 'Saving...';
            }

            try {
                const admin = await getVerifiedAdminSession();
                const avatarUrl = pendingProfileAvatarDataUrl !== null
                    ? pendingProfileAvatarDataUrl
                    : (admin?.avatar_url || '');

                if (admin?.id) {
                    const { error } = await supabaseClient
                        .from('admin_users')
                        .update({ full_name: fullName, avatar_url: avatarUrl })
                        .eq('id', admin.id);
                    if (error) throw error;
                }

                activeAdminSession = { ...(admin || {}), full_name: fullName, avatar_url: avatarUrl };
                localStorage.setItem('ocm_admin_session', JSON.stringify(activeAdminSession));
                updateAdminHeaderIdentity(activeAdminSession);

                showModal("Profile Updated", "Your Admin Name and Profile Picture have been saved.");
            } catch (err) {
                showModal("Update Error", err.message || 'Could not update profile.', null, false);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Save Changes';
                }
            }
        }

        async function updateAdminPassword(e) {
            e.preventDefault();
            const currentPass = document.getElementById('currentAdminPass').value;
            const newPass = document.getElementById('newAdminPass').value;
            const confirmPass = document.getElementById('confirmAdminPass').value;
            const btn = document.getElementById('saveAdminPassBtn');

            if (newPass !== confirmPass) {
                showModal("Validation Error", "New password and confirmation do not match.", null, false);
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = 'Updating...';
            }

            try {
                const admin = await getVerifiedAdminSession();
                if (!admin || admin.password !== currentPass) {
                    throw new Error("Current password is incorrect.");
                }

                const { error } = await supabaseClient
                    .from('admin_users')
                    .update({ password: newPass })
                    .eq('id', admin.id);

                if (error) throw error;

                activeAdminSession = { ...admin, password: newPass };
                localStorage.setItem('ocm_admin_session', JSON.stringify(activeAdminSession));
                showModal("Password Updated", "Your Admin login password has been updated successfully.", () => {
                    switchAdminView('dashboard');
                });
            } catch (err) {
                showModal("Update Failed", err.message || "Could not update password.", null, false);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Save New Password';
                }
            }
        }

        async function updateAdminEmail(e) {
            e.preventDefault();
            const newEmail = document.getElementById('newAdminEmailInput').value.trim();
            const verifyPass = document.getElementById('verifyPassForEmail').value;
            const btn = document.getElementById('saveAdminEmailBtn');

            if (btn) {
                btn.disabled = true;
                btn.innerText = 'Updating...';
            }

            try {
                const admin = await getVerifiedAdminSession();
                if (!admin || admin.password !== verifyPass) {
                    throw new Error("Current password verification failed.");
                }

                const { error } = await supabaseClient
                    .from('admin_users')
                    .update({ email: newEmail })
                    .eq('id', admin.id);

                if (error) throw error;

                activeAdminSession = { ...admin, email: newEmail };
                localStorage.setItem('ocm_admin_session', JSON.stringify(activeAdminSession));
                showModal("Email Updated", `Your Admin login email has been updated to ${newEmail}.`, () => {
                    switchAdminView('dashboard');
                });
            } catch (err) {
                showModal("Update Failed", err.message || "Could not update email.", null, false);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Save New Email';
                }
            }
        }

        function applyAppTheme(theme) {
            localStorage.setItem('ocm_theme', theme);
            if (theme === 'midnight') {
                document.body.style.backgroundColor = '#0f172a';
            } else {
                document.body.style.backgroundColor = '#060a17';
            }
            showModal("Theme Applied", `Dashboard theme switched to ${theme === 'midnight' ? 'Midnight Slate' : 'Deep Navy Dark'}.`, () => {
                switchAdminView('set-theme');
            });
        }

        function saveNotificationSound(e) {
            e.preventDefault();
            const val = document.getElementById('notifSoundSelect').value;
            localStorage.setItem('ocm_notif_sound', val);
            showModal("Sound Saved", "Your notification sound preference has been saved.");
        }

        async function loadMembersForReportTaker() {
            const { data: members } = await supabaseClient.from('members').select('id, full_name, member_id, phone, report_takers(is_active)');
            window.allMembersCache = members || [];
            renderTakerList(window.allMembersCache);
        }

        function filterMembersForTaker() {
            const q = document.getElementById('searchMemberTaker').value.toLowerCase();
            const filtered = (window.allMembersCache || []).filter(m => m.full_name.toLowerCase().includes(q) || m.member_id.toLowerCase().includes(q));
            renderTakerList(filtered);
        }

        function renderTakerList(list) {
            const container = document.getElementById('takerMembersList');
            if (!list.length) {
                container.innerHTML = `<p class="text-xs text-gray-500 py-4 text-center">No members found.</p>`;
                return;
            }
            container.innerHTML = list.map(m => {
                const isTaker = (m.report_takers || []).some(rt => rt.is_active);
                return `
                    <div class="py-3 flex items-center justify-between text-xs">
                        <div>
                            <p class="font-bold text-white">${m.full_name}</p>
                            <p class="text-gray-400">${m.member_id} • ${m.phone}</p>
                        </div>
                        <button onclick="toggleReportTaker('${m.id}', ${!isTaker})" class="px-4 py-1.5 rounded-lg font-bold transition ${isTaker ? 'bg-red-500/20 text-red-400 border border-red-500/40' : 'bg-emerald-600 text-white'}">
                            ${isTaker ? 'Revoke Access' : 'Assign as Taker'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function toggleReportTaker(memberId, assign) {
            if (assign) {
                await supabaseClient.from('report_takers').upsert([{ member_id: memberId, is_active: true }], { onConflict: 'member_id' });
            } else {
                await supabaseClient.from('report_takers').update({ is_active: false }).eq('member_id', memberId);
            }
            showModal("Role Updated", assign ? "Member has been assigned as Population Report Taker." : "Report Taker access revoked.", () => {
                loadMembersForReportTaker();
            });
        }

        async function loadPopulationReports() {
            const container = document.getElementById('populationReportsContainer');
            const { data: reports, error } = await supabaseClient.from('population_reports').select('*').order('submitted_at', { ascending: false });
            if (error || !reports || !reports.length) {
                container.innerHTML = `<p class="text-xs text-gray-400 py-8 text-center">No population reports submitted yet.</p>`;
                return;
            }
            container.innerHTML = reports.map(r => `
                <div class="p-4 rounded-xl bg-black/30 border border-white/10 space-y-2 text-xs">
                    <div class="flex justify-between items-center border-b border-white/5 pb-2">
                        <span class="font-bold text-amber-400 text-sm">${r.day} - ${r.program}</span>
                        <span class="text-gray-400">Submitted by: <strong class="text-white">${r.taker_name}</strong></span>
                    </div>
                    <p class="text-blue-300"><strong>Sermon Topic:</strong> ${r.topic}</p>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 bg-white/5 p-2.5 rounded-lg text-center">
                        <div><p class="text-[10px] text-gray-400">Auditorium</p><p class="font-bold">${r.auditorium}</p></div>
                        <div><p class="text-[10px] text-gray-400">Children</p><p class="font-bold">${r.children}</p></div>
                        <div><p class="text-[10px] text-gray-400">Workers</p><p class="font-bold text-amber-400">${r.workers}</p></div>
                        <div><p class="text-[10px] text-gray-400">Total Pop</p><p class="font-bold text-white">${r.total_population}</p></div>
                        <div><p class="text-[10px] text-gray-400">Balance</p><p class="font-bold text-emerald-400">${r.net_balance}</p></div>
                        <div><p class="text-[10px] text-gray-400">Vehicles/Keke/Bike</p><p class="font-bold">${r.vehicle}/${r.keke}/${r.bike}</p></div>
                    </div>
                    ${r.remark ? `<p class="text-gray-300 italic"><strong>Remark:</strong> ${r.remark}</p>` : ''}
                </div>
            `).join('');
        }

        async function loadAdminMemberCount() {
            const { count } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            const el = document.getElementById('statTotalMembers');
            if (el) el.innerText = (count ?? 0).toLocaleString();
        }

        function initAdminCharts() {
            const ctx1 = document.getElementById('financeChart')?.getContext('2d');
            if (ctx1) {
                new Chart(ctx1, { type: 'bar', data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'], datasets: [{ label: 'Inflow (₦)', data: [250000, 310000, 290000, 340000, 320000, 360000], backgroundColor: '#10b981', borderRadius: 4 }, { label: 'Expenses (₦)', data: [80000, 95000, 70000, 85000, 65000, 85000], backgroundColor: '#ef4444', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#9ca3af' } } }, scales: { x: { ticks: { color: '#9ca3af' } }, y: { ticks: { color: '#9ca3af' } } } } });
            }
            const ctx2 = document.getElementById('fellowshipChart')?.getContext('2d');
            if (ctx2) {
                new Chart(ctx2, { type: 'doughnut', data: { labels: ['Men Fellowship', 'Women Fellowship', 'Youth Fellowship'], datasets: [{ data: [35, 42, 23], backgroundColor: ['#2563eb', '#8b5cf6', '#f59e0b'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#9ca3af' } } } } });
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoadingScreen();
            }
        });
    </script>
</body>
</html>
