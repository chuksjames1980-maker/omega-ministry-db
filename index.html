        :root {
            --bg-deep: #060a17;
            --card-dark: #0f172e;
            --accent-blue: #2563eb;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --project-purple: #8b5cf6;
            --warning-amber: #f59e0b;
        }
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at top right, rgba(37, 99, 235, 0.08), transparent 45%), radial-gradient(circle at bottom left, rgba(245, 158, 11, 0.05), transparent 40%);
            color: #f9f9fa;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card-bg {
            background: linear-gradient(180deg, rgba(20, 30, 58, 0.92) 0%, rgba(12, 19, 39, 0.96) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
        }
        .premium-stat-card {
            background: linear-gradient(165deg, rgba(23, 35, 68, 0.92) 0%, rgba(10, 16, 34, 0.98) 100%);

            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);

        .premium-stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideInRight 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spinSlow 3s linear infinite;
        }
    </style>

    <!-- JAVASCRIPT APPLICATION CONTROLLER -->
    <script>
        // =========================================================================
        // PWA MANIFEST, ICON FALLBACK & SERVICE WORKER FOR "OMEGA MINISTRY DN"
        // =========================================================================
        const PWA_APP_NAME = "OMEGA MINISTRY DN";
        const PWA_SHORT_NAME = "OMEGA MINISTRY DN";
        const PWA_ICON_URL = "./icon-512.png";
        let deferredPwaInstallPrompt = null;

        function getFallbackSvgIconDataUrl() {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <defs>
                        <radialGradient id="goldBg" cx="40%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#fde047"/>
                            <stop offset="55%" stop-color="#eab308"/>
                            <stop offset="100%" stop-color="#a16207"/>
                        </radialGradient>
                    </defs>
                    <circle cx="256" cy="256" r="248" fill="url(#goldBg)" stroke="#fef08a" stroke-width="8"/>
                    <path d="M120 420 V290 H205 V420 Z M195 420 V180 H315 V420 Z M305 420 V260 H392 V420 Z" fill="#060a17"/>
                    <path d="M256 125 L286 245 L270 355 L256 375 L242 355 L226 245 Z" fill="#ef4444" stroke="#060a17" stroke-width="8"/>
                    <rect x="200" y="340" width="112" height="18" rx="6" fill="#fef08a" stroke="#060a17" stroke-width="6"/>
                    <path d="M150 155 Q205 95 260 125 Q225 140 232 175 Q190 165 150 155 Z" fill="#fef08a" stroke="#060a17" stroke-width="7"/>
                </svg>
            `.trim();
            return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        }

        function initPwaSupport() {
            const fallbackIcon = getFallbackSvgIconDataUrl();

            // Test if ./icon-512.png exists; if not, fall back to SVG icon cleanly
            const testImg = new Image();
            testImg.onload = () => {
                applyManifestAndIcons(PWA_ICON_URL);
            };
            testImg.onerror = () => {
                applyManifestAndIcons(fallbackIcon);
            };
            testImg.src = PWA_ICON_URL;

            function applyManifestAndIcons(iconSrc) {
                const appleLink = document.getElementById("appleTouchIconLink");
                if (appleLink) appleLink.href = iconSrc;

                const manifestObj = {
                    name: PWA_APP_NAME,
                    short_name: PWA_SHORT_NAME,
                    description: "Omega City of Mercy Glorious Ministry Database",
                    start_url: "./",
                    scope: "./",
                    display: "standalone",
                    orientation: "portrait",
                    background_color: "#060a17",
                    theme_color: "#060a17",
                    icons: [
                        {
                            src: iconSrc,
                            sizes: "192x192",
                            type: iconSrc.startsWith("data:") ? "image/svg+xml" : "image/png",
                            purpose: "any"
                        },
                        {
                            src: iconSrc,
                            sizes: "512x512",
                            type: iconSrc.startsWith("data:") ? "image/svg+xml" : "image/png",
                            purpose: "any maskable"
                        }
                    ]
                };

                const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
                const manifestUrl = URL.createObjectURL(manifestBlob);
                let manifestLink = document.querySelector('link[rel="manifest"]');
                if (!manifestLink) {
                    manifestLink = document.createElement("link");
                    manifestLink.rel = "manifest";
                    document.head.appendChild(manifestLink);
                }
                manifestLink.href = manifestUrl;
            }

            // Register Service Worker if supported and on http/https
            if ("serviceWorker" in navigator && (window.location.protocol === "https:" || window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")) {
                const swCode = `
                    const CACHE_NAME = 'omega-ministry-dn-v1';
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (event) => {
                        event.waitUntil(self.clients.claim());
                    });
                    self.addEventListener('fetch', (event) => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            fetch(event.request).catch(() => caches.match(event.request))
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: "application/javascript" });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch((err) => {
                    console.warn("Service worker registration skipped/failed:", err);
                });
            }

            window.addEventListener("beforeinstallprompt", (e) => {
                e.preventDefault();
                deferredPwaInstallPrompt = e;
            });
        }

        async function triggerDownloadOrInstallApp() {
            if (deferredPwaInstallPrompt) {
                deferredPwaInstallPrompt.prompt();
                const choiceResult = await deferredPwaInstallPrompt.userChoice;
                deferredPwaInstallPrompt = null;
                if (choiceResult && choiceResult.outcome === "accepted") {
                    showModal("App Installed", `${PWA_APP_NAME} has been added to your device.`);
                }
                return;
            }

            const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
            if (isIos) {
                showModal(
                    `Install ${PWA_APP_NAME}`,
                    `1. Tap the Share button (square with arrow) in Safari.\n2. Scroll down and tap "Add to Home Screen".\n3. Confirm the name "${PWA_APP_NAME}" and tap Add.`
                );
            } else {
                showModal(
                    `Install ${PWA_APP_NAME}`,
                    `To install ${PWA_APP_NAME} on your phone or computer:\n1. Open your browser menu (⋮ or ...).\n2. Tap "Install app" or "Add to Home screen".`
                );
            }
        }

        initPwaSupport();

        // =========================================================================
        // LIVE SUPABASE CONFIGURATION
        // =========================================================================
        const SUPABASE_URL = "https://bugzrhjmedzubwwhvrql.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_3jzku7vSLCqz5Bw8BYO0uw_5FhrbAir";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const GROUP_EXCO_ROLES = ['Vice', 'PRO', 'Treasurer', 'Secretary', 'Dues Collector'];
        const DUES_COLLECTION_AMOUNTS = [
            500, 100, 1500, 200, 2500, 3000, 3500, 4000, 4500, 5000, 5500, 6000,
            6500, 7000, 7500, 8000, 8500, 9000, 9500, 10000, 10500, 11000, 11500, 12000
        ];

        const getLogoHtml = (size = "w-24 h-24") => `
            <div class="${size} mx-auto rounded-full p-0.5 bg-gradient-to-tr from-yellow-600 via-amber-400 to-yellow-200 shadow-xl flex items-center justify-center relative overflow-hidden">
                <div class="w-full h-full rounded-full bg-black flex flex-col items-center justify-center relative">
                    <div class="absolute inset-0 bg-[radial-gradient(#f59e0b_1px,transparent_1px)] [background-size:6px_6px] opacity-20"></div>
                    <i class="fa-solid fa-dove text-amber-400 text-2xl mb-0.5"></i>
                    <div class="flex space-x-0.5 items-end">
                        <div class="w-1.5 h-6 bg-amber-600 rounded-t"></div>
                        <div class="w-2.5 h-9 bg-red-600 rounded-t shadow-[0_0_8px_#ef4444]"></div>
                        <div class="w-1.5 h-6 bg-amber-600 rounded-t"></div>
                    </div>
                </div>
            </div>
        `;

        // State Management & LocalStorage Persistence
        let activeMemberSession = JSON.parse(localStorage.getItem('ocm_member_session')) || null;
        let activeAdminSession = JSON.parse(localStorage.getItem('ocm_admin_session')) || null;
        let activeFellowshipContext = null;
        let activeAssignLeaderFellowship = null;
        let selectedLeaderActionByMember = {};
        let expandedLeaderMemberId = null;

        // Group Exco Assignment, Dues Collector & PRO State
        let expandedGroupExcoMemberId = null;
        let expandedDuesCollectorMemberId = null;
        let duesCollectorDirectoryCache = [];
        let expandedProMemberId = null;
        let proDirectoryCache = [];
        let expandedLeaderAttendanceMemberId = null;

        // Treasurer Transfer Wizard State
        let treasurerFlowState = {
            subView: 'cards',
            recipientType: '',
            selectedAccount: null,
            amount: '',
            details: '',
            showProofStep: false,
            proofDataUrl: '',
            proofFileName: ''
        };
        let pendingConfirmActionCallback = null;

        // Workers Leader Assignment Wizard State
        let workersAssignStep = 'select_workers_leader';
        let openWorkerDropdownId = null;
        let pendingWorkersLeaderId = null;
        let pendingViceLeaderId = null;

        let expandedDirectoryMemberId = null;
        let openDirectoryDropdownId = null;
        let pendingDeleteMember = null;
        let allAdminDirectoryMembers = [];
        let groupLeaderSubView = 'home';
        let currentGroupLeaderMetrics = null;
        let currentWorkersPortalMetrics = null;
        let activeWorkersPortalMode = 'workers_leader';
        let pendingProfileAvatarDataUrl = null;
        let registrationData = {
            fullName: '', phone: '', whatsapp: '', dob: '', email: '',
            address: '', stateOfOrigin: '', stateOfResidence: '', nationality: 'Nigeria',
            gender: '', isMarried: '', fellowship: '', isWorker: '', department: '',
            dateJoined: '', pin: ''
        };
        let loadingTimer = null;
        let modalCallback = null;

        function closeSidebarIfMobile(sidebarId = 'sidebar') {
            if (window.innerWidth < 1024) {
                const sb = document.getElementById(sidebarId);
                if (sb && !sb.classList.contains('-translate-x-full')) {
                    sb.classList.add('-translate-x-full');
                }
            }
        }

        function formatNaira(amount) {
            const num = Number(amount || 0);
            return '₦' + num.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatMonthLabel(ym) {
            if (!ym || !/^\d{4}-\d{2}$/.test(ym)) return ym || 'N/A';
            const [y, m] = ym.split('-').map(Number);
            const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${names[(m - 1) % 12]} ${y}`;
        }

        function getCurrentYearMonth() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function addMonthsToYearMonth(ym, delta) {
            const [y, m] = ym.split('-').map(Number);
            const total = (y * 12 + (m - 1)) + delta;
            const ny = Math.floor(total / 12);
            const nm = (total % 12) + 1;
            return `${ny}-${String(nm).padStart(2, '0')}`;
        }

        function diffMonthsInclusive(startYm, endYm) {
            const [sy, sm] = startYm.split('-').map(Number);
            const [ey, em] = endYm.split('-').map(Number);
            return (ey * 12 + (em - 1)) - (sy * 12 + (sm - 1)) + 1;
        }

        // =========================================================================
        // GLOBAL DEFAULT DUES, GROUP SETTINGS, EXCOS, DUES LEDGER, PRO & TREASURER
        // =========================================================================
        function getGlobalDefaultDues() {
            const saved = Number(localStorage.getItem('ocm_global_default_dues_v1') || 0);
            return saved > 0 ? saved : 500;
        }

        function setGlobalDefaultDues(amount) {
            const val = Number(amount) > 0 ? Number(amount) : 500;
            localStorage.setItem('ocm_global_default_dues_v1', String(val));
            let all = {};
            try { all = JSON.parse(localStorage.getItem('ocm_group_settings_v1') || '{}'); } catch (e) {}
            ['Men Fellowship', 'Women Fellowship', 'Youth Fellowship'].forEach(g => {
                all[g] = { ...(all[g] || {}), monthlyDues: val };
            });
            localStorage.setItem('ocm_group_settings_v1', JSON.stringify(all));
        }

        function getGroupSettings(fellowshipName) {
            const globalDefault = getGlobalDefaultDues();
            try {
                const all = JSON.parse(localStorage.getItem('ocm_group_settings_v1') || '{}');
                const entry = all[fellowshipName] || {};
                return {
                    monthlyDues: Number(entry.monthlyDues) > 0 ? Number(entry.monthlyDues) : globalDefault,
                    leaderBankName: entry.leaderBankName || '',
                    leaderAccountName: entry.leaderAccountName || '',
                    leaderAccountNumber: entry.leaderAccountNumber || ''
                };
            } catch (e) {
                return { monthlyDues: globalDefault, leaderBankName: '', leaderAccountName: '', leaderAccountNumber: '' };
            }
        }

        function saveGroupSettings(fellowshipName, updated) {
            let all = {};
            try { all = JSON.parse(localStorage.getItem('ocm_group_settings_v1') || '{}'); } catch (e) {}
            all[fellowshipName] = { ...getGroupSettings(fellowshipName), ...updated };
            localStorage.setItem('ocm_group_settings_v1', JSON.stringify(all));
        }

        function getGroupExcoAssignments(fellowshipName) {
            try {
                const all = JSON.parse(localStorage.getItem('ocm_group_exco_roles_v1') || '{}');
                return Array.isArray(all[fellowshipName]) ? all[fellowshipName] : [];
            } catch (e) {
                return [];
            }
        }

        function saveGroupExcoAssignments(fellowshipName, list) {
            let all = {};
            try { all = JSON.parse(localStorage.getItem('ocm_group_exco_roles_v1') || '{}'); } catch (e) {}
            all[fellowshipName] = list;
            localStorage.setItem('ocm_group_exco_roles_v1', JSON.stringify(all));
        }

        function getMemberGroupExcoProfile(member) {
            if (!member) return null;
            const userFellowship = member?.member_fellowships?.[0]?.fellowships?.name || inferFellowshipFromMember(member);
            const all = JSON.parse(localStorage.getItem('ocm_group_exco_roles_v1') || '{}');
            for (const [fName, entries] of Object.entries(all)) {
                const found = (entries || []).find(e => String(e.memberId) === String(member.id));
                if (found && Array.isArray(found.roles) && found.roles.length > 0) {
                    return { fellowshipName: fName, roles: found.roles, memberName: member.full_name };
                }
            }
            const fallback = getGroupExcoAssignments(userFellowship).find(e => String(e.memberId) === String(member.id));
            if (fallback && Array.isArray(fallback.roles) && fallback.roles.length > 0) {
                return { fellowshipName: userFellowship, roles: fallback.roles, memberName: member.full_name };
            }
            return null;
        }

        function getAllDuesPaymentsLedger() {
            try {
                const parsed = JSON.parse(localStorage.getItem('ocm_member_dues_payments_v1') || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function saveAllDuesPaymentsLedger(list) {
            localStorage.setItem('ocm_member_dues_payments_v1', JSON.stringify(list));
        }

        function computeMemberDuesAccount(member, fellowshipName) {
            const settings = getGroupSettings(fellowshipName);
            const monthlyRate = Number(settings.monthlyDues) || getGlobalDefaultDues();
            const currentYm = getCurrentYearMonth();

            let startYm = '2026-01';
            if (member?.date_joined && /^\d{4}-\d{2}/.test(member.date_joined)) {
                startYm = member.date_joined.slice(0, 7);
            }
            if (startYm > currentYm) {
                startYm = currentYm;
            }

            const payments = getAllDuesPaymentsLedger()
                .filter(p => String(p.memberId) === String(member.id))
                .sort((a, b) => new Date(a.paidAt) - new Date(b.paidAt));

            const totalPaidAmount = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);

            let cursorYm = startYm;
            let unallocatedRemainder = 0;
            const paidMonthEntries = [];

            const detailedPayments = payments.map(p => {
                const rateAtTime = Number(p.rateAtPayment || monthlyRate);
                const available = Number(p.amount || 0) + unallocatedRemainder;
                const monthsCovered = Math.floor(available / rateAtTime);
                unallocatedRemainder = available % rateAtTime;

                const coveredFrom = monthsCovered > 0 ? cursorYm : null;
                const coveredTo = monthsCovered > 0 ? addMonthsToYearMonth(cursorYm, monthsCovered - 1) : null;
                for (let i = 0; i < monthsCovered; i++) {
                    const mYm = addMonthsToYearMonth(cursorYm, i);
                    paidMonthEntries.push({
                        ym: mYm,
                        label: formatMonthLabel(mYm),
                        amount: rateAtTime,
                        paidAt: p.paidAt,
                        isAdvance: mYm > currentYm
                    });
                }
                if (monthsCovered > 0) {
                    cursorYm = addMonthsToYearMonth(cursorYm, monthsCovered);
                }
                return {
                    ...p,
                    rateAtTime,
                    monthsCovered,
                    coveredFrom,
                    coveredTo
                };
            });

            if (unallocatedRemainder >= monthlyRate) {
                const extraMonths = Math.floor(unallocatedRemainder / monthlyRate);
                unallocatedRemainder = unallocatedRemainder % monthlyRate;
                for (let i = 0; i < extraMonths; i++) {
                    const mYm = addMonthsToYearMonth(cursorYm, i);
                    paidMonthEntries.push({
                        ym: mYm,
                        label: formatMonthLabel(mYm),
                        amount: monthlyRate,
                        paidAt: new Date().toISOString(),
                        isAdvance: mYm > currentYm
                    });
                }
                cursorYm = addMonthsToYearMonth(cursorYm, extraMonths);
            }

            const lastPaidYm = cursorYm > startYm ? addMonthsToYearMonth(cursorYm, -1) : null;
            const totalExpectedMonths = Math.max(1, diffMonthsInclusive(startYm, currentYm));

            let monthsOwing = 0;
            let advanceMonths = 0;
            const unpaidMonthsList = [];

            if (cursorYm <= currentYm) {
                monthsOwing = diffMonthsInclusive(cursorYm, currentYm);
                for (let i = 0; i < monthsOwing; i++) {
                    const mYm = addMonthsToYearMonth(cursorYm, i);
                    unpaidMonthsList.push({
                        ym: mYm,
                        label: formatMonthLabel(mYm),
                        amount: monthlyRate
                    });
                }
            } else {
                advanceMonths = diffMonthsInclusive(addMonthsToYearMonth(currentYm, 1), cursorYm);
            }

            const arrearsAmount = monthsOwing * monthlyRate;
            const advanceAmount = (advanceMonths * monthlyRate) + unallocatedRemainder;
            const paidMonthsUpToNow = Math.max(0, totalExpectedMonths - monthsOwing);
            const completionPercent = Math.min(100, Math.round((paidMonthsUpToNow / totalExpectedMonths) * 100));

            return {
                fellowshipName,
                monthlyRate,
                startYm,
                currentYm,
                lastPaidYm,
                nextDueYm: cursorYm,
                totalPaidAmount,
                monthsOwing,
                arrearsAmount,
                unpaidMonthsList,
                paidMonthEntries,
                advanceMonths,
                advanceAmount,
                completionPercent,
                payments: detailedPayments
            };
        }

        async function executeConfirmedMemberDelete() {
            if (!pendingDeleteMember) return;
            const target = pendingDeleteMember;
            const yesBtn = document.getElementById('confirmDeleteYesBtn');
            if (yesBtn) {
                yesBtn.disabled = true;
                yesBtn.innerText = 'Deleting...';
            }

            try {
                const cleanupTables = [
                    'member_fellowships',
                    'member_departments',
                    'group_leaders',
                    'report_takers',
                    'population_reports'
                ];

                for (const tableName of cleanupTables) {
                    const { error: cleanErr } = await supabaseClient
                        .from(tableName)
                        .delete()
                        .eq('member_id', target.id);

                    if (cleanErr && !/does not exist|schema cache|relation/i.test(cleanErr.message || '')) {
                        throw cleanErr;
                    }
                }

                const { data: deletedRows, error } = await supabaseClient
                    .from('members')
                    .delete()
                    .eq('id', target.id)
                    .select('id');

                if (error) throw error;

                if (!deletedRows || deletedRows.length === 0) {
                    throw new Error(
                        'Delete was blocked by Supabase Row Level Security (RLS) policy on the "members" table. Add a DELETE policy for anon/authenticated in Supabase SQL Editor and try again.'
                    );
                }

                closeConfirmDeleteModal();
                expandedDirectoryMemberId = null;
                openDirectoryDropdownId = null;

                showModal('Member Deleted', `"${target.name}" has been deleted from the database.`, async () => {
                    await renderAllMembersDirectoryView();
                    if (document.getElementById('statTotalMembers')) {
                        await loadAdminMemberCount();
                    }
                });
            } catch (err) {
                closeConfirmDeleteModal();
                showModal('Delete Failed', err.message || 'Could not delete member.', null, false);
            } finally {
                if (yesBtn) {
                    yesBtn.disabled = false;
                    yesBtn.innerText = 'Yes';
                }
            }
        }

        async function hashPin(pin) {
            const encoder = new TextEncoder();
            const data = encoder.encode("OCM_SALT_" + pin);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function ensureFellowshipRecord(fellowshipName) {
            if (!fellowshipName) return { row: null, error: null };
            const { data: existing, error: selErr } = await supabaseClient
                .from('fellowships')
                .select('id, name')
                .eq('name', fellowshipName)
                .maybeSingle();

            if (selErr) return { row: null, error: selErr };
            if (existing) return { row: existing, error: null };

            const { data: inserted, error: insErr } = await supabaseClient
                .from('fellowships')
                .insert([{ name: fellowshipName }])
                .select('id, name')
                .maybeSingle();

            return { row: inserted || null, error: insErr };
        }

        async function fetchFellowshipGroupMembersList(fellowshipName) {
            const { row: fellowshipRow } = await ensureFellowshipRecord(fellowshipName);
            let membersFromJoin = [];
            if (fellowshipRow?.id) {
                const { data: mfRows, error: mfErr } = await supabaseClient
                    .from('member_fellowships')
                    .select('member_id, members(*)')
                    .eq('fellowship_id', fellowshipRow.id);
                if (!mfErr && Array.isArray(mfRows)) {
                    membersFromJoin = mfRows.map(r => r.members).filter(Boolean);
                }
            }

            if (membersFromJoin.length === 0) {
                const { data: allMembers } = await supabaseClient.from('members').select('*');
                const matched = (allMembers || []).filter(m => inferFellowshipFromMember(m) === fellowshipName);
                if (fellowshipRow?.id) {
                    for (const mem of matched) {
                        await supabaseClient.from('member_fellowships').upsert(
                            [{ member_id: mem.id, fellowship_id: fellowshipRow.id }],
                            { onConflict: 'member_id,fellowship_id' }
                        );
                    }
                }
                membersFromJoin = matched;
            }

            return membersFromJoin.sort((a, b) => (a.full_name || '').localeCompare(b.full_name || ''));
        }

        async function fetchDepartmentMembersList() {
            const [{ data: mdRows }, { data: deptRows }, { data: allMembers }] = await Promise.all([
                supabaseClient.from('member_departments').select('member_id, department_id'),
                supabaseClient.from('departments').select('id, name'),
                supabaseClient.from('members').select('*')
            ]);

            const deptMap = new Map((deptRows || []).map(d => [String(d.id), d.name]));
            const memberMap = new Map((allMembers || []).map(m => [String(m.id), m]));
            const combinedByMemberId = new Map();

            (mdRows || []).forEach(row => {
                const mem = memberMap.get(String(row.member_id));
                if (mem) {
                    const dName = deptMap.get(String(row.department_id)) || mem.assigned_department || 'Worker';
                    combinedByMemberId.set(String(mem.id), {
                        id: mem.id,
                        full_name: mem.full_name,
                        phone: mem.phone || '',
                        member_id: mem.member_id || '',
                        department: dName
                    });
                }
            });

            (allMembers || []).forEach(mem => {
                const key = String(mem.id);
                if (!combinedByMemberId.has(key)) {
                    const hasDept = mem.assigned_department && mem.assigned_department !== 'None';
                    if (mem.is_worker || hasDept) {
                        combinedByMemberId.set(key, {
                            id: mem.id,
                            full_name: mem.full_name,
                            phone: mem.phone || '',
                            member_id: mem.member_id || '',
                            department: hasDept ? mem.assigned_department : 'Worker'
                        });
                    }
                }
            });

            return Array.from(combinedByMemberId.values()).sort((a, b) =>
                (a.full_name || '').localeCompare(b.full_name || '')
            );
        }

        async function resolveMemberDepartmentName(member) {
            const joinedDept = member?.member_departments?.[0]?.departments?.name;
            if (joinedDept && joinedDept !== 'None') return joinedDept;

            if (member?.id) {
                try {
                    const { data: mdRow } = await supabaseClient
                        .from('member_departments')
                        .select('department_id, departments(name)')
                        .eq('member_id', member.id)
                        .maybeSingle();

                    if (mdRow?.departments?.name && mdRow.departments.name !== 'None') {
                        return mdRow.departments.name;
                    }

                    if (mdRow?.department_id) {
                        const { data: dRow } = await supabaseClient
                            .from('departments')
                            .select('name')
                            .eq('id', mdRow.department_id)
                            .maybeSingle();
                        if (dRow?.name && dRow.name !== 'None') return dRow.name;
                    }
                } catch (e) {
                    console.warn('Department lookup fallback:', e);
                }
            }

            if (member?.assigned_department && member.assigned_department !== 'None') {
                return member.assigned_department;
            }

            return 'None';
        }

        function inferFellowshipFromMember(member) {
            const married = Boolean(member?.is_married);
            const gender = (member?.gender || '').toLowerCase();
            if (married) {
                return gender === 'female' ? 'Women Fellowship' : 'Men Fellowship';
            }
            return 'Youth Fellowship';
        }

        async function fetchWorkersLeadershipState() {

            try {
                const { data, error } = await supabaseClient
                    .from('workers_leaders')
                    .select('member_id, is_active, role_type');
                if (!error && Array.isArray(data)) {
                    let dbLeaderId = null;

                    data.forEach(row => {
                        if (row.is_active) {
                            if (row.role_type === 'vice_leader') {
                                dbViceId = row.member_id;
                            } else {
                                dbLeaderId = row.member_id;
                            }
                        }
                    });
                    return {
                        workersLeaderId: dbLeaderId || localState.workersLeaderId,
                        viceLeaderId: dbViceId || localState.viceLeaderId
                    };
                }
            } catch (e) {

        async function saveWorkersLeadershipPair(workersLeaderId, viceLeaderId) {
            const finalLeaderId = workersLeaderId || null;
            const finalViceId = (viceLeaderId && viceLeaderId !== finalLeaderId) ? viceLeaderId : null;

            setLocalWorkersLeadershipState({
                workersLeaderId: finalLeaderId,
                viceLeaderId: finalViceId
            });

            try {
                await supabaseClient.from('workers_leaders').update({ is_active: false }).neq('id', '00000000-0000-0000-0000-000000000000');

                if (finalLeaderId) {
                    const { data: exL } = await supabaseClient.from('workers_leaders').select('id').eq('member_id', finalLeaderId).maybeSingle();
                    if (exL?.id) {
                        await supabaseClient.from('workers_leaders').update({ is_active: true, role_type: 'workers_leader' }).eq('id', exL.id);
                    } else {
                        await supabaseClient.from('workers_leaders').insert([{ member_id: finalLeaderId, is_active: true, role_type: 'workers_leader' }]);
                    }
                }

                if (finalViceId) {
                    const { data: exV } = await supabaseClient.from('workers_leaders').select('id').eq('member_id', finalViceId).maybeSingle();
                    if (exV?.id) {
                        await supabaseClient.from('workers_leaders').update({ is_active: true, role_type: 'vice_leader' }).eq('id', exV.id);
                    } else {
                        await supabaseClient.from('workers_leaders').insert([{ member_id: finalViceId, is_active: true, role_type: 'vice_leader' }]);
                    }
                }
            } catch (e) {
                console.warn('workers_leaders table sync fallback:', e);
            }

            return { workersLeaderId: finalLeaderId, viceLeaderId: finalViceId };
        }

        async function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            const btn = document.getElementById('regSubmitBtn');
            if (pin !== confirmPin) {
                showAlert('regAlert', 'PIN numbers do not match! Please verify.');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                showAlert('regAlert', 'PIN must be exactly 4 numeric digits.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Saving to Database...';
            try {
                registrationData.dateJoined = document.getElementById('regDateJoined').value;
                const hashedPin = await hashPin(pin);
                const generatedMemberId = `OCM/MEM/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
                const formattedJoinDate = registrationData.dateJoined ? `${registrationData.dateJoined}-01` : new Date().toISOString().split('T')[0];

                const isWorkerBool = registrationData.isWorker === 'yes';
                const chosenDept = isWorkerBool && registrationData.department && registrationData.department !== 'None'
                    ? registrationData.department
                    : null;

                const baseMemberPayload = {
                    member_id: generatedMemberId,
                    full_name: registrationData.fullName,
                    gender: registrationData.gender,
                    phone: registrationData.phone,
                    whatsapp: registrationData.whatsapp || null,
                    email: registrationData.email || null,
                    address: registrationData.address,
                    date_of_birth: registrationData.dob,
                    nationality: registrationData.nationality,
                    state: registrationData.stateOfOrigin,
                    residence_state: registrationData.stateOfResidence,
                    is_married: registrationData.isMarried === 'yes',
                    is_worker: isWorkerBool,
                    date_joined: formattedJoinDate,
                    pin_code: hashedPin
                };

                let insertRes = await supabaseClient
                    .from('members')
                    .insert([{ ...baseMemberPayload, assigned_department: chosenDept }])
                    .select()
                    .single();

                if (insertRes.error && /assigned_department|schema cache|column/i.test(insertRes.error.message || '')) {
                    insertRes = await supabaseClient
                        .from('members')
                        .insert([baseMemberPayload])
                        .select()
                        .single();
                }

                if (insertRes.error) throw insertRes.error;
                const insertedMember = insertRes.data;

                const { row: fellowshipRow } = await ensureFellowshipRecord(registrationData.fellowship);
                if (fellowshipRow) {
                    await supabaseClient.from('member_fellowships').insert([{ member_id: insertedMember.id, fellowship_id: fellowshipRow.id }]);
                }

                if (isWorkerBool && chosenDept) {
                    const { row: deptRow, error: deptErr } = await ensureDepartmentRecord(chosenDept);
                    if (deptErr) throw deptErr;
                    if (deptRow) {
                        const { error: mdErr } = await supabaseClient
                            .from('member_departments')
                            .upsert([{ member_id: insertedMember.id, department_id: deptRow.id }], { onConflict: 'member_id,department_id' });
                        if (mdErr) {
                            await supabaseClient.from('member_departments').insert([{ member_id: insertedMember.id, department_id: deptRow.id }]);
                        }
                    }
                }

                const deptSummary = chosenDept ? ` | Department: ${chosenDept}` : '';

                showModal(
                    "Registration Successful",
                    `Your membership profile has been created successfully. Your assigned Member ID is ${generatedMemberId} (${registrationData.fellowship}${deptSummary}). Please proceed to log in.`,
                    () => { renderLoginPage(); }
                );

        async function refreshMemberSession(memberId) {
            const { data: member } = await supabaseClient
                .from('members')
                .select(`*, member_fellowships(fellowships(id, name)), member_departments(departments(id, name)), group_leaders(id, is_active, fellowship_id, fellowships(id, name)), report_takers(is_active)`)
                .eq('id', memberId)
                .maybeSingle();
            if (member) {
                const resolvedDept = await resolveMemberDepartmentName(member);
                member.assigned_department = resolvedDept;
                if (resolvedDept !== 'None' && (!member.member_departments || member.member_departments.length === 0)) {
                    member.member_departments = [{ departments: { name: resolvedDept } }];
                }

                const wState = await fetchWorkersLeadershipState();
                member.is_workers_leader = wState.workersLeaderId === member.id;
                member.is_vice_leader = wState.viceLeaderId === member.id;
                member.exco_profile = getMemberGroupExcoProfile(member);
                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
            }
            return member;
        }

        async function handleMemberLogin() {
            const identifier = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const btn = document.getElementById('memberLoginBtn');
            if (!identifier || !pin) {
                showAlert('loginAlert', 'Please enter your Phone Number / Member ID and PIN.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Verifying PIN...';
            try {
                const hashedPin = await hashPin(pin);
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select(`*, member_fellowships(fellowships(id, name)), member_departments(departments(id, name)), group_leaders(id, is_active, fellowship_id, fellowships(id, name)), report_takers(is_active)`)
                    .or(`phone.eq.${identifier},member_id.eq.${identifier}`)
                    .eq('pin_code', hashedPin)
                    .maybeSingle();

                if (error || !member) throw new Error('Invalid Phone Number/Member ID or 4-Digit PIN.');
                if (member.membership_status !== 'Active') throw new Error(`Account is currently ${member.membership_status}.`);

                const resolvedDept = await resolveMemberDepartmentName(member);
                member.assigned_department = resolvedDept;
                if (resolvedDept !== 'None' && (!member.member_departments || member.member_departments.length === 0)) {
                    member.member_departments = [{ departments: { name: resolvedDept } }];
                }

                const wState = await fetchWorkersLeadershipState();
                member.is_workers_leader = wState.workersLeaderId === member.id;
                member.is_vice_leader = wState.viceLeaderId === member.id;
                member.exco_profile = getMemberGroupExcoProfile(member);

                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
                renderMemberDashboardShell();
            } catch (err) {
                showAlert('loginAlert', err.message || 'Login failed.');
                btn.disabled = false;
                btn.innerText = 'Member Login';
            }
        }

        function toggleDuesCollectorMemberRow(memberId, fellowshipName) {
            expandedDuesCollectorMemberId = expandedDuesCollectorMemberId === memberId ? null : memberId;

        function recordCollectedMemberDues(memberId, memberName, fellowshipName) {
            const selectEl = document.getElementById(`duesAmountDropdown-${memberId}`);
            const amount = Number(selectEl?.value || 500);
            const settings = getGroupSettings(fellowshipName);
            const targetMember = duesCollectorDirectoryCache.find(m => String(m.id) === String(memberId)) || { id: memberId, full_name: memberName };

            const ledger = getAllDuesPaymentsLedger();
            ledger.push({
                id: 'dues-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                memberId: String(memberId),
                memberName,
                fellowshipName,
                amount,
                rateAtPayment: settings.monthlyDues,
                collectedBy: activeMemberSession?.full_name || 'Dues Collector',
                paidAt: new Date().toISOString()
            });
            saveAllDuesPaymentsLedger(ledger);

            const updatedAcct = computeMemberDuesAccount(targetMember, fellowshipName);
            const advNote = updatedAcct.advanceAmount > 0
                ? `\nAdvance Balance: ${formatNaira(updatedAcct.advanceAmount)} (${updatedAcct.advanceMonths} month(s) ahead)`
                : `\nRemaining Arrears: ${formatNaira(updatedAcct.arrearsAmount)} (${updatedAcct.monthsOwing} month(s))`;

            showModal(
                'Dues Paid & Saved',
                `Saved ${formatNaira(amount)} to ${memberName}'s Total Dues.\nLast Paid Month: ${updatedAcct.lastPaidYm ? formatMonthLabel(updatedAcct.lastPaidYm) : 'N/A'}${advNote}`,
                () => {
                    expandedDuesCollectorMemberId = null;
                    filterDuesCollectorMembers(fellowshipName);
                }
            );
        }

        function computeGroupPurseStats(fellowshipName) {
            const ledger = getAllDuesPaymentsLedger().filter(p => p.fellowshipName === fellowshipName);
            const collectedDuesTotal = ledger.reduce((sum, p) => sum + Number(p.amount || 0), 0);

            const transfers = getTreasurerTransfers().filter(t => t.fellowshipName === fellowshipName);
            const receivedByAdminTotal = transfers
                .filter(t => t.status === 'admin_received')
                .reduce((sum, t) => sum + Number(t.amount || 0), 0);

            const basePurse = 205500 + collectedDuesTotal;
            const currentBalance = Math.max(0, basePurse - receivedByAdminTotal);

            return {
                basePurse,
                collectedDuesTotal,
                receivedByAdminTotal,
                currentBalance,
                transfers
            };
        }

            const amt = Number(document.getElementById('treasurerSendAmountInput')?.value || 0);

            if (amt <= 0) {
                showModal('Invalid Amount', 'Please enter a valid amount to send.', null, false);
                return;

            if (!details) {
                showModal('Details Required', 'Please enter transaction details before proceeding.', null, false);
                return;

            treasurerFlowState.amount = String(amt);
            treasurerFlowState.details = details;
            treasurerFlowState.showProofStep = true;
            renderTreasurerModule(fellowshipName);
        }

        function handleTreasurerProofFile(event, fellowshipName) {
            const file = event?.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                treasurerFlowState.proofDataUrl = e.target.result;
                treasurerFlowState.proofFileName = file.name;
                renderTreasurerModule(fellowshipName);
            };
            reader.readAsDataURL(file);
        }

        function approveWorkersSaveItem(index) {
            const saves = getWorkersSavedItems();
            if (!saves[index]) return;
            saves[index].status = 'Approved';
            saves[index].approvedBy = activeMemberSession?.full_name || 'Workers Leader';
            setWorkersSavedItems(saves);
            showModal('Save Approved', `Saved item of ${formatNaira(saves[index].amount)} has been approved.`, () => {
                switchWorkersLeaderView('approve-save');
            });
        }

        function submitViceWorkersReport(e) {
            e.preventDefault();
            const title = document.getElementById('viceRepTitle')?.value.trim() || 'Workers Report';
            const date = document.getElementById('viceRepDate')?.value || new Date().toISOString().split('T')[0];
            const totalWorkers = parseInt(document.getElementById('viceRepCount')?.value || '0', 10);
            const notes = document.getElementById('viceRepNotes')?.value.trim() || '';

            const reports = getWorkersSubmittedReports();
            reports.unshift({
                id: 'wr-' + Date.now(),
                title,
                date,
                totalWorkers,
                notes
            });
            setWorkersSubmittedReports(reports);
            showModal('Report Saved', 'Workers report has been recorded.', () => {
                switchWorkersLeaderView('view-report');
            });
        }

        function saveWorkerExcoAssignment() {
            const memberName = document.getElementById('workerExcoMemberSelect')?.value || 'Worker';
            const roleName = document.getElementById('workerExcoRoleSelect')?.value || 'Exco';
            const list = getWorkersExcosList();
            list.push({ memberName, role: roleName, assignedAt: new Date().toISOString() });
            saveWorkersExcosList(list);
            showModal('Exco Role Assigned', `${memberName} has been assigned the role of ${roleName}.`, () => {
                switchWorkersLeaderView('assign-excos');
            });
        }

        function removeWorkerExcoAssignment(index) {
            const list = getWorkersExcosList();
            list.splice(index, 1);
            saveWorkersExcosList(list);
            switchWorkersLeaderView('assign-excos');
        }

        async function loadGroupLeaderFinancialData(fellowshipName, fellowshipId) {
            const groupMembers = await fetchFellowshipGroupMembersList(fellowshipName);

            const collectedLedger = getAllDuesPaymentsLedger().filter(p => p.fellowshipName === fellowshipName);
            const liveCollectedDues = collectedLedger.reduce((sum, p) => sum + Number(p.amount || 0), 0);

            const duesHistory = [
                { date: '2026-01-15', amount: 45000 },
                { date: '2026-02-14', amount: 52000 },
                { date: '2026-03-18', amount: 48500 },
                { date: '2026-04-12', amount: 60000 },
                ...collectedLedger.map(p => ({ date: p.paidAt.split('T')[0], amount: Number(p.amount || 0) }))
            ];
            const totalDues = duesHistory.reduce((sum, item) => sum + Number(item.amount), 0);

            const oldDuesItems = [
                { label: '2025 Brought-Forward Dues', date: '2025-12-28', amount: 35000 },
                { label: 'Previous Quarter Arrears Recovered', date: '2026-01-20', amount: 15000 }
            ];
            const totalOldDues = oldDuesItems.reduce((sum, item) => sum + Number(item.amount), 0);

            const expensesList = [
                { title: 'Fellowship Welfare & Visitation', date: '2026-02-10', amount: 22000 },
                { title: 'Group Meeting Refreshment & Printing', date: '2026-03-22', amount: 18500 },
                { title: 'Outreach Logistics', date: '2026-04-05', amount: 14000 }
            ];
            const totalExpenses = expensesList.reduce((sum, item) => sum + Number(item.amount), 0);

            const memberNamesList = groupMembers.length > 0
                ? groupMembers.map(gm => gm.full_name)
                : ['Samuel Okafor', 'Grace Eze', 'Daniel Musa', 'Esther Obi'];

            const halfIndex = Math.max(1, Math.ceil(memberNamesList.length / 2));
            const defaultPaidMembers = memberNamesList.slice(0, halfIndex);
            const defaultUnpaidMembers = memberNamesList.slice(halfIndex);

            const projectsList = [
                {
                    topic: `${fellowshipName} Hall Chairs & Sound Project`,
                    targetPerMember: 20000,
                    paidEntries: defaultPaidMembers.map((name, idx) => ({ name, amount: 20000, date: `2026-03-0${(idx % 9) + 1}` })),
                    unpaidEntries: defaultUnpaidMembers.map(name => ({ name, balanceDue: 20000 }))
                },
                {
                    topic: 'Annual Fellowship Retreat & Outreach Fund',
                    targetPerMember: 10000,
                    paidEntries: defaultPaidMembers.slice(0, Math.max(1, defaultPaidMembers.length - 1)).map((name, idx) => ({ name, amount: 10000, date: `2026-04-0${(idx % 9) + 1}` })),
                    unpaidEntries: [
                        ...(defaultPaidMembers.length > 1 ? [{ name: defaultPaidMembers[defaultPaidMembers.length - 1], balanceDue: 10000 }] : []),
                        ...defaultUnpaidMembers.map(name => ({ name, balanceDue: 10000 }))
                    ]
                }
            ];

            const totalProjectPaid = projectsList.reduce((sum, proj) => {
                return sum + proj.paidEntries.reduce((pSum, p) => pSum + Number(p.amount), 0);
            }, 0);

            const totalProjectUnpaid = projectsList.reduce((sum, proj) => {
                return sum + proj.unpaidEntries.reduce((uSum, u) => uSum + Number(u.balanceDue), 0);
            }, 0);

            const approvedRemittances = getTreasurerTransfers()
                .filter(t => t.fellowshipName === fellowshipName && t.status === 'admin_received')
                .map(t => ({
                    amount: Number(t.amount || 0),
                    date: (t.adminReceivedAt || t.createdAt || '').split('T')[0],
                    approvalName: t.leaderApprovedBy || 'Group Leader'
                }));

            const savedMoneyList = [
                { amount: 50000, date: '2026-02-25', approvalName: 'Chuks James' },
                { amount: 40000, date: '2026-04-15', approvalName: 'Chuks James' },
                ...approvedRemittances
            ];
            const totalSavedMoney = savedMoneyList.reduce((sum, s) => sum + Number(s.amount), 0);

            const totalInflow = totalDues + totalProjectPaid + totalOldDues;
            const totalArrears = groupMembers.reduce((sum, gm) => sum + computeMemberDuesAccount(gm, fellowshipName).arrearsAmount, 0);
            const totalBalance = Math.max(0, totalDues + totalProjectPaid - totalExpenses - totalSavedMoney);

            currentGroupLeaderMetrics = {
                fellowshipName,
                groupMembers,
                duesHistory,
                totalDues,
                liveCollectedDues,
                totalArrears,
                oldDuesItems,
                totalOldDues,
                expensesList,
                totalExpenses,
                projectsList,
                totalProjectPaid,
                totalProjectUnpaid,
                totalInflow,
                savedMoneyList,
                totalSavedMoney,
                totalBalance
            };
        }

        function saveMemberGroupExcoRoles(memberId, memberName, fellowshipName) {
            const checkboxes = document.querySelectorAll(`.group-exco-role-cb-${memberId}:checked`);
            const selectedRoles = Array.from(checkboxes).map(cb => cb.value);

            const list = getGroupExcoAssignments(fellowshipName).filter(a => String(a.memberId) !== String(memberId));
            if (selectedRoles.length > 0) {
                list.push({
                    memberId: String(memberId),
                    memberName,
                    fellowshipName,
                    roles: selectedRoles,
                    updatedAt: new Date().toISOString()
                });
            }
            saveGroupExcoAssignments(fellowshipName, list);

            const summary = selectedRoles.length > 0
                ? `${memberName} has been assigned: ${selectedRoles.join(', ')}.`
                : `All Exco roles removed for ${memberName}.`;

            showModal('Exco Roles Updated', summary, () => {
                expandedGroupExcoMemberId = null;
                filterGroupExcoMembers();
            });
        }

        async function saveGroupMonthlyDuesSetting(fellowshipName) {
            const val = Number(document.getElementById('groupMonthlyDuesInput')?.value || getGlobalDefaultDues());
            if (val <= 0) {
                showModal('Invalid Amount', 'Please enter a valid monthly dues figure.', null, false);
                return;
            }
            saveGroupSettings(fellowshipName, { monthlyDues: val });
            await loadGroupLeaderFinancialData(fellowshipName);
            showModal('Dues Rate Updated', `Monthly dues for ${fellowshipName} is now ${formatNaira(val)} and applies immediately.`, () => {
                switchLeaderWorkspaceView('settings');
            });
        }

        function saveGroupLeaderBankSetting(fellowshipName) {
            const leaderBankName = document.getElementById('groupLeaderBankNameInput')?.value.trim() || '';
            const leaderAccountName = document.getElementById('groupLeaderAcctNameInput')?.value.trim() || '';
            const leaderAccountNumber = document.getElementById('groupLeaderAcctNumInput')?.value.trim() || '';
            saveGroupSettings(fellowshipName, { leaderBankName, leaderAccountName, leaderAccountNumber });
            showModal('Bank Details Saved', 'Group Leader bank account details have been updated.');
        }

        async function submitGroupLeaderTransferDecision(txId) {
            const decision = document.getElementById(`leaderApproveSelect-${txId}`)?.value || 'yes';
            const transfers = getTreasurerTransfers();
            const tx = transfers.find(t => t.id === txId);
            if (!tx) return;

            if (decision === 'yes') {
                tx.status = 'leader_approved';
                tx.leaderApprovedBy = activeMemberSession?.full_name || 'Group Leader';
                tx.leaderApprovedAt = new Date().toISOString();
                saveTreasurerTransfers(transfers);

                pushMemberInboxNotification(
                    tx.treasurerId,
                    'Group Leader Approved Transfer',
                    `Your Group Leader (${tx.leaderApprovedBy}) has approved sending ${formatNaira(tx.amount)} to ${tx.accountName}. Awaiting Admin confirmation.`
                );

                showModal('Approved', 'Transfer approved! The Treasurer has been notified and Admin has received a notification in Bank.', async () => {
                    await openAssignedGroupLeaderWorkspace();
                    switchLeaderWorkspaceView('send-money-approval');
                });
            } else {
                tx.status = 'leader_rejected';
                tx.leaderApprovedBy = activeMemberSession?.full_name || 'Group Leader';
                saveTreasurerTransfers(transfers);

                pushMemberInboxNotification(
                    tx.treasurerId,
                    'Transfer Declined by Group Leader',
                    `Your Group Leader (${tx.leaderApprovedBy}) did not approve sending ${formatNaira(tx.amount)}.`
                );

                showModal('Declined', 'Transfer request declined and Treasurer notified.', async () => {
                    await openAssignedGroupLeaderWorkspace();
                    switchLeaderWorkspaceView('send-money-approval');
                });
            }
        }

        function addAdminBankAccount() {
            const bankName = document.getElementById('adminNewBankName')?.value.trim() || '';
            const accountName = document.getElementById('adminNewAcctName')?.value.trim() || '';
            const accountNumber = document.getElementById('adminNewAcctNum')?.value.trim() || '';
            if (!bankName || !accountName || !accountNumber) {
                showModal('Missing Fields', 'Please enter Bank Name, Account Name, and Account Number.', null, false);
                return;
            }
            const banks = getAdminBankAccounts();
            banks.push({ bankName, accountName, accountNumber });
            saveAdminBankAccounts(banks);
            showModal('Bank Account Added', `${accountName} (${bankName}) has been added.`, () => renderAdminBankModule());
        }

        function removeAdminBankAccount(idx) {
            const banks = getAdminBankAccounts();
            banks.splice(idx, 1);
            saveAdminBankAccounts(banks);
            renderAdminBankModule();
        }

        function confirmAdminReceivedTransfer(txId) {
            const transfers = getTreasurerTransfers();
            const tx = transfers.find(t => t.id === txId);
            if (!tx) return;
            tx.status = 'admin_received';
            tx.adminReceivedAt = new Date().toISOString();
            saveTreasurerTransfers(transfers);

            pushMemberInboxNotification(
                tx.treasurerId,
                'Admin Confirmed Receipt of Funds',
                `Main Admin has confirmed receipt of ${formatNaira(tx.amount)} (${tx.details || tx.fellowshipName}).`
            );

            showModal('Confirmed Received', `Marked ${formatNaira(tx.amount)} from ${tx.fellowshipName} as Received by Admin.`, () => {
                renderAdminBankModule();
            });
        }

        function filterAdminMembersDirectory() {
            const query = (document.getElementById('memberDirectorySearch')?.value || '').trim().toLowerCase();
            if (!query) {
                renderAdminMembersDirectoryRows(allAdminDirectoryMembers);
                return;
            }

        async function saveAssignedGroupLeader(memberId, memberName, fellowshipName) {
            const action = selectedLeaderActionByMember[memberId];
            if (action !== 'assign_leader') {
                showModal('Select Action', 'Please choose "Assign as Group Leader" from the dropdown before clicking Save.', null, false);
                return;
            }
            const { row: fellowshipRow, error: fErr } = await ensureFellowshipRecord(fellowshipName);
            if (fErr || !fellowshipRow) {
                showModal('Error', fErr?.message || 'Could not resolve fellowship.', null, false);
                return;
            }

            await supabaseClient.from('group_leaders').update({ is_active: false }).eq('fellowship_id', fellowshipRow.id);

            const { data: existingLeader } = await supabaseClient
                .from('group_leaders')
                .select('id')
                .eq('fellowship_id', fellowshipRow.id)
                .eq('member_id', memberId)
                .maybeSingle();

            let saveError = null;
            if (existingLeader?.id) {
                const { error } = await supabaseClient.from('group_leaders').update({ is_active: true }).eq('id', existingLeader.id);
                saveError = error;
            } else {
                const { error } = await supabaseClient.from('group_leaders').insert([{ fellowship_id: fellowshipRow.id, member_id: memberId, is_active: true }]);
                saveError = error;
            }

            if (saveError) {
                showModal('Assignment Failed', saveError.message, null, false);
                return;
            }

            if (activeMemberSession && activeMemberSession.id === memberId) {
                await refreshMemberSession(memberId);
            }

            showModal(
                'Group Leader Assigned',
                `${memberName} is now the assigned Group Leader for ${fellowshipName}. When ${memberName} logs into their Member Dashboard, the Group Leader Dashboard button will appear automatically.`,
                () => { openFellowshipGroupView(fellowshipName); }
            );
        }

        async function removeGroupLeader(leaderRowId, fellowshipName) {
            const { error } = await supabaseClient.from('group_leaders').update({ is_active: false }).eq('id', leaderRowId);
            if (error) {
                showModal('Error', error.message, null, false);
                return;
            }
            if (activeMemberSession?.id) {
                await refreshMemberSession(activeMemberSession.id);
            }
            showModal('Leader Removed', `Active group leader removed for ${fellowshipName}.`, () => {
                openFellowshipGroupView(fellowshipName);
            });
        }

                            </div>
                            ${isSelectingVice ? `
                                <button type="button" onclick="workersAssignStep = 'select_workers_leader'; openWorkerDropdownId = null; renderWorkersLeaderWizard(window.__cachedWorkersList || [])" class="text-xs text-amber-300 hover:underline">
                                    Change Workers Leader
                                </button>
                            ` : ''}
                        </div>
                    ` : ''}

                    <div class="divide-y divide-white/5">
                        ${workersList.length > 0 ? workersList.map(w => {
                            const isOpen = openWorkerDropdownId === w.id;
                            const safeName = (w.full_name || '').replace(/'/g, "\\'");
                            return `
                                <div class="py-3 px-2">
                                    <button type="button" onclick="toggleWorkerRowDropdown('${w.id}')" class="w-full text-left py-1.5 px-2.5 rounded-lg hover:bg-white/5 transition flex items-center justify-between">
                                        <div>
                                            <p class="text-sm font-semibold text-white hover:text-purple-300 transition">${w.full_name}</p>
                                            <p class="text-[11px] text-amber-300">${w.department} ${w.phone ? '• ' + w.phone : ''}</p>
                                        </div>
                                        <i class="fa-solid ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs text-gray-400"></i>
                                    </button>

                                    <div id="workerDropdownPanel-${w.id}" class="${isOpen ? '' : 'hidden'} mt-2 ml-2 p-3.5 rounded-xl bg-black/45 border border-purple-500/25 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <select id="workerRoleSelect-${w.id}" class="bg-black/60 border border-white/15 rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                                            <option value="">-- Select Option --</option>
                                            ${!isSelectingVice ? `
                                                <option value="assign_workers_leader">Assign as Workers Leader</option>
                                            ` : `
                                                <option value="assign_vice_leader">Assign as Vice Leader</option>
                                            `}
                                        </select>
                                        <button type="button" onclick="saveWorkerWizardSelection('${w.id}', '${safeName}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2 rounded-lg text-xs transition shadow-md">
                                            Save
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('') : '<p class="py-4 text-center text-gray-400 text-xs">No workers found in any department yet.</p>'}
                    </div>
                </div>
            `;
            window.__cachedWorkersList = workersList;
        }

        function toggleWorkerRowDropdown(workerId) {
            openWorkerDropdownId = openWorkerDropdownId === workerId ? null : workerId;
            document.querySelectorAll('[id^="workerDropdownPanel-"]').forEach(panel => {
                if (panel.id === `workerDropdownPanel-${workerId}`) {
                    panel.classList.toggle('hidden');
                } else {
                    panel.classList.add('hidden');
                }
            });
        }

        async function saveWorkerWizardSelection(workerId, workerName) {
            const selectEl = document.getElementById(`workerRoleSelect-${workerId}`);
            const chosenOption = selectEl ? selectEl.value : '';
            const workersList = window.__cachedWorkersList || await fetchDepartmentMembersList();

            if (workersAssignStep === 'select_workers_leader') {
                if (chosenOption !== 'assign_workers_leader') {
                    showModal('Select Option', 'Please choose "Assign as Workers Leader" from the dropdown before clicking Save.', null, false);
                    return;
                }
                pendingWorkersLeaderId = workerId;
                workersAssignStep = 'select_vice_leader';
                openWorkerDropdownId = null;

                showModal(
                    'Workers Leader Selected',
                    `${workerName} has been selected as Workers Leader. Now choose who will be Vice Leader.`,
                    () => { renderWorkersLeaderWizard(workersList); }
                );
            } else {
                if (chosenOption !== 'assign_vice_leader') {
                    showModal('Select Option', 'Please choose "Assign as Vice Leader" from the dropdown before clicking Save.', null, false);
                    return;
                }
                if (workerId === pendingWorkersLeaderId) {
                    showModal('Different Member Required', 'Please select a different worker for Vice Leader.', null, false);
                    return;
                }
                pendingViceLeaderId = workerId;
                await saveWorkersLeadershipPair(pendingWorkersLeaderId, pendingViceLeaderId);

                if (activeMemberSession?.id) {
                    await refreshMemberSession(activeMemberSession.id);
                }

                const leaderObj = workersList.find(w => w.id === pendingWorkersLeaderId);
                const viceObj = workersList.find(w => w.id === pendingViceLeaderId);

                document.getElementById('departmentsDynamicView').innerHTML = '';
                await loadWorkersLeadershipBanner();

                showModal(
                    'Workers Leadership Saved',
                    `Workers Leader: ${leaderObj?.full_name || 'Assigned'}\nVice Leader: ${viceObj?.full_name || workerName}\n\nTheir respective dashboards will appear automatically when they log in.`
                );
            }
        }

        async function clearWorkersLeadershipPair() {
            await saveWorkersLeadershipPair(null, null);
            if (activeMemberSession?.id) {
                await refreshMemberSession(activeMemberSession.id);
            }
            document.getElementById('departmentsDynamicView').innerHTML = '';
            await loadWorkersLeadershipBanner();
            showModal('Leadership Cleared', 'Workers Leader and Vice Leader assignments have been cleared.');
        }

        // =========================================================================
        // ADMIN STATS & ANALYTICS CHART
        // =========================================================================
        async function loadAdminMemberCount() {
            const el = document.getElementById('statTotalMembers');
            if (!el) return;
            const { count, error } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            el.innerText = error ? '0' : (count || 0);
        }

        function initFinanceChart() {
            const ctx = document.getElementById('financeChart');
            if (!ctx) return;
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [
                        { label: 'Inflow (₦)', data: [240000, 290000, 310000, 280000, 330000], backgroundColor: '#10b981', borderRadius: 6 },
                        { label: 'Expenses (₦)', data: [40000, 52000, 45000, 38000, 40000], backgroundColor: '#ef4444', borderRadius: 6 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } } },
                    scales: {
                        x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
                        y: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        // =========================================================================
        // INITIALIZATION (PERSISTENT SESSIONS ACROSS REFRESH)
        // =========================================================================
        window.addEventListener('DOMContentLoaded', () => {
            if (activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoadingScreen();
            }
        });
    </script>
</body>
</html>
