                                <h4 class="text-sm font-semibold text-white hover:text-blue-300 transition truncate">${m.full_name}</h4>
                                <p class="text-[11px] text-gray-400 truncate">${fName} • Dept: ${dName} • ${m.phone || 'No phone'}</p>
                            </div>
                            <i class="fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs text-gray-400 shrink-0"></i>
                        </div>

                        <div id="dirMemberActions-${m.id}" class="${isExpanded ? '' : 'hidden'} mt-2 ml-2 mr-2 p-4 rounded-xl bg-black/35 border border-white/10 space-y-3 text-xs">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-gray-300">
                                <p><span class="text-gray-400">Member ID:</span> ${m.member_id || 'N/A'}</p>
                                <p><span class="text-gray-400">Fellowship:</span> <span class="text-blue-300 font-semibold">${fName}</span></p>
                                <p><span class="text-gray-400">Origin / Residence:</span> ${m.state || 'N/A'} / ${m.residence_state || 'N/A'}</p>
                                <p><span class="text-gray-400">Joined:</span> ${m.date_joined || 'N/A'}</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2.5 pt-1">
                                <button type="button" onclick="openEditMemberModal('${m.id}', '${safeName}')" class="px-3.5 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 font-semibold transition">
                                    <i class="fa-solid fa-pen mr-1"></i> Edit Name
                                </button>
                                <button type="button" onclick="promptDeleteMemberConfirmation('${m.id}', '${safeName}', '${safeGroup}')" class="px-3.5 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/30 font-semibold transition">
                                    <i class="fa-solid fa-trash mr-1"></i> Delete Member
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleDirectoryMemberRow(memberId) {
            expandedDirectoryMemberId = expandedDirectoryMemberId === memberId ? null : memberId;
            filterAllMembersDirectory();
        }

        // =========================================================================
        // FELLOWSHIPS, LEADERS, WORKERS & ADMIN BANK ACCOUNTS
        // =========================================================================
        function renderFellowshipsDashboardView() {
            const area = document.getElementById('adminContentArea');
            activeFellowshipContext = null;
            activeAssignLeaderFellowship = null;
            expandedLeaderMemberId = null;

            area.innerHTML = `
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="card-bg p-6 rounded-2xl border border-blue-500/30 hover:border-blue-400 transition flex flex-col justify-between space-y-4">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center text-xl mb-3"><i class="fa-solid fa-user-tie"></i></div>
                                <h3 class="text-base font-bold text-white">Men Fellowship</h3>
                                <p class="text-xs text-gray-400 mt-1">Married Male Members</p>
                            </div>
                            <div class="grid grid-cols-2 gap-2 pt-2">
                                <button onclick="loadFellowshipGroupMembers('Men Fellowship')" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 py-2 rounded-lg text-xs font-semibold transition">View Members</button>
                                <button onclick="openAssignGroupLeaderPanel('Men Fellowship')" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 py-2 rounded-lg text-xs font-semibold transition">Assign Leader</button>
                            </div>
                        </div>

                        <div class="card-bg p-6 rounded-2xl border border-pink-500/30 hover:border-pink-400 transition flex flex-col justify-between space-y-4">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-pink-600/20 text-pink-400 flex items-center justify-center text-xl mb-3"><i class="fa-solid fa-person-dress"></i></div>
                                <h3 class="text-base font-bold text-white">Women Fellowship</h3>
                                <p class="text-xs text-gray-400 mt-1">Married Female Members</p>
                            </div>
                            <div class="grid grid-cols-2 gap-2 pt-2">
                                <button onclick="loadFellowshipGroupMembers('Women Fellowship')" class="bg-pink-600/20 hover:bg-pink-600/30 text-pink-300 border border-pink-500/30 py-2 rounded-lg text-xs font-semibold transition">View Members</button>
                                <button onclick="openAssignGroupLeaderPanel('Women Fellowship')" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 py-2 rounded-lg text-xs font-semibold transition">Assign Leader</button>
                            </div>
                        </div>

                        <div class="card-bg p-6 rounded-2xl border border-emerald-500/30 hover:border-emerald-400 transition flex flex-col justify-between space-y-4">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-xl mb-3"><i class="fa-solid fa-users"></i></div>
                                <h3 class="text-base font-bold text-white">Youth Fellowship</h3>
                                <p class="text-xs text-gray-400 mt-1">Unmarried Members</p>
                            </div>
                            <div class="grid grid-cols-2 gap-2 pt-2">
                                <button onclick="loadFellowshipGroupMembers('Youth Fellowship')" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 py-2 rounded-lg text-xs font-semibold transition">View Members</button>
                                <button onclick="openAssignGroupLeaderPanel('Youth Fellowship')" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 py-2 rounded-lg text-xs font-semibold transition">Assign Leader</button>
                            </div>
                        </div>
                    </div>

                    <div id="fellowshipDynamicPanel" class="hidden card-bg p-6 rounded-2xl border border-white/10"></div>
                </div>
            `;
        }

        async function loadFellowshipGroupMembers(fellowshipName) {
            activeFellowshipContext = fellowshipName;
            const panel = document.getElementById('fellowshipDynamicPanel');
            if (!panel) return;
            panel.classList.remove('hidden');
            panel.innerHTML = `<p class="text-xs text-gray-400">Loading members in ${fellowshipName}...</p>`;

            const members = await fetchFellowshipGroupMembersList(fellowshipName);

            panel.innerHTML = `
                <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
                    <div>
                        <h4 class="text-sm font-bold text-white">${fellowshipName} — Members (${members.length})</h4>
                        <p class="text-xs text-gray-400">Click Edit to update name or Delete to remove member.</p>
                    </div>
                    <button onclick="document.getElementById('fellowshipDynamicPanel').classList.add('hidden')" class="text-xs text-gray-400 hover:text-white">Close</button>
                </div>
                <div class="divide-y divide-white/5 text-xs">
                    ${members.length > 0 ? members.map(m => {
                        const safeName = (m.full_name || '').replace(/'/g, "\\'");
                        return `
                            <div class="py-3 flex items-center justify-between gap-3">
                                <div>
                                    <p class="font-bold text-white">${m.full_name}</p>
                                    <p class="text-gray-400">${m.phone || 'No phone'} • ${m.member_id || ''}</p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="openEditMemberModal('${m.id}', '${safeName}')" class="px-3 py-1.5 rounded-lg bg-blue-600/20 text-blue-300 border border-blue-500/30 font-semibold">Edit</button>
                                    <button onclick="deleteFellowshipMember('${m.id}', '${safeName}')" class="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-300 border border-red-500/30 font-semibold">Delete</button>
                                </div>
                            </div>
                        `;
                    }).join('') : '<p class="py-4 text-gray-400">No members in this fellowship yet.</p>'}
                </div>
            `;
        }

        async function openAssignGroupLeaderPanel(fellowshipName) {
            activeAssignLeaderFellowship = fellowshipName;
            expandedLeaderMemberId = null;
            const panel = document.getElementById('fellowshipDynamicPanel');
            if (!panel) return;
            panel.classList.remove('hidden');
            panel.innerHTML = `<p class="text-xs text-gray-400">Loading group members for leader assignment...</p>`;

            const { row: fellowshipRow } = await ensureFellowshipRecord(fellowshipName);
            const members = await fetchFellowshipGroupMembersList(fellowshipName);

            const { data: activeLeaders } = await supabaseClient
                .from('group_leaders')
                .select('id, member_id, is_active, members(full_name)')
                .eq('fellowship_id', fellowshipRow?.id || '')
                .eq('is_active', true);

            const currentLeaderNames = (activeLeaders || []).map(l => l.members?.full_name).filter(Boolean);

            panel.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b border-white/10 pb-3">
                        <div>
                            <h4 class="text-sm font-bold text-amber-400">Assign Group Leader — ${fellowshipName}</h4>
                            <p class="text-xs text-gray-400">Current Active Leader(s): <strong class="text-white">${currentLeaderNames.length > 0 ? currentLeaderNames.join(', ') : 'None assigned'}</strong></p>
                        </div>
                        <button onclick="document.getElementById('fellowshipDynamicPanel').classList.add('hidden')" class="text-xs text-gray-400 hover:text-white">Close</button>
                    </div>
                    <div class="divide-y divide-white/5 text-xs">
                        ${members.map(m => {
                            const isExpanded = expandedLeaderMemberId === m.id;
                            const safeName = (m.full_name || '').replace(/'/g, "\\'");
                            return `
                                <div class="py-2.5">
                                    <div onclick="toggleLeaderAssignmentRow('${m.id}', '${fellowshipName}')" class="flex items-center justify-between p-2 rounded-lg hover:bg-white/5 cursor-pointer">
                                        <span class="font-semibold text-white">${m.full_name}</span>
                                        <span class="text-amber-300 text-[11px]">${isExpanded ? 'Hide' : 'Select'}</span>
                                    </div>
                                    <div class="${isExpanded ? '' : 'hidden'} mt-2 ml-3 p-3 rounded-xl bg-black/35 border border-amber-500/25 flex items-center justify-between gap-2">
                                        <span class="text-gray-300">Make <strong>${m.full_name}</strong> the active Group Leader?</span>
                                        <button onclick="assignMemberAsGroupLeader('${m.id}', '${safeName}', '${fellowshipName}', '${fellowshipRow?.id || ''}')" class="bg-amber-600 hover:bg-amber-700 text-black font-bold px-4 py-1.5 rounded-lg text-xs">
                                            Assign Leader
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleLeaderAssignmentRow(memberId, fellowshipName) {
            expandedLeaderMemberId = expandedLeaderMemberId === memberId ? null : memberId;
            openAssignGroupLeaderPanel(fellowshipName);
        }

        async function assignMemberAsGroupLeader(memberId, memberName, fellowshipName, fellowshipId) {
            if (!fellowshipId) {
                const { row } = await ensureFellowshipRecord(fellowshipName);
                fellowshipId = row?.id;
            }
            if (!fellowshipId) return;

            await supabaseClient.from('group_leaders').update({ is_active: false }).eq('fellowship_id', fellowshipId);
            await supabaseClient.from('group_leaders').insert([{
                member_id: memberId,
                fellowship_id: fellowshipId,
                is_active: true
            }]);

            pushMemberInboxNotification(
                memberId,
                'Group Leader Appointment',
                `You have been assigned as the Group Leader for ${fellowshipName}.`
            );

            showModal('Group Leader Assigned', `${memberName} is now the active Group Leader of ${fellowshipName}.`, () => {
                openAssignGroupLeaderPanel(fellowshipName);
            });
        }

        async function renderWorkersManagementView() {
            const area = document.getElementById('adminContentArea');
            if (!area) return;

            const [{ data: allMembers }, wState, workersList] = await Promise.all([
                supabaseClient.from('members').select('id, full_name, phone, assigned_department, is_worker').order('full_name', { ascending: true }),
                fetchWorkersLeadershipState(),
                fetchDepartmentMembersList()
            ]);

            const members = allMembers || [];

            area.innerHTML = `
                <div class="space-y-5">
                    <div class="card-bg p-6 rounded-2xl border border-purple-500/30 space-y-4">
                        <div class="border-b border-white/10 pb-3">
                            <h3 class="text-base font-bold text-purple-300">Assign Workers Leader & Vice Leader</h3>
                            <p class="text-xs text-gray-400">Select the Workers Leader and Vice Leader for the Workers Portal.</p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                            <div>
                                <label class="block text-gray-300 font-semibold mb-1">Workers Leader</label>
                                <select id="selectWorkersLeaderId" class="w-full bg-black/40 border border-white/15 rounded-lg px-3.5 py-2.5 text-white">
                                    <option value="">None</option>
                                    ${members.map(m => `<option value="${m.id}" ${wState.workersLeaderId === m.id ? 'selected' : ''}>${m.full_name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-gray-300 font-semibold mb-1">Vice Leader</label>
                                <select id="selectViceLeaderId" class="w-full bg-black/40 border border-white/15 rounded-lg px-3.5 py-2.5 text-white">
                                    <option value="">None</option>
                                    ${members.map(m => `<option value="${m.id}" ${wState.viceLeaderId === m.id ? 'selected' : ''}>${m.full_name}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        <button type="button" onclick="saveAdminWorkersLeadershipSelection()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-2.5 rounded-lg text-xs transition shadow-lg">
                            Save Workers Leadership
                        </button>
                    </div>

                    <div class="card-bg p-6 rounded-2xl border border-white/10 space-y-3">
                        <h4 class="text-sm font-bold text-white">Department Workers (${workersList.length})</h4>
                        <div class="divide-y divide-white/5 text-xs">
                            ${workersList.length > 0 ? workersList.map(w => `
                                <div class="py-2.5 flex items-center justify-between">
                                    <span class="font-bold text-white">${w.full_name}</span>
                                    <span class="text-purple-300 font-semibold">${w.department}</span>
                                </div>
                            `).join('') : '<p class="py-4 text-gray-400">No workers assigned to departments yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        async function saveAdminWorkersLeadershipSelection() {
            const leaderId = document.getElementById('selectWorkersLeaderId')?.value || null;
            const viceId = document.getElementById('selectViceLeaderId')?.value || null;
            await saveWorkersLeadershipPair(leaderId, viceId);

            if (leaderId) {
                pushMemberInboxNotification(leaderId, 'Workers Leader Appointment', 'You have been assigned as Workers Leader.');
            }
            if (viceId) {
                pushMemberInboxNotification(viceId, 'Vice Leader Appointment', 'You have been assigned as Workers Vice Leader.');
            }

            showModal('Workers Leadership Saved', 'Workers Leader and Vice Leader assignments have been updated.', () => {
                renderWorkersManagementView();
            });
        }

        function renderAdminBankAccountsView() {
            const area = document.getElementById('adminContentArea');
            if (!area) return;
            const accounts = getAdminBankAccounts();

            area.innerHTML = `
                <div class="card-bg p-6 rounded-2xl border border-cyan-500/30 space-y-5 max-w-2xl">
                    <div class="border-b border-white/10 pb-3">
                        <h3 class="text-base font-bold text-cyan-300">Main Church Bank Accounts</h3>
                        <p class="text-xs text-gray-400">Add bank accounts so group treasurers can remit dues to the Main Church.</p>
                    </div>
                    <form onsubmit="addAdminBankAccount(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <input type="text" id="adminBankNameInput" required placeholder="Bank Name" class="bg-black/40 border border-white/15 rounded-lg px-3.5 py-2.5 text-white">
                        <input type="text" id="adminAcctNameInput" required placeholder="Account Name" class="bg-black/40 border border-white/15 rounded-lg px-3.5 py-2.5 text-white">
                        <input type="text" id="adminAcctNumInput" required placeholder="Account Number" class="bg-black/40 border border-white/15 rounded-lg px-3.5 py-2.5 text-white">
                        <button type="submit" class="sm:col-span-3 bg-cyan-600 hover:bg-cyan-700 text-black font-extrabold py-2.5 rounded-lg text-xs transition shadow-lg">
                            Add Bank Account
                        </button>
                    </form>
                    <div class="divide-y divide-white/5 text-xs">
                        ${accounts.length > 0 ? accounts.map((acc, idx) => `
                            <div class="py-3 flex items-center justify-between">
                                <div>
                                    <p class="font-bold text-white">${acc.bankName} — <span class="font-mono text-cyan-300">${acc.accountNumber}</span></p>
                                    <p class="text-gray-400">${acc.accountName}</p>
                                </div>
                                <button onclick="deleteAdminBankAccount(${idx})" class="text-red-400 hover:text-red-300 text-xs font-semibold">Remove</button>
                            </div>
                        `).join('') : '<p class="py-4 text-gray-400">No Main Church bank accounts added yet.</p>'}
                    </div>
                </div>
            `;
        }

        function addAdminBankAccount(e) {
            e.preventDefault();
            const bankName = (document.getElementById('adminBankNameInput')?.value || '').trim();
            const accountName = (document.getElementById('adminAcctNameInput')?.value || '').trim();
            const accountNumber = (document.getElementById('adminAcctNumInput')?.value || '').trim();
            if (!bankName || !accountName || !accountNumber) return;

            const list = getAdminBankAccounts();
            list.push({ id: 'bank-' + Date.now(), bankName, accountName, accountNumber });
            saveAdminBankAccounts(list);
            showModal('Bank Account Added', `${bankName} (${accountNumber}) added to Main Church accounts.`, () => {
                renderAdminBankAccountsView();
            });
        }

        function deleteAdminBankAccount(idx) {
            const list = getAdminBankAccounts();
            list.splice(idx, 1);
            saveAdminBankAccounts(list);
            renderAdminBankAccountsView();
        }

        function renderAdminNotificationsView() {
            const area = document.getElementById('adminContentArea');
            if (!area) return;
            const currentGlobalDues = getGlobalDefaultDues();

            area.innerHTML = `
                <div class="card-bg p-6 rounded-2xl border border-amber-500/30 space-y-5 max-w-xl">
                    <div class="border-b border-white/10 pb-3">
                        <h3 class="text-base font-bold text-amber-300">Default Monthly Dues & Broadcast</h3>
                        <p class="text-xs text-gray-400">Set the default monthly dues rate across fellowships.</p>
                    </div>
                    <div class="space-y-3 text-xs">
                        <label class="block text-gray-300 font-semibold">Default Monthly Dues Amount (₦)</label>
                        <div class="flex gap-2.5">
                            <input type="number" id="adminGlobalDuesInput" min="1" step="50" value="${currentGlobalDues}" class="flex-1 bg-black/40 border border-white/15 rounded-lg px-4 py-2 text-sm text-white">
                            <button type="button" onclick="saveAdminGlobalDues()" class="bg-amber-600 hover:bg-amber-700 text-black font-extrabold px-5 py-2 rounded-lg text-xs transition shadow-lg">
                                Save Default Dues
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveAdminGlobalDues() {
            const val = Number(document.getElementById('adminGlobalDuesInput')?.value || 0);
            if (!val || val <= 0) {
                showModal('Invalid Dues', 'Please enter a valid positive number.', null, false);
                return;
            }
            setGlobalDefaultDues(val);
            showModal('Default Dues Saved', `Default monthly dues set to ${formatNaira(val)}.`, () => {
                renderAdminNotificationsView();
            });
        }

        // Initial Boot
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('ocm_dashboard_theme_v1') || 'midnight';
            applyDashboardTheme(savedTheme);

            if (activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoginPage();
            }
        });
    </script>
</body>
</html>
