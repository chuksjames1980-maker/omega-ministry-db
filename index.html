        async function approveAssignedDutiesForMember(memberId) {
            const memberObj = adminAssignDutiesMembersCache.find(m => String(m.id) === String(memberId));
            if (!memberObj) return;

            const selectedDuties = [];
            ASSIGNABLE_DUTIES_LIST.forEach((duty, idx) => {
                const cb = document.getElementById(`dutyCb-${memberId}-${idx}`);
                if (cb && cb.checked) selectedDuties.push(duty);
            });

            const btn = document.getElementById(`approveDutyBtn-${memberId}`);
            if (btn) { btn.disabled = true; btn.innerText = 'Approving...'; }

            await saveMemberAssignedDuties(memberObj, selectedDuties);
            memberObj.assigned_duties = selectedDuties;

            if (activeMemberSession && String(activeMemberSession.id) === String(memberObj.id)) {
                activeMemberSession.assigned_duties = selectedDuties;
                localStorage.setItem('ocm_member_session', JSON.stringify(activeMemberSession));
            }

            if (btn) { btn.disabled = false; btn.innerText = 'Approve'; }

            showModal(
                'Duties Approved & Assigned',
                selectedDuties.length > 0
                    ? `Approved for ${memberObj.full_name}: ${selectedDuties.join(', ')}.\n\nThis will appear under ${memberObj.full_name}'s "Roles Assigned" in their Member Portal.`
                    : `Cleared assigned duties for ${memberObj.full_name}.`,
                () => {
                    renderAssignDutiesMemberRows();
                }
            );
        }

        async function submitInlineCarParkedReport(e) {
            e.preventDefault();
            const plateNumber = document.getElementById('carPlateInput')?.value.trim() || '';
            const carModel = document.getElementById('carModelInput')?.value.trim() || '';
            const ownerNote = document.getElementById('carOwnerNoteInput')?.value.trim() || '';
            const btn = document.getElementById('saveCarParkedBtn');
            const todayStr = new Date().toISOString().split('T')[0];

            if (!plateNumber || !carModel) return;
            if (btn) { btn.disabled = true; btn.innerText = 'Saving...'; }

            const entry = {
                id: 'car-' + Date.now(),
                plate_number: plateNumber.toUpperCase(),
                car_model: carModel,
                owner_note: ownerNote,
                recorded_by: activeMemberSession?.full_name || activeAdminSession?.full_name || 'Staff',
                report_date: todayStr
            };

            const localList = getLocalCarParkedReports();
            localList.unshift(entry);
            saveLocalCarParkedReports(localList);

            try {
                await supabaseClient.from('car_parked_reports').insert([entry]);
            } catch (err) {
                console.warn('car_parked_reports table fallback:', err);
            }

            if (btn) { btn.disabled = false; btn.innerText = 'Save Report'; }
            document.getElementById('carPlateInput').value = '';
            document.getElementById('carModelInput').value = '';
            document.getElementById('carOwnerNoteInput').value = '';

            await renderCarParkedReportsList();
            showModal('Car Parked Report Saved', `Recorded ${entry.plate_number} (${entry.car_model}).`);
        }

        async function renderCarParkedReportsList() {
            const listEl = document.getElementById('carParkedReportsList');
            const dbRows = await safeSupabaseSelect('car_parked_reports');
            const localRows = getLocalCarParkedReports();
            const merged = [...localRows];
            dbRows.forEach(r => {
                if (!merged.some(m => m.id === r.id)) merged.push(r);
            });
            carParkedReportsCache = merged;

            const countEl = document.getElementById('adminCardCarParked');
            if (countEl) countEl.innerText = String(merged.length);

            if (!listEl) return;
            if (merged.length === 0) {
                listEl.innerHTML = `<p class="py-3 text-gray-400">No car parked reports recorded yet.</p>`;
                return;
            }

            listEl.innerHTML = merged.map(r => `
                <div class="py-2.5 flex items-center justify-between gap-3">
                    <div>
                        <p class="font-bold text-white">${r.plate_number} — <span class="text-sky-300">${r.car_model}</span></p>
                        <p class="text-[11px] text-gray-400">${r.owner_note || 'Parked'} • By ${r.recorded_by || 'Staff'} • ${r.report_date || ''}</p>
                    </div>
                </div>
            `).join('');
        }

            const banks = getAdminBankAccounts();
            banks.push({ bankName, accountName, accountNumber });
            saveAdminBankAccounts(banks);

            showModal('Bank Account Added', `Added ${bankName} - ${accountName} (${accountNumber}).`, () => {

            if (!main) return;
            if (titleEl) titleEl.innerText = "Workers Leadership";

        function renderWorkersLeadershipList(workers) {
            const listEl = document.getElementById('workersLeadershipList');
            const summaryEl = document.getElementById('workersLeadershipSummary');
            if (!listEl) return;

            const leaderObj = workers.find(w => String(w.id) === String(pendingWorkersLeaderId));
            const viceObj = workers.find(w => String(w.id) === String(pendingViceLeaderId));

            if (summaryEl) {
                summaryEl.innerHTML = `
                    <div class="bg-black/30 border border-purple-500/30 px-3.5 py-2 rounded-xl">
                        <span class="text-gray-400">Selected Workers Leader:</span>
                        <strong class="text-purple-300 ml-1">${leaderObj ? leaderObj.full_name : 'None'}</strong>
                    </div>
                    <div class="bg-black/30 border border-indigo-500/30 px-3.5 py-2 rounded-xl">
                        <span class="text-gray-400">Selected Vice Leader:</span>
                        <strong class="text-indigo-300 ml-1">${viceObj ? viceObj.full_name : 'None'}</strong>
                    </div>
                `;
            }

            if (!workers || workers.length === 0) {
                listEl.innerHTML = `<p class="py-6 text-center text-gray-400 text-xs">No workers found in any department yet.</p>`;
                return;
            }

            listEl.innerHTML = workers.map(w => {
                const isLeader = String(pendingWorkersLeaderId) === String(w.id);
                const isVice = String(pendingViceLeaderId) === String(w.id);
                const isDropdownOpen = String(openWorkerDropdownId) === String(w.id);

                return `

                                ${isVice ? `<span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-indigo-600/30 text-indigo-200 border border-indigo-400/50">Vice Leader</span>` : ''}

                            <button type="button" onclick="selectWorkerLeadershipRole('${w.id}', 'workers_leader')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-purple-600/25 text-purple-200 font-semibold flex items-center justify-between">

                            </button>
                            <button type="button" onclick="selectWorkerLeadershipRole('${w.id}', 'vice_leader')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-600/25 text-indigo-200 font-semibold flex items-center justify-between">

        function toggleWorkerRoleDropdown(e, workerId) {
            if (e) e.stopPropagation();
            openWorkerDropdownId = String(openWorkerDropdownId) === String(workerId) ? null : workerId;
            fetchDepartmentMembersList().then(workers => renderWorkersLeadershipList(workers));
        }

        document.addEventListener('click', () => {
            if (openWorkerDropdownId !== null) {
                openWorkerDropdownId = null;
                const listEl = document.getElementById('workersLeadershipList');
                if (listEl) {
                    fetchDepartmentMembersList().then(workers => renderWorkersLeadershipList(workers));
                }
            }
        });

        function selectWorkerLeadershipRole(workerId, roleChoice) {
            if (roleChoice === 'workers_leader') {
                pendingWorkersLeaderId = workerId;
                if (String(pendingViceLeaderId) === String(workerId)) {
                    pendingViceLeaderId = null;
                }
            } else if (roleChoice === 'vice_leader') {
                pendingViceLeaderId = workerId;
                if (String(pendingWorkersLeaderId) === String(workerId)) {
                    pendingWorkersLeaderId = null;
                }
            } else if (roleChoice === 'none') {
                if (String(pendingWorkersLeaderId) === String(workerId)) pendingWorkersLeaderId = null;
                if (String(pendingViceLeaderId) === String(workerId)) pendingViceLeaderId = null;
            }
            openWorkerDropdownId = null;
            fetchDepartmentMembersList().then(workers => renderWorkersLeadershipList(workers));
        }

        async function saveSelectedWorkersLeadership() {
            const btn = document.getElementById('saveWorkersLeadershipBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerText = 'Saving...';
            }

            try {
                const savedPair = await saveWorkersLeadershipPair(pendingWorkersLeaderId, pendingViceLeaderId);
                const workers = await fetchDepartmentMembersList();
                const leaderObj = workers.find(w => String(w.id) === String(savedPair.workersLeaderId));
                const viceObj = workers.find(w => String(w.id) === String(savedPair.viceLeaderId));

                if (activeMemberSession) {
                    activeMemberSession.is_workers_leader = String(savedPair.workersLeaderId) === String(activeMemberSession.id);
                    activeMemberSession.is_vice_leader = String(savedPair.viceLeaderId) === String(activeMemberSession.id);
                    localStorage.setItem('ocm_member_session', JSON.stringify(activeMemberSession));
                }

                showModal(
                    "Workers Leadership Saved",
                    `Workers Leader: <strong>${leaderObj ? leaderObj.full_name : 'None'}</strong><br>Vice Leader: <strong>${viceObj ? viceObj.full_name : 'None'}</strong>`,
                    () => renderWorkersLeadershipView()
                );
            } catch (err) {
                showModal("Save Failed", err.message || "Could not save workers leadership.", null, false);
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Save';
                }
            }
        }

        function adminMarkTransferReceived(transferId) {
            const list = getTreasurerTransfers();
            const idx = list.findIndex(t => t.id === transferId);
            if (idx < 0) return;

            list[idx].status = 'admin_received';
            list[idx].receivedAt = new Date().toISOString();
            saveTreasurerTransfers(list);

            if (list[idx].treasurerId) {
                pushMemberInboxNotification(
                    list[idx].treasurerId,
                    'Transfer Received by Admin',
                    `Admin has confirmed receipt of ${formatNaira(list[idx].amount)} from ${list[idx].fellowshipName}.`
                );
            }

            showModal(
                'Transfer Marked as Received',
                `Confirmed receipt of ${formatNaira(list[idx].amount)} from ${list[idx].fellowshipName}.`,
                () => switchAdminView('notifications')
            );
        }

        async function loadFellowshipGroupMembers(fellowshipName) {
            closeSidebarIfMobile('sidebar');
            activeFellowshipContext = fellowshipName;
            expandedLeaderMemberId = null;
            selectedLeaderActionByMember = {};

            const titleEl = document.getElementById('adminPageTitle');
            const main = document.getElementById('mainAdminContent');
            if (titleEl) titleEl.innerText = `${fellowshipName} – Members`;

            main.innerHTML = `
                <div class="card-bg p-6 rounded-2xl border border-amber-500/30 space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-4">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">${fellowshipName}</h3>
                            <p class="text-xs text-gray-400 mt-0.5">Click any member's name to assign Group Leader or Remove Group Leader.</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="openAssignGroupLeaderPanel('${fellowshipName.replace(/'/g, "\\'")}')" class="bg-amber-600 hover:bg-amber-700 text-black font-bold px-4 py-2 rounded-lg text-xs transition shadow-md">
                                <i class="fa-solid fa-crown mr-1"></i> Assign Group Leader
                            </button>
                            <button onclick="switchAdminView('fellowships')" class="card-bg hover:bg-white/5 text-gray-300 px-3.5 py-2 rounded-lg text-xs border border-white/10">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Back
                            </button>
                        </div>
                    </div>
                    <div id="fellowshipGroupMembersList" class="divide-y divide-white/5">
                        <p class="py-6 text-center text-gray-400 text-xs">Loading ${fellowshipName} members...</p>
                    </div>
                </div>
            `;

            const members = await fetchFellowshipGroupMembersList(fellowshipName);
            const { row: fRow } = await ensureFellowshipRecord(fellowshipName);
            let activeLeaders = [];
            if (fRow?.id) {
                const { data: glRows } = await supabaseClient
                    .from('group_leaders')
                    .select('id, member_id, is_active')
                    .eq('fellowship_id', fRow.id)
                    .eq('is_active', true);
                activeLeaders = glRows || [];
            }

            const listEl = document.getElementById('fellowshipGroupMembersList');
            if (!listEl) return;

            if (members.length === 0) {
                listEl.innerHTML = `<p class="py-6 text-center text-gray-400 text-xs">No members assigned to ${fellowshipName} yet.</p>`;
                return;
            }

            listEl.innerHTML = members.map(m => {
                const isLeader = activeLeaders.some(gl => String(gl.member_id) === String(m.id));
                const isExpanded = expandedLeaderMemberId === m.id;
                const chosenAction = selectedLeaderActionByMember[m.id] || (isLeader ? 'remove' : 'assign');
                const safeName = (m.full_name || '').replace(/'/g, "\\'");
                const safeFellowship = fellowshipName.replace(/'/g, "\\'");

                return `
                    <div class="py-3 px-2">
                        <div onclick="toggleLeaderMemberRow('${m.id}')" class="flex items-center justify-between gap-3 p-2.5 rounded-xl hover:bg-white/5 cursor-pointer transition">
                            <div class="min-w-0">
                                <h4 class="text-sm font-semibold text-white hover:text-amber-300 transition truncate">${m.full_name}</h4>
                                <p class="text-[11px] text-gray-400 truncate">${m.phone || 'No phone'} • ${m.member_id || ''}</p>
                            </div>
                            <div class="flex items-center space-x-2 shrink-0">
                                ${isLeader ? `<span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/50">Group Leader</span>` : ''}
                                <i class="fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs text-gray-400"></i>
                            </div>
                        </div>

                        <div id="leaderActionPanel-${m.id}" class="${isExpanded ? '' : 'hidden'} mt-2 ml-2 mr-2 p-4 rounded-xl bg-black/35 border border-amber-500/25 flex flex-col sm:flex-row sm:items-end justify-between gap-3">
                            <div class="flex-1">
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Leadership Action for ${m.full_name}</label>
                                <select id="leaderActionSelect-${m.id}" onchange="selectedLeaderActionByMember['${m.id}'] = this.value" class="w-full bg-black/50 border border-white/15 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                                    <option value="assign" ${chosenAction === 'assign' ? 'selected' : ''}>Assign Group Leader</option>
                                    <option value="remove" ${chosenAction === 'remove' ? 'selected' : ''}>Remove Group Leader</option>
                                </select>
                            </div>
                            <button type="button" onclick="applyMemberLeadershipAction('${m.id}', '${safeName}', '${safeFellowship}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg text-xs transition shadow-lg shrink-0">
                                Approve
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleLeaderMemberRow(memberId) {
            expandedLeaderMemberId = expandedLeaderMemberId === memberId ? null : memberId;
            if (activeFellowshipContext) {
                loadFellowshipGroupMembers(activeFellowshipContext);
            }
        }

        async function applyMemberLeadershipAction(memberId, memberName, fellowshipName) {
            const action = document.getElementById(`leaderActionSelect-${memberId}`)?.value || selectedLeaderActionByMember[memberId] || 'assign';
            const { row: fRow } = await ensureFellowshipRecord(fellowshipName);
            if (!fRow?.id) {
                showModal('Error', 'Fellowship record not found.', null, false);
                return;
            }

            if (action === 'assign') {
                await supabaseClient.from('group_leaders').update({ is_active: false }).eq('fellowship_id', fRow.id);
                const { data: existing } = await supabaseClient
                    .from('group_leaders')
                    .select('id')
                    .eq('fellowship_id', fRow.id)
                    .eq('member_id', memberId)
                    .maybeSingle();

                if (existing?.id) {
                    await supabaseClient.from('group_leaders').update({ is_active: true }).eq('id', existing.id);
                } else {
                    await supabaseClient.from('group_leaders').insert([{ fellowship_id: fRow.id, member_id: memberId, is_active: true }]);
                }

                showModal('Group Leader Assigned', `${memberName} is now the active Group Leader of ${fellowshipName}.`, () => {
                    loadFellowshipGroupMembers(fellowshipName);
                });
            } else {
                await supabaseClient
                    .from('group_leaders')
                    .update({ is_active: false })
                    .eq('fellowship_id', fRow.id)
                    .eq('member_id', memberId);

                showModal('Group Leader Removed', `Removed Group Leader role from ${memberName} in ${fellowshipName}.`, () => {
                    loadFellowshipGroupMembers(fellowshipName);
                });
            }
        }

        async function openAssignGroupLeaderPanel(fellowshipName) {
            activeAssignLeaderFellowship = fellowshipName;
            const members = await fetchFellowshipGroupMembersList(fellowshipName);
            const main = document.getElementById('mainAdminContent');
            if (!main) return;

            main.innerHTML = `
                <div class="card-bg p-6 rounded-2xl border border-amber-500/30 space-y-5 max-w-xl">
                    <div class="flex items-center justify-between border-b border-white/10 pb-3">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">Assign Group Leader — ${fellowshipName}</h3>
                            <p class="text-xs text-gray-400">Select a member from ${fellowshipName} to serve as Group Leader.</p>
                        </div>
                        <button onclick="loadFellowshipGroupMembers('${fellowshipName.replace(/'/g, "\\'")}')" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
                    </div>
                    <div class="space-y-4 text-sm">
                        <div>
                            <label class="block text-xs text-gray-300 mb-1">Select Member</label>
                            <select id="quickAssignGroupLeaderSelect" class="w-full bg-black/30 border border-white/15 rounded-lg px-4 py-2.5 text-white">
                                ${members.map(m => `<option value="${m.id}">${m.full_name} (${m.phone || ''})</option>`).join('')}
                            </select>
                        </div>
                        <button type="button" onclick="confirmQuickAssignGroupLeader('${fellowshipName.replace(/'/g, "\\'")}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-xs transition shadow-lg">
                            Save Group Leader
                        </button>
                    </div>
                </div>
            `;
        }

        async function confirmQuickAssignGroupLeader(fellowshipName) {
            const memberId = document.getElementById('quickAssignGroupLeaderSelect')?.value;
            if (!memberId) return;
            const { row: fRow } = await ensureFellowshipRecord(fellowshipName);
            if (!fRow?.id) return;

            await supabaseClient.from('group_leaders').update({ is_active: false }).eq('fellowship_id', fRow.id);
            const { data: existing } = await supabaseClient
                .from('group_leaders')
                .select('id')
                .eq('fellowship_id', fRow.id)
                .eq('member_id', memberId)
                .maybeSingle();

            if (existing?.id) {
                await supabaseClient.from('group_leaders').update({ is_active: true }).eq('id', existing.id);
            } else {
                await supabaseClient.from('group_leaders').insert([{ fellowship_id: fRow.id, member_id: memberId, is_active: true }]);
            }

            showModal('Group Leader Saved', `Updated Group Leader for ${fellowshipName}.`, () => {
                loadFellowshipGroupMembers(fellowshipName);
            });
        }

        // Application Entry Point
        if (activeAdminSession) {
            renderFullAdminDashboard();
        } else if (activeMemberSession) {
            renderMemberDashboardShell();
        } else {
            renderLoadingScreen();
        }
    </script>
</body>
</html>
