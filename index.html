                                    </div>
                                    <div class="relative self-end sm:self-center">
                                        <button type="button" onclick="toggleWorkerRoleDropdown(event, '${w.id}')" class="bg-white/10 hover:bg-white/15 text-gray-200 border border-white/15 px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
                                            <span>Assign Role</span>
                                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                                        </button>
                                        <div id="workerRoleDropdown-${w.id}" class="hidden absolute right-0 mt-1.5 w-48 card-bg border border-purple-500/40 rounded-xl shadow-2xl z-30 overflow-hidden">
                                            <button type="button" onclick="selectPendingWorkerRole('${w.id}', '${safeName}', 'workers_leader')" class="w-full text-left px-4 py-2.5 text-xs hover:bg-purple-600/25 text-purple-200 font-semibold flex items-center justify-between border-b border-white/5">
                                                <span>Workers Leader</span>
                                                ${isLeader ? '<i class="fa-solid fa-check text-emerald-400"></i>' : ''}
                                            </button>
                                            <button type="button" onclick="selectPendingWorkerRole('${w.id}', '${safeName}', 'vice_leader')" class="w-full text-left px-4 py-2.5 text-xs hover:bg-indigo-600/25 text-indigo-200 font-semibold flex items-center justify-between">
                                                <span>Vice Leader</span>
                                                ${isVice ? '<i class="fa-solid fa-check text-emerald-400"></i>' : ''}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>`}
                </div>
            `;
        }

        function toggleWorkerRoleDropdown(e, memberId) {
            if (e) e.stopPropagation();
            const target = document.getElementById(`workerRoleDropdown-${memberId}`);
            if (!target) return;

            document.querySelectorAll('[id^="workerRoleDropdown-"]').forEach(el => {
                if (el.id !== `workerRoleDropdown-${memberId}`) el.classList.add('hidden');
            });

            target.classList.toggle('hidden');
            openWorkerDropdownId = target.classList.contains('hidden') ? null : memberId;
        }

        document.addEventListener('click', (e) => {
            if (openWorkerDropdownId && !e.target.closest('[id^="workerRoleDropdown-"]')) {
                document.querySelectorAll('[id^="workerRoleDropdown-"]').forEach(el => el.classList.add('hidden'));
                openWorkerDropdownId = null;
            }
        });

        function selectPendingWorkerRole(memberId, memberName, roleType) {
            document.querySelectorAll('[id^="workerRoleDropdown-"]').forEach(el => el.classList.add('hidden'));
            openWorkerDropdownId = null;

            if (roleType === 'workers_leader') {
                pendingWorkersLeaderId = memberId;
                if (pendingViceLeaderId === memberId) pendingViceLeaderId = null;
            } else if (roleType === 'vice_leader') {
                pendingViceLeaderId = memberId;
                if (pendingWorkersLeaderId === memberId) pendingWorkersLeaderId = null;
            }

            rerenderWorkersRoleBadges();
        }

        async function rerenderWorkersRoleBadges() {
            const container = document.getElementById('fellowshipMembersContainer');
            if (!container) return;
            const workersList = await fetchDepartmentMembersList();
            const currentWorkersLeader = workersList.find(w => w.id === pendingWorkersLeaderId);
            const currentViceLeader = workersList.find(w => w.id === pendingViceLeaderId);
            const leaderNameLabel = currentWorkersLeader
                ? `${currentWorkersLeader.full_name} (${currentWorkersLeader.department})`
                : 'No Workers Leader Assigned';
            const viceNameLabel = currentViceLeader
                ? `${currentViceLeader.full_name} (${currentViceLeader.department})`
                : 'No Vice Leader Assigned';

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-3">
                        <div>
                            <h4 class="text-sm font-bold text-purple-400">Ministry Workers (${workersList.length})</h4>
                            <p class="text-xs text-gray-400 mt-0.5">Workers Leader: <strong class="text-emerald-400">${leaderNameLabel}</strong></p>
                            <p class="text-xs text-gray-400 mt-0.5">Vice Leader: <strong class="text-indigo-300">${viceNameLabel}</strong></p>
                        </div>
                        <button id="saveWorkersLeaderPairBtn" onclick="saveAssignedWorkersLeadershipPair()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-5 py-2.5 rounded-lg text-xs transition shadow-lg">
                            Save
                        </button>
                    </div>
                    <div class="divide-y divide-white/5">
                        ${workersList.map(w => {
                            const isLeader = pendingWorkersLeaderId === w.id;
                            const isVice = pendingViceLeaderId === w.id;
                            const safeName = (w.full_name || '').replace(/'/g, "\\'");

                            let badgeHtml = '';
                            if (isLeader) {
                                badgeHtml = '<span class="ml-2 px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 text-[10px] font-bold">Workers Leader</span>';
                            } else if (isVice) {
                                badgeHtml = '<span class="ml-2 px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 text-[10px] font-bold">Vice Leader</span>';
                            }

                            return `
                                <div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs relative">
                                    <div>
                                        <p class="font-semibold text-white text-sm">${w.full_name} ${badgeHtml}</p>
                                        <p class="text-gray-400">Department: <span class="text-purple-300 font-semibold">${w.department}</span> • ${w.phone}</p>
                                    </div>
                                    <div class="relative self-end sm:self-center">
                                        <button type="button" onclick="toggleWorkerRoleDropdown(event, '${w.id}')" class="bg-white/10 hover:bg-white/15 text-gray-200 border border-white/15 px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition">
                                            <span>Assign Role</span>
                                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                                        </button>
                                        <div id="workerRoleDropdown-${w.id}" class="hidden absolute right-0 mt-1.5 w-48 card-bg border border-purple-500/40 rounded-xl shadow-2xl z-30 overflow-hidden">
                                            <button type="button" onclick="selectPendingWorkerRole('${w.id}', '${safeName}', 'workers_leader')" class="w-full text-left px-4 py-2.5 text-xs hover:bg-purple-600/25 text-purple-200 font-semibold flex items-center justify-between border-b border-white/5">
                                                <span>Workers Leader</span>
                                                ${isLeader ? '<i class="fa-solid fa-check text-emerald-400"></i>' : ''}
                                            </button>
                                            <button type="button" onclick="selectPendingWorkerRole('${w.id}', '${safeName}', 'vice_leader')" class="w-full text-left px-4 py-2.5 text-xs hover:bg-indigo-600/25 text-indigo-200 font-semibold flex items-center justify-between">
                                                <span>Vice Leader</span>
                                                ${isVice ? '<i class="fa-solid fa-check text-emerald-400"></i>' : ''}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        async function saveAssignedWorkersLeadershipPair() {
            const btn = document.getElementById('saveWorkersLeaderPairBtn');
            if (!pendingWorkersLeaderId && !pendingViceLeaderId) {
                showModal('Select Role First', 'Please click Assign Role next to a worker and choose Workers Leader or Vice Leader before clicking Save.', null, false);
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerText = 'Saving...';
            }

            try {
                await saveWorkersLeadershipPair(pendingWorkersLeaderId, pendingViceLeaderId);
                const workersList = await fetchDepartmentMembersList();
                const leaderObj = workersList.find(w => w.id === pendingWorkersLeaderId);
                const viceObj = workersList.find(w => w.id === pendingViceLeaderId);

                const summaryLines = [];
                if (leaderObj) summaryLines.push(`Workers Leader: ${leaderObj.full_name} (${leaderObj.department})`);
                if (viceObj) summaryLines.push(`Vice Leader: ${viceObj.full_name} (${viceObj.department})`);

                showModal(
                    'Workers Leadership Saved',
                    `${summaryLines.join('\n')}\n\nTheir assigned role dashboards are now active in their member portals.`,
                    () => {
                        loadWorkersDepartmentGroup();
                    }
                );
            } catch (err) {
                showModal('Assignment Failed', err.message || 'Could not save Workers Leader assignment.', null, false);
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = 'Save';
                }
            }
        }

        // --- ASSIGN GROUP LEADER PANEL ---
        async function openAssignGroupLeaderPanel(fellowshipName) {
            activeAssignLeaderFellowship = fellowshipName;
            selectedLeaderActionByMember = {};
            expandedLeaderMemberId = null;

            const container = document.getElementById('fellowshipMembersContainer');
            if (!container) return;

            container.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Loading ${fellowshipName} members for leader assignment...</p>`;

            const { row: fellowshipRow, error: felErr } = await ensureFellowshipRecord(fellowshipName);

            if (felErr || !fellowshipRow) {
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Error loading fellowship: ${felErr?.message || 'Unable to load fellowship record'}</p>`;
                return;
            }

            const membersList = await fetchFellowshipGroupMembersList(fellowshipName);

            const { data: activeLeaderRow } = await supabaseClient
                .from('group_leaders')
                .select('id, member_id')
                .eq('fellowship_id', fellowshipRow.id)
                .eq('is_active', true)
                .maybeSingle();

            const activeLeaderMemberId = activeLeaderRow?.member_id || null;

            if (activeLeaderMemberId) {
                selectedLeaderActionByMember[activeLeaderMemberId] = 'assign';
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-3">
                        <div>
                            <h4 class="text-sm font-bold text-amber-400">Assign Group Leader — ${fellowshipName}</h4>
                            <p class="text-xs text-gray-400 mt-0.5">Click any member's name to open their assignment options, then click Save.</p>
                        </div>
                        <button onclick="loadFellowshipGroupMembers('${fellowshipName}')" class="text-xs text-gray-400 hover:text-white self-start sm:self-center">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Back to ${fellowshipName}
                        </button>
                    </div>

                    ${membersList.length === 0 ? `<p class="text-xs text-gray-400 py-4">No registered members found in ${fellowshipName}.</p>` : `
                    <div class="divide-y divide-white/5">
                        ${membersList.map(m => {
                            const isCurrentLeader = m.id === activeLeaderMemberId;
                            return `
                                <div class="py-3 px-2">
                                    <button type="button" onclick="toggleLeaderMemberDropdown('${m.id}')" class="w-full flex items-center justify-between text-left py-1.5 px-2 rounded-lg hover:bg-white/5 transition">
                                        <span class="text-sm font-semibold ${isCurrentLeader ? 'text-amber-300' : 'text-white'}">
                                            ${m.full_name} ${isCurrentLeader ? '<span class="ml-2 text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300">Current Leader</span>' : ''}
                                        </span>
                                        <i id="leaderChevron-${m.id}" class="fa-solid fa-chevron-down text-xs text-gray-400 transition-transform"></i>
                                    </button>

                                    <div id="leaderDropdown-${m.id}" class="hidden mt-2 ml-4 p-3 rounded-xl bg-black/30 border border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                        <div class="flex items-center space-x-5 text-xs">
                                            <label class="flex items-center space-x-2 cursor-pointer text-emerald-300 font-medium">
                                                <input type="checkbox" id="assignChk-${m.id}" ${isCurrentLeader ? 'checked' : ''} onchange="handleLeaderCheckboxChange('${m.id}', 'assign')" class="accent-emerald-500 w-4 h-4">
                                                <span>Assign</span>
                                            </label>
                                            <label class="flex items-center space-x-2 cursor-pointer text-red-300 font-medium">
                                                <input type="checkbox" id="unassignChk-${m.id}" onchange="handleLeaderCheckboxChange('${m.id}', 'unassign')" class="accent-red-500 w-4 h-4">
                                                <span>Unassign</span>
                                            </label>
                                        </div>
                                        <button type="button" id="saveLeaderBtn-${m.id}" onclick="saveGroupLeaderAssignment('${fellowshipName}', '${fellowshipRow.id}', '${m.id}', '${m.full_name.replace(/'/g, "\\'")}')" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-1.5 rounded-lg text-xs transition shadow">
                                            Save
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>`}
                </div>
            `;
        }

        function toggleLeaderMemberDropdown(memberId) {
            const targetDropdown = document.getElementById(`leaderDropdown-${memberId}`);
            const targetChevron = document.getElementById(`leaderChevron-${memberId}`);
            if (!targetDropdown) return;

            const isCurrentlyHidden = targetDropdown.classList.contains('hidden');

            document.querySelectorAll('[id^="leaderDropdown-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="leaderChevron-"]').forEach(ic => ic.classList.remove('rotate-180'));

            if (isCurrentlyHidden) {
                targetDropdown.classList.remove('hidden');
                if (targetChevron) targetChevron.classList.add('rotate-180');
                expandedLeaderMemberId = memberId;
            } else {
                expandedLeaderMemberId = null;
            }
        }

        function handleLeaderCheckboxChange(memberId, actionType) {
            const assignBox = document.getElementById(`assignChk-${memberId}`);
            const unassignBox = document.getElementById(`unassignChk-${memberId}`);
            if (!assignBox || !unassignBox) return;

            if (actionType === 'assign') {
                if (assignBox.checked) {
                    unassignBox.checked = false;
                    selectedLeaderActionByMember[memberId] = 'assign';
                    document.querySelectorAll('[id^="assignChk-"]').forEach(cb => {
                        if (cb.id !== `assignChk-${memberId}`) cb.checked = false;
                    });
                } else {
                    delete selectedLeaderActionByMember[memberId];
                }
            } else if (actionType === 'unassign') {
                if (unassignBox.checked) {
                    assignBox.checked = false;
                    selectedLeaderActionByMember[memberId] = 'unassign';
                } else {
                    delete selectedLeaderActionByMember[memberId];
                }
            }
        }

        async function saveGroupLeaderAssignment(fellowshipName, fellowshipId, memberId, memberName) {
            const chosenAction = selectedLeaderActionByMember[memberId];
            const saveBtn = document.getElementById(`saveLeaderBtn-${memberId}`);

            if (!chosenAction) {
                showModal('Select Action', `Please tick either "Assign" or "Unassign" for ${memberName} before clicking Save.`, null, false);
                return;
            }

            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.innerText = 'Saving...';
            }

            try {
                if (chosenAction === 'assign') {
                    await supabaseClient
                        .from('group_leaders')
                        .update({ is_active: false })
                        .eq('fellowship_id', fellowshipId);

                    const { data: existingRow } = await supabaseClient
                        .from('group_leaders')
                        .select('id')
                        .eq('fellowship_id', fellowshipId)
                        .eq('member_id', memberId)
                        .maybeSingle();

                    if (existingRow) {
                        const { error: updErr } = await supabaseClient
                            .from('group_leaders')
                            .update({ is_active: true })
                            .eq('id', existingRow.id);
                        if (updErr) throw updErr;
                    } else {
                        const { error: insErr } = await supabaseClient
                            .from('group_leaders')
                            .insert([{
                                fellowship_id: fellowshipId,
                                member_id: memberId,
                                assigned_by: activeAdminSession?.id || null,
                                is_active: true
                            }]);
                        if (insErr) throw insErr;
                    }

                    showModal(
                        'Group Leader Assigned',
                        `${memberName} has been assigned as the Group Leader of ${fellowshipName}.`,
                        () => { loadFellowshipGroupMembers(fellowshipName); }
                    );
                } else if (chosenAction === 'unassign') {
                    const { error: unassignErr } = await supabaseClient
                        .from('group_leaders')
                        .update({ is_active: false })
                        .eq('fellowship_id', fellowshipId)
                        .eq('member_id', memberId);

                    if (unassignErr) throw unassignErr;

                    showModal(
                        'Group Leader Unassigned',
                        `${memberName} has been unassigned from ${fellowshipName} leadership.`,
                        () => { loadFellowshipGroupMembers(fellowshipName); }
                    );
                }
            } catch (err) {
                showModal('Assignment Failed', err.message || 'Could not update group leader assignment.', null, false);
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Save';
                }
            }
        }

        // --- BOOTSTRAP APPLICATION ---
        window.addEventListener('DOMContentLoaded', () => {
            if (activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoadingScreen();
            }
        });
    </script>
</body>
</html>
