                        </div>

                        <div id="directoryDetails-${m.id}" class="${isExpanded ? '' : 'hidden'} mt-2 ml-2 mr-2 p-4 rounded-xl bg-black/30 border border-white/10 grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs text-gray-300">
                            <p><span class="text-gray-400">Member ID:</span> <span class="font-mono text-blue-300">${m.member_id || 'N/A'}</span></p>
                            <p><span class="text-gray-400">Phone:</span> <span class="text-white">${m.phone || 'N/A'}</span></p>
                            <p><span class="text-gray-400">WhatsApp:</span> <span class="text-white">${m.whatsapp || 'N/A'}</span></p>
                            <p><span class="text-gray-400">Email:</span> <span class="text-white">${m.email || 'N/A'}</span></p>
                            <p><span class="text-gray-400">Gender:</span> <span class="text-white">${m.gender || 'N/A'}</span></p>
                            <p><span class="text-gray-400">Date of Birth:</span> <span class="text-white">${m.date_of_birth || 'N/A'}</span></p>
                            <p><span class="text-gray-400">Fellowship:</span> <span class="text-blue-400 font-medium">${fellowship}</span></p>
                            <p><span class="text-gray-400">Department:</span> <span class="text-amber-300 font-medium">${department}</span></p>
                            <p><span class="text-gray-400">State of Origin:</span> <span class="text-white">${m.state || 'N/A'}</span></p>
                            <p><span class="text-gray-400">Date Joined:</span> <span class="text-white">${m.date_joined || 'N/A'}</span></p>
                            <p class="sm:col-span-2"><span class="text-gray-400">Address:</span> <span class="text-white">${m.address || 'N/A'}</span></p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleDirectoryMemberDetails(memberId) {
            openDirectoryDropdownId = null;
            expandedDirectoryMemberId = expandedDirectoryMemberId === memberId ? null : memberId;
            filterAllMembersDirectory();
        }

        function toggleDirectoryRowMenu(e, memberId) {
            e.stopPropagation();
            openDirectoryDropdownId = openDirectoryDropdownId === memberId ? null : memberId;
            renderAllMembersRows(
                (document.getElementById('allMembersSearchInput')?.value || '').trim()
                    ? allAdminDirectoryMembers.filter(m => (m.full_name || '').toLowerCase().includes(document.getElementById('allMembersSearchInput').value.trim().toLowerCase()))
                    : allAdminDirectoryMembers
            );
        }

        document.addEventListener('click', () => {
            if (openDirectoryDropdownId !== null) {
                openDirectoryDropdownId = null;
                const container = document.getElementById('allMembersListContainer');
                if (container && allAdminDirectoryMembers.length > 0) {
                    filterAllMembersDirectory();
                }
            }
        });

        async function loadAdminMemberCount() {
            const { count, error } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            const el = document.getElementById('statTotalMembers');
            if (!error && el) el.innerText = count || 0;
        }

        // =========================================================================
        // FELLOWSHIPS MANAGEMENT (ADMIN)
        // =========================================================================
        function renderFellowshipsDashboard() {
            const main = document.getElementById('mainContent');
            if (!main) return;
            main.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div onclick="openFellowshipGroupPage('Men Fellowship')" class="card-bg p-6 rounded-2xl border border-blue-500/30 hover:border-blue-400 cursor-pointer transition space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-blue-400">Fellowship</span>
                            <i class="fa-solid fa-person text-blue-400 text-lg"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-white">Men Fellowship</h3>
                        <p class="text-xs text-gray-400">Manage Men Fellowship members and assign Group Leader.</p>
                    </div>
                    <div onclick="openFellowshipGroupPage('Women Fellowship')" class="card-bg p-6 rounded-2xl border border-pink-500/30 hover:border-pink-400 cursor-pointer transition space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-pink-400">Fellowship</span>
                            <i class="fa-solid fa-person-dress text-pink-400 text-lg"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-white">Women Fellowship</h3>
                        <p class="text-xs text-gray-400">Manage Women Fellowship members and assign Group Leader.</p>
                    </div>
                    <div onclick="openFellowshipGroupPage('Youth Fellowship')" class="card-bg p-6 rounded-2xl border border-amber-500/30 hover:border-amber-400 cursor-pointer transition space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Fellowship</span>
                            <i class="fa-solid fa-bolt text-amber-400 text-lg"></i>
                        </div>
                        <h3 class="text-xl font-extrabold text-white">Youth Fellowship</h3>
                        <p class="text-xs text-gray-400">Manage Youth Fellowship members and assign Group Leader.</p>
                    </div>
                </div>
            `;
        }

        function openFellowshipGroupPage(fellowshipName) {
            activeFellowshipContext = fellowshipName;
            activeAssignLeaderFellowship = null;
            selectedLeaderActionByMember = {};
            expandedLeaderMemberId = null;
            const title = document.getElementById('pageTitle');
            const main = document.getElementById('mainContent');
            if (title) title.innerText = fellowshipName;
            if (!main) return;

            main.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <button onclick="switchAdminView('fellowships')" class="card-bg hover:bg-white/5 text-gray-300 px-4 py-2 rounded-lg text-xs font-semibold border border-white/10 transition">
                            <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Fellowships
                        </button>
                        <div class="flex items-center gap-3">
                            <button onclick="openAssignGroupLeaderView('${fellowshipName}')" class="bg-amber-600 hover:bg-amber-700 text-black font-bold px-4 py-2 rounded-lg text-xs transition shadow-lg">
                                <i class="fa-solid fa-crown mr-1.5"></i> Assign Group Leader
                            </button>
                        </div>
                    </div>

                    <div id="assignLeaderPanel" class="hidden card-bg p-6 rounded-2xl border border-amber-500/30 space-y-4"></div>

                    <div class="card-bg p-6 rounded-2xl border border-white/10 space-y-4">
                        <div class="flex items-center justify-between border-b border-white/10 pb-3">
                            <div>
                                <h3 class="text-base font-bold text-white">${fellowshipName} Members</h3>
                                <p class="text-xs text-gray-400">Registered members in ${fellowshipName}</p>
                            </div>
                            <span id="fellowshipMemberCountBadge" class="text-xs px-3 py-1 rounded-full bg-blue-600/20 text-blue-300 font-semibold">Loading...</span>
                        </div>
                        <div id="fellowshipMembersList" class="divide-y divide-white/5">
                            <p class="py-6 text-center text-gray-400 text-xs">Loading members...</p>
                        </div>
                    </div>
                </div>
            `;

            loadFellowshipGroupMembers(fellowshipName);
        }

        async function loadFellowshipGroupMembers(fellowshipName) {
            const listEl = document.getElementById('fellowshipMembersList');
            const badgeEl = document.getElementById('fellowshipMemberCountBadge');
            if (!listEl) return;

            const membersFromJoin = await fetchFellowshipGroupMembersList(fellowshipName);
            if (badgeEl) badgeEl.innerText = `${membersFromJoin.length} Member(s)`;

            if (membersFromJoin.length === 0) {
                listEl.innerHTML = `<p class="py-6 text-center text-gray-400 text-xs">No members found in ${fellowshipName}.</p>`;
                return;
            }

            listEl.innerHTML = membersFromJoin.map(m => {
                const safeName = (m.full_name || '').replace(/'/g, "\\'");
                return `
                    <div class="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                            <p class="text-sm font-semibold text-white">${m.full_name}</p>
                            <p class="text-xs text-gray-400">${m.phone || 'No phone'} • ${m.member_id || ''}</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="openEditMemberModal('${m.id}', '${safeName}')" class="px-3 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 text-xs font-semibold border border-blue-500/30 transition">
                                <i class="fa-solid fa-pen mr-1"></i> Edit Name
                            </button>
                            <button onclick="deleteFellowshipMember('${m.id}', '${safeName}')" class="px-3 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600/30 text-red-300 text-xs font-semibold border border-red-500/30 transition">
                                <i class="fa-solid fa-trash mr-1"></i> Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openAssignGroupLeaderView(fellowshipName) {
            activeAssignLeaderFellowship = fellowshipName;
            const panel = document.getElementById('assignLeaderPanel');
            if (!panel) return;
            panel.classList.remove('hidden');
            panel.innerHTML = `<p class="text-xs text-gray-400">Loading ${fellowshipName} members and current leader...</p>`;

            const { row: fellowshipRow } = await ensureFellowshipRecord(fellowshipName);
            const members = await fetchFellowshipGroupMembersList(fellowshipName);

            let currentLeader = null;
            if (fellowshipRow?.id) {
                const { data: glRows } = await supabaseClient
                    .from('group_leaders')
                    .select('id, member_id, is_active, members(id, full_name)')
                    .eq('fellowship_id', fellowshipRow.id)
                    .eq('is_active', true);
                if (glRows && glRows.length > 0) {
                    currentLeader = glRows[0];
                }
            }

            panel.innerHTML = `
                <div class="flex items-center justify-between border-b border-white/10 pb-3">
                    <div>
                        <h4 class="text-sm font-bold text-amber-400">Assign Group Leader — ${fellowshipName}</h4>
                        <p class="text-xs text-gray-400">Current Leader: <strong class="text-white">${currentLeader?.members?.full_name || 'None Assigned'}</strong></p>
                    </div>
                    <button onclick="document.getElementById('assignLeaderPanel').classList.add('hidden')" class="text-xs text-gray-400 hover:text-white">Close</button>
                </div>
                <div class="divide-y divide-white/5 text-xs">
                    ${members.map(m => {
                        const isCurrent = currentLeader && String(currentLeader.member_id) === String(m.id);
                        const isExpanded = expandedLeaderMemberId === m.id;
                        const chosenAction = selectedLeaderActionByMember[m.id] || (isCurrent ? 'remove' : 'assign');
                        const safeName = (m.full_name || '').replace(/'/g, "\\'");

                        return `
                            <div class="py-3">
                                <div class="flex items-center justify-between">
                                    <button type="button" onclick="toggleLeaderMemberDropdown('${m.id}', '${fellowshipName}')" class="text-left font-semibold text-white hover:text-amber-300 transition flex items-center space-x-2">
                                        <span>${m.full_name}</span>
                                        ${isCurrent ? '<span class="px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold">Group Leader</span>' : ''}
                                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
                                    </button>
                                </div>
                                <div id="leaderActionBox-${m.id}" class="${isExpanded ? '' : 'hidden'} mt-3 p-3 rounded-xl bg-black/30 border border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                    <select onchange="onLeaderActionSelect('${m.id}', this.value)" class="bg-black/50 border border-white/15 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                                        <option value="assign" ${chosenAction === 'assign' ? 'selected' : ''}>Assign as Group Leader</option>
                                        <option value="remove" ${chosenAction === 'remove' ? 'selected' : ''}>Remove from Group Leader</option>
                                    </select>
                                    <button type="button" onclick="saveGroupLeaderDecision('${m.id}', '${safeName}', '${fellowshipName}', '${fellowshipRow?.id || ''}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition">
                                        Save
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function toggleLeaderMemberDropdown(memberId, fellowshipName) {
            expandedLeaderMemberId = expandedLeaderMemberId === memberId ? null : memberId;
            openAssignGroupLeaderView(fellowshipName);
        }

        function onLeaderActionSelect(memberId, actionVal) {
            selectedLeaderActionByMember[memberId] = actionVal;
        }

        async function saveGroupLeaderDecision(memberId, memberName, fellowshipName, fellowshipId) {
            const action = selectedLeaderActionByMember[memberId] || 'assign';
            let fId = fellowshipId;
            if (!fId) {
                const { row } = await ensureFellowshipRecord(fellowshipName);
                fId = row?.id;
            }
            if (!fId) {
                showModal('Error', 'Fellowship record not found.', null, false);
                return;
            }

            if (action === 'assign') {
                await supabaseClient.from('group_leaders').update({ is_active: false }).eq('fellowship_id', fId);
                const { data: existing } = await supabaseClient
                    .from('group_leaders')
                    .select('id')
                    .eq('fellowship_id', fId)
                    .eq('member_id', memberId)
                    .maybeSingle();

                if (existing?.id) {
                    await supabaseClient.from('group_leaders').update({ is_active: true }).eq('id', existing.id);
                } else {
                    await supabaseClient.from('group_leaders').insert([{ fellowship_id: fId, member_id: memberId, is_active: true }]);
                }

                showModal('Group Leader Assigned', `${memberName} is now the assigned Group Leader for ${fellowshipName}.`, () => {
                    expandedLeaderMemberId = null;
                    openAssignGroupLeaderView(fellowshipName);
                });
            } else {
                await supabaseClient
                    .from('group_leaders')
                    .update({ is_active: false })
                    .eq('fellowship_id', fId)
                    .eq('member_id', memberId);

                showModal('Group Leader Removed', `${memberName} has been removed as Group Leader for ${fellowshipName}.`, () => {
                    expandedLeaderMemberId = null;
                    openAssignGroupLeaderView(fellowshipName);
                });
            }
        }

        // =========================================================================
        // WORKERS & DEPARTMENTS MANAGEMENT (ADMIN)
        // =========================================================================
        async function renderWorkersDashboard() {
            const main = document.getElementById('mainContent');
            if (!main) return;
            openWorkerDropdownId = null;

            const [deptMembers, leadershipState] = await Promise.all([
                fetchDepartmentMembersList(),
                fetchWorkersLeadershipState()
            ]);

            const currentLeader = deptMembers.find(w => String(w.id) === String(leadershipState.workersLeaderId));
            const currentVice = deptMembers.find(w => String(w.id) === String(leadershipState.viceLeaderId));
            pendingWorkersLeaderId = currentLeader ? currentLeader.id : null;
            pendingViceLeaderId = currentVice ? currentVice.id : null;

            main.innerHTML = `
                <div class="space-y-6">
                    <div class="card-bg p-6 rounded-2xl border border-purple-500/30 space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-3">
                            <div>
                                <h3 class="text-base font-bold text-purple-300">Assign Workers Leader & Vice Leader</h3>
                                <p class="text-xs text-gray-400">
                                    Current Workers Leader: <strong class="text-amber-300">${currentLeader ? `${currentLeader.full_name} (${currentLeader.department})` : 'None Assigned'}</strong> •
                                    Current Vice Leader: <strong class="text-indigo-300">${currentVice ? `${currentVice.full_name} (${currentVice.department})` : 'None Assigned'}</strong>
                                </p>
                            </div>
                        </div>

                        <div class="divide-y divide-white/5 text-xs">
                            ${deptMembers.length > 0 ? deptMembers.map(w => {
                                const isLeader = String(w.id) === String(pendingWorkersLeaderId);
                                const isVice = String(w.id) === String(pendingViceLeaderId);
                                const isOpen = openWorkerDropdownId === w.id;
                                const currentSelection = isLeader ? 'workers_leader' : (isVice ? 'vice_leader' : 'none');

                                return `
                                    <div class="py-3">
                                        <div class="flex items-center justify-between gap-2">
                                            <button type="button" onclick="toggleWorkerRoleDropdown('${w.id}')" class="text-left font-semibold text-white hover:text-purple-300 transition flex flex-wrap items-center gap-2">
                                                <span>${w.full_name}</span>
                                                <span class="text-gray-400 text-[11px]">(${w.department})</span>
                                                ${isLeader ? '<span class="px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 text-[10px] font-bold">Workers Leader</span>' : ''}
                                                ${isVice ? '<span class="px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 text-[10px] font-bold">Vice Leader</span>' : ''}
                                                <i class="fa-solid fa-chevron-down text-[10px] text-gray-400"></i>
                                            </button>
                                        </div>
                                        <div id="workerRoleBox-${w.id}" class="${isOpen ? '' : 'hidden'} mt-3 p-3 rounded-xl bg-black/30 border border-white/10 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                            <select id="workerRoleSelect-${w.id}" class="bg-black/50 border border-white/15 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500">
                                                <option value="none" ${currentSelection === 'none' ? 'selected' : ''}>Standard Worker (No Leadership Role)</option>
                                                <option value="workers_leader" ${currentSelection === 'workers_leader' ? 'selected' : ''}>Assign as Workers Leader</option>
                                                <option value="vice_leader" ${currentSelection === 'vice_leader' ? 'selected' : ''}>Assign as Vice Leader</option>
                                            </select>
                                            <button type="button" onclick="saveWorkerLeadershipSelection('${w.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition">
                                                Save
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('') : '<p class="py-4 text-gray-400">No workers registered in departments yet.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleWorkerRoleDropdown(workerId) {
            openWorkerDropdownId = openWorkerDropdownId === workerId ? null : workerId;
            renderWorkersDashboard();
        }

        async function saveWorkerLeadershipSelection(workerId) {
            const choice = document.getElementById(`workerRoleSelect-${workerId}`)?.value || 'none';
            let nextLeaderId = pendingWorkersLeaderId;
            let nextViceId = pendingViceLeaderId;

            if (choice === 'workers_leader') {
                nextLeaderId = workerId;
                if (String(nextViceId) === String(workerId)) nextViceId = null;
            } else if (choice === 'vice_leader') {
                nextViceId = workerId;
                if (String(nextLeaderId) === String(workerId)) nextLeaderId = null;
            } else {
                if (String(nextLeaderId) === String(workerId)) nextLeaderId = null;
                if (String(nextViceId) === String(workerId)) nextViceId = null;
            }

            await saveWorkersLeadershipPair(nextLeaderId, nextViceId);
            openWorkerDropdownId = null;
            showModal('Workers Leadership Updated', 'Workers leadership assignment has been saved.', () => {
                renderWorkersDashboard();
            });
        }

        // =========================================================================
        // INITIALIZE APP ENTRY
        // =========================================================================
        (async function bootstrapApp() {
            if (activeAdminSession) {
                renderFullAdminDashboard();
            } else if (activeMemberSession) {
                renderMemberDashboardShell();
            } else {
                renderLoadingScreen();
            }
        })();
    </script>
</body>
</html>
