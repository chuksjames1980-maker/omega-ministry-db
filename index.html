        const PWA_APP_NAME = "OMEGA MINISTRY DN";
        let deferredPwaInstallPrompt = null;

        function isAppAlreadyInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function openPwaInstallPopup() {
            if (isAppAlreadyInstalled()) return;
            const modal = document.getElementById('pwaAutoInstallModal');
            if (modal) modal.classList.remove('hidden');
        }

        function dismissPwaInstallPopup() {
            const modal = document.getElementById('pwaAutoInstallModal');
            if (modal) modal.classList.add('hidden');
            sessionStorage.setItem('ocm_pwa_popup_dismissed', '1');
        }

        function initPwaSupport() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch((err) => {
                    console.warn('Service worker registration error:', err);
                });
            }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPwaInstallPrompt = e;
                openPwaInstallPopup();
            });

            window.addEventListener('appinstalled', () => {
                deferredPwaInstallPrompt = null;
                dismissPwaInstallPopup();
                showModal('App Installed', `${PWA_APP_NAME} has been installed on your device.`);
            });

            if (!isAppAlreadyInstalled() && !sessionStorage.getItem('ocm_pwa_popup_dismissed')) {
                setTimeout(() => {
                    openPwaInstallPopup();
                }, 800);
            }
        }

        async function executePwaInstallNow() {
            const hintBox = document.getElementById('pwaInstallManualHint');
            if (deferredPwaInstallPrompt) {
                deferredPwaInstallPrompt.prompt();
                const choiceResult = await deferredPwaInstallPrompt.userChoice;
                deferredPwaInstallPrompt = null;
                if (choiceResult && choiceResult.outcome === 'accepted') {
                    dismissPwaInstallPopup();
                }
                return;
            }

            const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
            if (hintBox) {
                hintBox.classList.remove('hidden');
                if (isIos) {
                    hintBox.innerHTML = `
                        <p class="font-bold text-amber-300">Install on iPhone / iPad:</p>
                        <p>1. Tap the <strong>Share</strong> icon at the bottom of Safari.</p>
                        <p>2. Tap <strong>Add to Home Screen</strong>, then tap <strong>Add</strong>.</p>
                    `;
                } else {
                    hintBox.innerHTML = `
                        <p class="font-bold text-amber-300">Install on Android Chrome:</p>
                        <p>1. Make sure your phone's <strong>Home screen layout</strong> is unlocked.</p>
                        <p>2. Tap Chrome's <strong>three dots (⋮)</strong> at the top-right and tap <strong>Install app</strong> (or <strong>Add to Home screen</strong>).</p>
                    `;
                }
            }
        }

        function formatMonthLabel(ym) {
            if (!ym || !/^\d{4}-\d{2}$/.test(ym)) return ym || 'N/A';
            const [y, m] = ym.split('-').map(Number);
            const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${names[(m - 1) % 12]} ${y}`;
        }

        function getCurrentYearMonth() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function addMonthsToYearMonth(ym, delta) {
            const [y, m] = ym.split('-').map(Number);
            const total = (y * 12 + (m - 1)) + delta;
            const ny = Math.floor(total / 12);
            const nm = (total % 12) + 1;
            return `${ny}-${String(nm).padStart(2, '0')}`;
        }

        function diffMonthsInclusive(startYm, endYm) {
            const [sy, sm] = startYm.split('-').map(Number);
            const [ey, em] = endYm.split('-').map(Number);
            return (ey * 12 + (em - 1)) - (sy * 12 + (sm - 1)) + 1;
        }

        // =========================================================================

        function getLocalAssignedDutiesMap() {
            try {
                const parsed = JSON.parse(localStorage.getItem('ocm_member_assigned_duties_v1') || '{}');
                return parsed && typeof parsed === 'object' ? parsed : {};

        function saveLocalAssignedDutiesMap(mapObj) {

        async function fetchMemberAssignedDuties(memberId, memberPhone = '') {
            const localMap = getLocalAssignedDutiesMap();
            const localEntry = localMap[String(memberId)];
            try {
                const { data, error } = await supabaseClient
                    .from('member_assigned_duties')
                    .select('*')
                    .eq('member_id', memberId)
                    .maybeSingle();
                if (!error && data && Array.isArray(data.duties)) {
                    localMap[String(memberId)] = data;
                    saveLocalAssignedDutiesMap(localMap);
                    return data.duties;
                }
            } catch (e) {
                console.warn('member_assigned_duties fallback:', e);
            }
            if (localEntry && Array.isArray(localEntry.duties)) return localEntry.duties;
            if (memberPhone) {
                const matched = Object.values(localMap).find(x => x && x.phone && String(x.phone) === String(memberPhone));
                if (matched && Array.isArray(matched.duties)) return matched.duties;
            }
            return [];
        }

        async function saveMemberAssignedDuties(memberObj, dutiesArray) {
            const payload = {
                member_id: memberObj.id,
                member_name: memberObj.full_name,
                phone: memberObj.phone || '',
                whatsapp: memberObj.whatsapp || '',
                duties: dutiesArray,
                approved_by: activeAdminSession?.full_name || 'Main Admin',
                updated_at: new Date().toISOString()
            };

            const localMap = getLocalAssignedDutiesMap();
            localMap[String(memberObj.id)] = payload;
            saveLocalAssignedDutiesMap(localMap);

            try {
                await supabaseClient
                    .from('member_assigned_duties')
                    .upsert([payload], { onConflict: 'member_id' });
            } catch (e) {
                console.warn('Supabase member_assigned_duties sync fallback:', e);
            }
        }

        async function safeSupabaseSelect(table, orderCol = null) {
            try {
                let q = supabaseClient.from(table).select('*');
                if (orderCol) q = q.order(orderCol, { ascending: false });
                const { data, error } = await q;
                if (error) return [];
                return Array.isArray(data) ? data : [];
            } catch (e) {
                return [];
            }
        }

        function extractRowAmount(row) {
            const candidates = [row.amount, row.total_amount, row.value, row.sum];
            for (const c of candidates) {
                if (c !== undefined && c !== null && !Number.isNaN(Number(c))) {
                    return Number(c);
                }
            }
            return 0;
        }

        function extractRowLabel(row, fallback = 'Record') {
            return row.title || row.topic || row.description || row.narration || row.category || row.service_type || row.testifier_name || row.member_name || row.full_name || fallback;
        }

        function extractRowDate(row) {
            return row.date || row.service_date || row.record_date || row.testimony_date || row.entry_date || row.report_date || (row.created_at ? String(row.created_at).slice(0, 10) : new Date().toISOString().slice(0, 10));
        }

        function classifyFinanceRow(row) {
            const raw = `${row.type || ''} ${row.category || ''} ${row.record_type || ''} ${row.title || ''} ${row.description || ''}`.toLowerCase();
            if (raw.includes('welfare') && (raw.includes('offering') || raw.includes('inflow'))) return 'welfare_offering';
            if (raw.includes('welfare')) return 'welfare_record';
            if (raw.includes('tithe')) return 'tithe_record';
            if (raw.includes('seed')) return 'seed_record';
            if (raw.includes('building')) return 'building_offering';
            if (raw.includes('program')) return 'program_record';
            if (raw.includes('maintenance') || raw.includes('repair')) return 'maintenance_record';
            if (raw.includes('offering')) return 'offering_record';
            return 'other';
        }

        async function refreshLiveAdminDashboardData() {
            const [
                membersRows,
                popReports,
                serviceAttLogs,
                testimoniesRows,
                firstTimersRows,
                welfareOfferingRows,
                titheRows,
                offeringRows,
                seedRows,
                buildingRows,
                programRows,
                welfareRecordRows,
                maintenanceRows,
                genericFinanceRows,
                carParkedDbRows
            ] = await Promise.all([
                safeSupabaseSelect('members'),
                safeSupabaseSelect('population_reports', 'service_date'),
                safeSupabaseSelect('service_attendance_logs', 'service_date'),
                safeSupabaseSelect('testimonies'),
                safeSupabaseSelect('first_timers'),
                safeSupabaseSelect('welfare_offering'),
                safeSupabaseSelect('tithe_record'),
                safeSupabaseSelect('offering_record'),
                safeSupabaseSelect('seed_record'),
                safeSupabaseSelect('building_offering'),
                safeSupabaseSelect('program_record'),
                safeSupabaseSelect('welfare_record'),
                safeSupabaseSelect('maintenance_record'),
                safeSupabaseSelect('financial_records'),
                safeSupabaseSelect('car_parked_reports')
            ]);

            const buckets = {
                welfare_offering: [],
                tithe_record: [],
                offering_record: [],
                seed_record: [],
                building_offering: [],
                program_record: [],
                welfare_record: [],
                maintenance_record: []
            };

            const pushRows = (rows, targetKey) => {
                rows.forEach(r => {
                    buckets[targetKey].push({
                        label: extractRowLabel(r),
                        date: extractRowDate(r),
                        amount: extractRowAmount(r)
                    });
                });
            };

            pushRows(welfareOfferingRows, 'welfare_offering');
            pushRows(titheRows, 'tithe_record');
            pushRows(offeringRows, 'offering_record');
            pushRows(seedRows, 'seed_record');
            pushRows(buildingRows, 'building_offering');
            pushRows(programRows, 'program_record');
            pushRows(welfareRecordRows, 'welfare_record');
            pushRows(maintenanceRows, 'maintenance_record');

            genericFinanceRows.forEach(r => {
                const k = classifyFinanceRow(r);
                if (buckets[k]) {
                    buckets[k].push({
                        label: extractRowLabel(r),
                        date: extractRowDate(r),
                        amount: extractRowAmount(r)
                    });
                }
            });

            const sumBucket = (arr) => arr.reduce((acc, x) => acc + Number(x.amount || 0), 0);

            const welfareOffering = sumBucket(buckets.welfare_offering);
            const titheRecord = sumBucket(buckets.tithe_record);
            const offeringRecord = sumBucket(buckets.offering_record);
            const seedRecord = sumBucket(buckets.seed_record);
            const buildingOffering = sumBucket(buckets.building_offering);
            const programRecord = sumBucket(buckets.program_record);
            const welfareRecord = sumBucket(buckets.welfare_record);
            const maintenanceRecord = sumBucket(buckets.maintenance_record);

            // Inflow = welfare offering + tithe record + offering record + seed record + building offering
            const inflow = welfareOffering + titheRecord + offeringRecord + seedRecord + buildingOffering;
            // Expenses = welfare record + maintenance
            const expenses = welfareRecord + maintenanceRecord;
            // Balance = inflow - expenses
            const balance = inflow - expenses;

            const popTotalAtt = popReports.reduce((sum, r) => sum + Number(r.total_attendance || 0), 0);
            const logsTotalAtt = serviceAttLogs.reduce((sum, r) => sum + Number(r.total_count || (Number(r.adult_count || 0) + Number(r.children_count || 0) + Number(r.workers_count || 0))), 0);
            const serviceAttendanceCount = popTotalAtt + logsTotalAtt;

            const popChildrenAtt = popReports.reduce((sum, r) => sum + Number(r.children_count || 0), 0);
            const logsChildrenAtt = serviceAttLogs.reduce((sum, r) => sum + Number(r.children_count || 0), 0);
            const childrenAttendanceCount = popChildrenAtt + logsChildrenAtt;

            const popFirstTimers = popReports.reduce((sum, r) => sum + Number(r.first_timers_count || 0), 0);
            const firstTimersCount = popFirstTimers + firstTimersRows.length;

            const currentMonthStr = getCurrentYearMonth().slice(5, 7);
            const birthdayMembers = membersRows.filter(m => {
                const dob = String(m.date_of_birth || '');
                return dob.length >= 7 && dob.slice(5, 7) === currentMonthStr;
            });

            const serviceAttItems = [
                ...serviceAttLogs.map(r => ({
                    label: `Service Log (A:${r.adult_count || 0}, C:${r.children_count || 0}, W:${r.workers_count || 0}) ${r.report_details ? '— ' + r.report_details : ''}`,
                    date: extractRowDate(r),
                    amount: Number(r.total_count || (Number(r.adult_count || 0) + Number(r.children_count || 0) + Number(r.workers_count || 0)))
                })),
                ...popReports.map(r => ({
                    label: r.service_type || 'Service Attendance',
                    date: extractRowDate(r),
                    amount: Number(r.total_attendance || 0)
                }))
            ];

            const childrenAttItems = [
                ...serviceAttLogs.filter(r => Number(r.children_count || 0) > 0).map(r => ({
                    label: `Children (${r.service_date || ''})`,
                    date: extractRowDate(r),
                    amount: Number(r.children_count || 0)
                })),
                ...popReports.map(r => ({
                    label: r.service_type || 'Children Church',
                    date: extractRowDate(r),
                    amount: Number(r.children_count || 0)
                }))
            ];

            const firstTimersItems = [
                ...firstTimersRows.map(ft => ({
                    label: `${ft.full_name || 'First Timer'} (${ft.service_day || 'Service'}) • ${ft.phone || ''}`,
                    date: extractRowDate(ft),
                    amount: 1
                })),
                ...popReports.filter(r => Number(r.first_timers_count || 0) > 0).map(r => ({
                    label: r.service_type || 'First Timers',
                    date: extractRowDate(r),
                    amount: Number(r.first_timers_count || 0)
                }))
            ];

            const birthdayItems = birthdayMembers.map(m => ({
                label: m.full_name || 'Member',
                date: m.date_of_birth || 'N/A',
                amount: 1
            }));

            const testimoniesItems = testimoniesRows.map(t => ({
                label: `${t.testifier_name || 'Testifier'}: ${t.topic || 'Testimony'} — ${t.details || ''}`,
                date: extractRowDate(t),
                amount: 1
            }));

            // Build time-series grouped by date for Financial View Chart & Overview
            const dateMap = new Map();
            const addToDate = (dStr, inflowDelta, expDelta, maintDelta) => {
                const key = (dStr && /^\d{4}-\d{2}-\d{2}/.test(String(dStr))) ? String(dStr).slice(0, 10) : new Date().toISOString().slice(0, 10);
                const cur = dateMap.get(key) || { date: key, inflow: 0, expenses: 0, maintenance: 0, balance: 0 };
                cur.inflow += Number(inflowDelta || 0);
                cur.expenses += Number(expDelta || 0);
                cur.maintenance += Number(maintDelta || 0);
                dateMap.set(key, cur);
            };

            ['welfare_offering', 'tithe_record', 'offering_record', 'seed_record', 'building_offering'].forEach(k => {
                (buckets[k] || []).forEach(item => addToDate(item.date, item.amount, 0, 0));
            });
            (buckets.welfare_record || []).forEach(item => addToDate(item.date, 0, item.amount, 0));
            (buckets.maintenance_record || []).forEach(item => addToDate(item.date, 0, item.amount, item.amount));

            const sortedDates = Array.from(dateMap.values()).sort((a, b) => a.date.localeCompare(b.date));
            let runningBal = 0;
            const seriesByDate = sortedDates.map(pt => {
                runningBal += (pt.inflow - pt.expenses);
                return { ...pt, balance: runningBal };
            });

            const mergedCars = [...carParkedDbRows, ...getLocalCarParkedReports()];

            liveAdminDashboardData = {
                welfareOffering,
                titheRecord,
                offeringRecord,
                seedRecord,
                buildingOffering,
                programRecord,
                welfareRecord,
                maintenanceRecord,
                inflow,
                expenses,
                balance,
                testimoniesCount: testimoniesRows.length,
                serviceAttendanceCount,
                childrenAttendanceCount,
                membersCount: membersRows.length,
                firstTimersCount,
                birthdaysCount: birthdayMembers.length,
                carParkedCount: mergedCars.length,
                itemsByKey: {
                    welfare_offering: buckets.welfare_offering,
                    tithe_record: buckets.tithe_record,
                    offering_record: buckets.offering_record,
                    seed_record: buckets.seed_record,
                    building_offering: buckets.building_offering,
                    program_record: buckets.program_record,
                    welfare_record: buckets.welfare_record,
                    maintenance_record: buckets.maintenance_record,
                    testimonies: testimoniesItems,
                    service_attendance: serviceAttItems,
                    children_attendance: childrenAttItems,
                    first_timers: firstTimersItems,
                    birthdays: birthdayItems
                },
                seriesByDate
            };

            const setText = (id, val) => {
                const el = document.getElementById(id);
                if (el) el.innerText = val;
            };

            setText('adminCardInflow', formatNaira(inflow));
            setText('adminCardTestimonies', String(testimoniesRows.length));
            setText('adminCardServiceAtt', String(serviceAttendanceCount));
            setText('adminCardChildrenAtt', String(childrenAttendanceCount));
            setText('adminCardExpenses', formatNaira(expenses));
            setText('adminCardBalance', formatNaira(balance));
            setText('statTotalMembers', String(membersRows.length));
            setText('adminCardFirstTimers', String(firstTimersCount));
            setText('adminCardBirthdays', String(birthdayMembers.length));
            setText('adminCardOfferingRec', formatNaira(offeringRecord));
            setText('adminCardTitheRec', formatNaira(titheRecord));
            setText('adminCardSeedRec', formatNaira(seedRecord));
            setText('adminCardProgramRec', formatNaira(programRecord));
            setText('adminCardMaintenance', formatNaira(maintenanceRecord));
            setText('adminCardBuildingOff', formatNaira(buildingOffering));
            setText('adminCardWelfareRec', formatNaira(welfareRecord));
            setText('adminCardWelfareOffering', formatNaira(welfareOffering));

            renderAdminFinancialChartAndOverview();
        }

        function getMemberGroupExcoProfile(member) {
            if (!member) return null;
            const userFellowship = member?.member_fellowships?.[0]?.fellowships?.name || inferFellowshipFromMember(member);
            const all = JSON.parse(localStorage.getItem('ocm_group_exco_roles_v1') || '{}');
            for (const [fName, entries] of Object.entries(all)) {
                const found = (entries || []).find(e => String(e.memberId) === String(member.id));
                if (found && Array.isArray(found.roles) && found.roles.length > 0) {
                    return { fellowshipName: fName, roles: found.roles, memberName: member.full_name };
                }
            }
            const fallback = getGroupExcoAssignments(userFellowship).find(e => String(e.memberId) === String(member.id));
            if (fallback && Array.isArray(fallback.roles) && fallback.roles.length > 0) {
                return { fellowshipName: userFellowship, roles: fallback.roles, memberName: member.full_name };
            }
            return null;
        }

        function computeMemberDuesAccount(member, fellowshipName) {
            const settings = getGroupSettings(fellowshipName);
            const monthlyRate = Number(settings.monthlyDues) || getGlobalDefaultDues();
            const currentYm = getCurrentYearMonth();

            let startYm = '2026-01';
            if (member?.date_joined && /^\d{4}-\d{2}/.test(member.date_joined)) {
                startYm = member.date_joined.slice(0, 7);
            }
            if (startYm > currentYm) {
                startYm = currentYm;
            }

            const payments = getAllDuesPaymentsLedger()
                .filter(p => String(p.memberId) === String(member.id))
                .sort((a, b) => new Date(a.paidAt) - new Date(b.paidAt));

            const totalPaidAmount = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);

            let cursorYm = startYm;
            let unallocatedRemainder = 0;
            const paidMonthEntries = [];

            const detailedPayments = payments.map(p => {
                const rateAtTime = Number(p.rateAtPayment || monthlyRate);
                const available = Number(p.amount || 0) + unallocatedRemainder;
                const monthsCovered = Math.floor(available / rateAtTime);
                unallocatedRemainder = available % rateAtTime;

                const coveredFrom = monthsCovered > 0 ? cursorYm : null;
                const coveredTo = monthsCovered > 0 ? addMonthsToYearMonth(cursorYm, monthsCovered - 1) : null;
                for (let i = 0; i < monthsCovered; i++) {
                    const mYm = addMonthsToYearMonth(cursorYm, i);
                    paidMonthEntries.push({
                        ym: mYm,
                        label: formatMonthLabel(mYm),
                        amount: rateAtTime,
                        paidAt: p.paidAt,
                        isAdvance: mYm > currentYm
                    });
                }
                if (monthsCovered > 0) {
                    cursorYm = addMonthsToYearMonth(cursorYm, monthsCovered);
                }
                return {
                    ...p,
                    rateAtTime,
                    monthsCovered,
                    coveredFrom,
                    coveredTo
                };
            });

            if (unallocatedRemainder >= monthlyRate) {
                const extraMonths = Math.floor(unallocatedRemainder / monthlyRate);
                unallocatedRemainder = unallocatedRemainder % monthlyRate;
                for (let i = 0; i < extraMonths; i++) {
                    const mYm = addMonthsToYearMonth(cursorYm, i);
                    paidMonthEntries.push({
                        ym: mYm,
                        label: formatMonthLabel(mYm),
                        amount: monthlyRate,
                        paidAt: new Date().toISOString(),
                        isAdvance: mYm > currentYm
                    });
                }
                cursorYm = addMonthsToYearMonth(cursorYm, extraMonths);
            }

            const lastPaidYm = cursorYm > startYm ? addMonthsToYearMonth(cursorYm, -1) : null;
            const totalExpectedMonths = Math.max(1, diffMonthsInclusive(startYm, currentYm));

            let monthsOwing = 0;
            let advanceMonths = 0;
            const unpaidMonthsList = [];

            if (cursorYm <= currentYm) {
                monthsOwing = diffMonthsInclusive(cursorYm, currentYm);
                for (let i = 0; i < monthsOwing; i++) {
                    const mYm = addMonthsToYearMonth(cursorYm, i);
                    unpaidMonthsList.push({
                        ym: mYm,
                        label: formatMonthLabel(mYm),
                        amount: monthlyRate
                    });
                }
            } else {
                advanceMonths = diffMonthsInclusive(addMonthsToYearMonth(currentYm, 1), cursorYm);
            }

            const arrearsAmount = monthsOwing * monthlyRate;
            const advanceAmount = (advanceMonths * monthlyRate) + unallocatedRemainder;
            const paidMonthsUpToNow = Math.max(0, totalExpectedMonths - monthsOwing);
            const completionPercent = Math.min(100, Math.round((paidMonthsUpToNow / totalExpectedMonths) * 100));

            return {
                fellowshipName,
                monthlyRate,
                startYm,
                currentYm,
                lastPaidYm,
                nextDueYm: cursorYm,
                totalPaidAmount,
                monthsOwing,
                arrearsAmount,
                unpaidMonthsList,
                paidMonthEntries,
                advanceMonths,
                advanceAmount,
                completionPercent,
                payments: detailedPayments
            };
        }

        async function executeConfirmedMemberDelete() {
            if (!pendingDeleteMember) return;
            const target = pendingDeleteMember;
            const yesBtn = document.getElementById('confirmDeleteYesBtn');
            if (yesBtn) {
                yesBtn.disabled = true;
                yesBtn.innerText = 'Deleting...';
            }

            try {
                const cleanupTables = [
                    'member_fellowships',
                    'member_departments',
                    'group_leaders',
                    'report_takers',
                    'population_reports',
                    'member_assigned_duties'
                ];

                for (const tableName of cleanupTables) {
                    const { error: cleanErr } = await supabaseClient
                        .from(tableName)
                        .delete()
                        .eq('member_id', target.id);

                    if (cleanErr && !/does not exist|schema cache|relation/i.test(cleanErr.message || '')) {
                        throw cleanErr;
                    }
                }

                const { data: deletedRows, error } = await supabaseClient
                    .from('members')
                    .delete()
                    .eq('id', target.id)
                    .select('id');

                if (error) throw error;

                if (!deletedRows || deletedRows.length === 0) {
                    throw new Error(
                        'Delete was blocked by Supabase Row Level Security (RLS) policy on the "members" table. Add a DELETE policy for anon/authenticated in Supabase SQL Editor and try again.'
                    );
                }

                closeConfirmDeleteModal();
                expandedDirectoryMemberId = null;

                showModal('Member Deleted', `"${target.name}" has been deleted and removed from ${target.group} and the database.`, async () => {
                    await renderAllMembersDirectoryView();
                    if (document.getElementById('statTotalMembers')) {
                        await refreshLiveAdminDashboardData();
                    }
                });
            } catch (err) {
                closeConfirmDeleteModal();
                showModal('Delete Failed', err.message || 'Could not delete member.', null, false);
            } finally {
                if (yesBtn) {
                    yesBtn.disabled = false;
                    yesBtn.innerText = 'Yes';
                }
            }
        }

        async function hashPin(pin) {
            const encoder = new TextEncoder();
            const data = encoder.encode("OCM_SALT_" + pin);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function ensureFellowshipRecord(fellowshipName) {
            if (!fellowshipName) return { row: null, error: null };
            const { data: existing, error: selErr } = await supabaseClient
                .from('fellowships')
                .select('id, name')
                .eq('name', fellowshipName)
                .maybeSingle();

            if (selErr) return { row: null, error: selErr };
            if (existing) return { row: existing, error: null };

            const { data: inserted, error: insErr } = await supabaseClient
                .from('fellowships')
                .insert([{ name: fellowshipName }])
                .select('id, name')
                .maybeSingle();

            return { row: inserted || null, error: insErr };
        }

        async function ensureDepartmentRecord(departmentName) {
            if (!departmentName || departmentName === 'None') return { row: null, error: null };
            const { data: existing, error: selErr } = await supabaseClient
                .from('departments')
                .select('id, name')
                .eq('name', departmentName)
                .maybeSingle();

            if (selErr) return { row: null, error: selErr };
            if (existing) return { row: existing, error: null };

            const { data: inserted, error: insErr } = await supabaseClient
                .from('departments')
                .insert([{ name: departmentName }])
                .select('id, name')
                .maybeSingle();

            return { row: inserted || null, error: insErr };
        }

        async function fetchFellowshipGroupMembersList(fellowshipName) {
            const { row: fellowshipRow } = await ensureFellowshipRecord(fellowshipName);
            let membersFromJoin = [];
            if (fellowshipRow?.id) {
                const { data: mfRows, error: mfErr } = await supabaseClient
                    .from('member_fellowships')
                    .select('member_id, members(*)')
                    .eq('fellowship_id', fellowshipRow.id);
                if (!mfErr && Array.isArray(mfRows)) {
                    membersFromJoin = mfRows.map(r => r.members).filter(Boolean);
                }
            }

            if (membersFromJoin.length === 0) {
                const { data: allMembers } = await supabaseClient.from('members').select('*');
                const matched = (allMembers || []).filter(m => inferFellowshipFromMember(m) === fellowshipName);
                if (fellowshipRow?.id) {
                    for (const mem of matched) {
                        await supabaseClient.from('member_fellowships').upsert(
                            [{ member_id: mem.id, fellowship_id: fellowshipRow.id }],
                            { onConflict: 'member_id,fellowship_id' }
                        );
                    }
                }
                membersFromJoin = matched;
            }

            return membersFromJoin.sort((a, b) => (a.full_name || '').localeCompare(b.full_name || ''));
        }

        async function fetchDepartmentMembersList() {
            const [{ data: mdRows }, { data: deptRows }, { data: allMembers }] = await Promise.all([
                supabaseClient.from('member_departments').select('member_id, department_id'),
                supabaseClient.from('departments').select('id, name'),
                supabaseClient.from('members').select('*')
            ]);

            const deptMap = new Map((deptRows || []).map(d => [String(d.id), d.name]));
            const memberMap = new Map((allMembers || []).map(m => [String(m.id), m]));
            const combinedByMemberId = new Map();

            (mdRows || []).forEach(row => {
                const mem = memberMap.get(String(row.member_id));
                if (mem) {
                    const dName = deptMap.get(String(row.department_id)) || mem.assigned_department || 'Worker';
                    combinedByMemberId.set(String(mem.id), {
                        id: mem.id,
                        full_name: mem.full_name,
                        phone: mem.phone || '',
                        member_id: mem.member_id || '',
                        department: dName
                    });
                }
            });

            (allMembers || []).forEach(mem => {
                const key = String(mem.id);
                if (!combinedByMemberId.has(key)) {
                    const hasDept = mem.assigned_department && mem.assigned_department !== 'None';
                    if (mem.is_worker || hasDept) {
                        combinedByMemberId.set(key, {
                            id: mem.id,
                            full_name: mem.full_name,
                            phone: mem.phone || '',
                            member_id: mem.member_id || '',
                            department: hasDept ? mem.assigned_department : 'Worker'
                        });
                    }
                }
            });

            return Array.from(combinedByMemberId.values()).sort((a, b) =>
                (a.full_name || '').localeCompare(b.full_name || '')
            );
        }

        async function resolveMemberDepartmentName(member) {
            const joinedDept = member?.member_departments?.[0]?.departments?.name;
            if (joinedDept && joinedDept !== 'None') return joinedDept;

            if (member?.id) {
                try {
                    const { data: mdRow } = await supabaseClient
                        .from('member_departments')
                        .select('department_id, departments(name)')
                        .eq('member_id', member.id)
                        .maybeSingle();

                    if (mdRow?.departments?.name && mdRow.departments.name !== 'None') {
                        return mdRow.departments.name;
                    }

                    if (mdRow?.department_id) {
                        const { data: dRow } = await supabaseClient
                            .from('departments')
                            .select('name')
                            .eq('id', mdRow.department_id)
                            .maybeSingle();
                        if (dRow?.name && dRow.name !== 'None') return dRow.name;
                    }
                } catch (e) {
                    console.warn('Department lookup fallback:', e);
                }
            }

            if (member?.assigned_department && member.assigned_department !== 'None') {
                return member.assigned_department;
            }

            return 'None';
        }

        function inferFellowshipFromMember(member) {
            const married = Boolean(member?.is_married);
            const gender = (member?.gender || '').toLowerCase();
            if (married) {
                return gender === 'female' ? 'Women Fellowship' : 'Men Fellowship';
            }
            return 'Youth Fellowship';
        }

        async function fetchWorkersLeadershipState() {
            const localState = getLocalWorkersLeadershipState();
            try {
                const { data, error } = await supabaseClient
                    .from('workers_leaders')
                    .select('member_id, is_active, role_type');
                if (!error && Array.isArray(data)) {
                    let dbLeaderId = null;
                    let dbViceId = null;
                    data.forEach(row => {
                        if (row.is_active) {
                            if (row.role_type === 'vice_leader') {
                                dbViceId = row.member_id;
                            } else {
                                dbLeaderId = row.member_id;
                            }
                        }
                    });
                    return {
                        workersLeaderId: dbLeaderId || localState.workersLeaderId,
                        viceLeaderId: dbViceId || localState.viceLeaderId
                    };
                }
            } catch (e) {
                console.warn('workers_leaders fallback:', e);
            }
            return localState;
        }

        async function saveWorkersLeadershipPair(workersLeaderId, viceLeaderId) {
            const finalLeaderId = workersLeaderId || null;
            const finalViceId = (viceLeaderId && viceLeaderId !== finalLeaderId) ? viceLeaderId : null;

            setLocalWorkersLeadershipState({
                workersLeaderId: finalLeaderId,
                viceLeaderId: finalViceId
            });

            try {
                await supabaseClient.from('workers_leaders').update({ is_active: false }).neq('id', '00000000-0000-0000-0000-000000000000');

                if (finalLeaderId) {
                    const { data: exL } = await supabaseClient.from('workers_leaders').select('id').eq('member_id', finalLeaderId).maybeSingle();
                    if (exL?.id) {
                        await supabaseClient.from('workers_leaders').update({ is_active: true, role_type: 'workers_leader' }).eq('id', exL.id);
                    } else {
                        await supabaseClient.from('workers_leaders').insert([{ member_id: finalLeaderId, is_active: true, role_type: 'workers_leader' }]);
                    }
                }

                if (finalViceId) {
                    const { data: exV } = await supabaseClient.from('workers_leaders').select('id').eq('member_id', finalViceId).maybeSingle();
                    if (exV?.id) {
                        await supabaseClient.from('workers_leaders').update({ is_active: true, role_type: 'vice_leader' }).eq('id', exV.id);
                    } else {
                        await supabaseClient.from('workers_leaders').insert([{ member_id: finalViceId, is_active: true, role_type: 'vice_leader' }]);
                    }
                }
            } catch (e) {
                console.warn('workers_leaders table sync fallback:', e);
            }

            return { workersLeaderId: finalLeaderId, viceLeaderId: finalViceId };
        }

        async function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            const btn = document.getElementById('regSubmitBtn');
            if (pin !== confirmPin) {
                showAlert('regAlert', 'PIN numbers do not match! Please verify.');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                showAlert('regAlert', 'PIN must be exactly 4 numeric digits.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Saving to Database...';
            try {
                registrationData.dateJoined = document.getElementById('regDateJoined').value;
                const hashedPin = await hashPin(pin);
                const generatedMemberId = `OCM/MEM/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
                const formattedJoinDate = registrationData.dateJoined ? `${registrationData.dateJoined}-01` : new Date().toISOString().split('T')[0];

                const isWorkerBool = registrationData.isWorker === 'yes';
                const chosenDept = isWorkerBool && registrationData.department && registrationData.department !== 'None'
                    ? registrationData.department
                    : null;

                const baseMemberPayload = {
                    member_id: generatedMemberId,
                    full_name: registrationData.fullName,
                    gender: registrationData.gender,
                    phone: registrationData.phone,
                    whatsapp: registrationData.whatsapp || null,
                    email: registrationData.email || null,
                    address: registrationData.address,
                    date_of_birth: registrationData.dob,
                    nationality: registrationData.nationality,
                    state: registrationData.stateOfOrigin,
                    residence_state: registrationData.stateOfResidence,
                    is_married: registrationData.isMarried === 'yes',
                    is_worker: isWorkerBool,
                    date_joined: formattedJoinDate,
                    pin_code: hashedPin
                };

                let insertRes = await supabaseClient
                    .from('members')
                    .insert([{ ...baseMemberPayload, assigned_department: chosenDept }])
                    .select()
                    .single();

                if (insertRes.error && /assigned_department|schema cache|column/i.test(insertRes.error.message || '')) {
                    insertRes = await supabaseClient
                        .from('members')
                        .insert([baseMemberPayload])
                        .select()
                        .single();
                }

                if (insertRes.error) throw insertRes.error;
                const insertedMember = insertRes.data;

                const { row: fellowshipRow } = await ensureFellowshipRecord(registrationData.fellowship);
                if (fellowshipRow) {
                    await supabaseClient.from('member_fellowships').insert([{ member_id: insertedMember.id, fellowship_id: fellowshipRow.id }]);
                }

                if (isWorkerBool && chosenDept) {
                    const { row: deptRow, error: deptErr } = await ensureDepartmentRecord(chosenDept);
                    if (deptErr) throw deptErr;
                    if (deptRow) {
                        const { error: mdErr } = await supabaseClient
                            .from('member_departments')
                            .upsert([{ member_id: insertedMember.id, department_id: deptRow.id }], { onConflict: 'member_id,department_id' });
                        if (mdErr) {
                            await supabaseClient.from('member_departments').insert([{ member_id: insertedMember.id, department_id: deptRow.id }]);
                        }
                    }
                }

                const deptSummary = chosenDept ? ` | Department: ${chosenDept}` : '';

                showModal(
                    "Registration Successful",
                    `Your membership profile has been created successfully. Your assigned Member ID is ${generatedMemberId} (${registrationData.fellowship}${deptSummary}). Please proceed to log in.`,
                    () => { renderLoginPage(); }
                );
            } catch (err) {
                showAlert('regAlert', err.message || 'Error saving registration.');
                btn.disabled = false;
                btn.innerHTML = 'Save & Login <i class="fa-solid fa-check ml-1"></i>';
            }
        }

        // --- 4. MEMBER LOGIN HANDLER ---
        async function refreshMemberSession(memberId) {
            const { data: member } = await supabaseClient
                .from('members')
                .select(`*, member_fellowships(fellowships(id, name)), member_departments(departments(id, name)), group_leaders(id, is_active, fellowship_id, fellowships(id, name)), report_takers(is_active)`)
                .eq('id', memberId)
                .maybeSingle();
            if (member) {
                const resolvedDept = await resolveMemberDepartmentName(member);
                member.assigned_department = resolvedDept;
                if (resolvedDept !== 'None' && (!member.member_departments || member.member_departments.length === 0)) {
                    member.member_departments = [{ departments: { name: resolvedDept } }];
                }

                const wState = await fetchWorkersLeadershipState();
                member.is_workers_leader = wState.workersLeaderId === member.id;
                member.is_vice_leader = wState.viceLeaderId === member.id;
                member.exco_profile = getMemberGroupExcoProfile(member);
                member.assigned_duties = await fetchMemberAssignedDuties(member.id, member.phone);
                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
            }
            return member;
        }

        async function handleMemberLogin() {
            const identifier = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const btn = document.getElementById('memberLoginBtn');
            if (!identifier || !pin) {
                showAlert('loginAlert', 'Please enter your Phone Number / Member ID and PIN.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Verifying PIN...';
            try {
                const hashedPin = await hashPin(pin);
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select(`*, member_fellowships(fellowships(id, name)), member_departments(departments(id, name)), group_leaders(id, is_active, fellowship_id, fellowships(id, name)), report_takers(is_active)`)
                    .or(`phone.eq.${identifier},member_id.eq.${identifier}`)
                    .eq('pin_code', hashedPin)
                    .maybeSingle();

                if (error || !member) throw new Error('Invalid Phone Number/Member ID or 4-Digit PIN.');
                if (member.membership_status !== 'Active') throw new Error(`Account is currently ${member.membership_status}.`);

                const resolvedDept = await resolveMemberDepartmentName(member);
                member.assigned_department = resolvedDept;
                if (resolvedDept !== 'None' && (!member.member_departments || member.member_departments.length === 0)) {
                    member.member_departments = [{ departments: { name: resolvedDept } }];
                }

                const wState = await fetchWorkersLeadershipState();
                member.is_workers_leader = wState.workersLeaderId === member.id;
                member.is_vice_leader = wState.viceLeaderId === member.id;
                member.exco_profile = getMemberGroupExcoProfile(member);
                member.assigned_duties = await fetchMemberAssignedDuties(member.id, member.phone);

                activeMemberSession = member;
                localStorage.setItem('ocm_member_session', JSON.stringify(member));
                renderMemberDashboardShell();
            } catch (err) {
                showAlert('loginAlert', err.message || 'Login failed.');
                btn.disabled = false;
                btn.innerText = 'Member Login';
            }
        }

        // LOGIC 1 HANDLER
        async function submitMemberTestimony(e) {
            e.preventDefault();
            const testifierName = document.getElementById('testimonyTestifierName')?.value.trim() || '';
            const topic = document.getElementById('testimonyTopicInput')?.value.trim() || '';
            const details = document.getElementById('testimonyDetailsInput')?.value.trim() || '';
            const btn = document.getElementById('saveTestimonyBtn');
            const todayStr = new Date().toISOString().split('T')[0];

            if (!testifierName || !topic || !details) return;
            if (btn) { btn.disabled = true; btn.innerText = 'Saving...'; }

            try {
                const { error } = await supabaseClient.from('testimonies').insert([{
                    member_id: activeMemberSession?.id || null,
                    testifier_name: testifierName,
                    topic,
                    details,
                    testimony_date: todayStr,
                    is_read: false
                }]);
                if (error) throw error;

                showModal(
                    'Testimony Saved',
                    'Your testimony has been saved to admin portal, thank you. Jesus never says goodbye.',
                    () => {
                        openMemberAssignedRoleInline(encodeURIComponent('Testimonies'));
                    }
                );
            } catch (err) {
                showModal('Save Error', err.message || 'Could not save testimony.', null, false);
                if (btn) { btn.disabled = false; btn.innerText = 'Save Testimony'; }
            }
        }

            const childrenCount = parseInt(document.getElementById('attChildrenCount')?.value || '0', 10);
            const workersCount = parseInt(document.getElementById('attWorkersCount')?.value || '0', 10);

            const btn = document.getElementById('saveServiceAttBtn');
            const todayStr = new Date().toISOString().split('T')[0];

            if (btn) { btn.disabled = true; btn.innerText = 'Saving...'; }

                const { error } = await supabaseClient.from('service_attendance_logs').insert([{
                    member_id: activeMemberSession?.id || null,
                    submitted_by: activeMemberSession?.full_name || 'Member',
                    service_date: todayStr,
                    adult_count: adultCount,
                    children_count: childrenCount,
                    workers_count: workersCount,
                    report_details: reportDetails,

        // LOGIC 4: BIRTHDAYS WITH COUNTDOWN TIERS, MULTI-SELECT & MESSAGE GENERATOR
        function computeBirthdayTier(dobStr) {
            if (!dobStr || !/^\d{4}-\d{2}-\d{2}/.test(String(dobStr))) {
                return { tier: 'none', clickable: false, badge: '' };
            }
            const now = new Date();
            const [, mStr, dStr] = String(dobStr).slice(0, 10).split('-');
            const mIdx = Number(mStr) - 1;
            const dayNum = Number(dStr);

            const targetThisYear = new Date(now.getFullYear(), mIdx, dayNum, 0, 0, 0);
            const targetNextYear = new Date(now.getFullYear() + 1, mIdx, dayNum, 0, 0, 0);
            const target = targetThisYear.getTime() >= (now.getTime() - 86400000) ? targetThisYear : targetNextYear;

            const diffMs = target.getTime() - now.getTime();
            const diffHours = diffMs / (1000 * 60 * 60);
            const diffDays = diffMs / (1000 * 60 * 60 * 24);

            // Within 30 minutes before or active birthday day (up to +24h)
            if (diffHours <= 0.5 && diffHours >= -24) {
                return {
                    tier: 'imminent_30m',
                    clickable: true,
                    rowClass: 'bday-blink-green-gold',
                    iconsHtml: '<i class="fa-solid fa-cake-candles text-amber-300"></i><i class="fa-solid fa-champagne-glasses text-emerald-300"></i><i class="fa-solid fa-ribbon text-pink-300"></i>',
                    label: '30 Mins / Celebrant!'
                };
            }
            // 1 day before birthday (within 24h)
            if (diffHours > 0.5 && diffHours <= 24) {
                return {
                    tier: 'one_day',
                    clickable: true,
                    rowClass: 'bday-blink-gold',
                    iconsHtml: '<i class="fa-solid fa-cake-candles text-amber-300"></i>',
                    label: '1 Day to Birthday!'
                };
            }
            // 2 days to birthday (not clickable)
            if (diffDays > 1 && diffDays <= 2.5) {
                return {
                    tier: 'two_days',
                    clickable: false,
                    rowClass: 'bg-yellow-500/20 border border-yellow-400/50 text-yellow-200 cursor-not-allowed opacity-90',
                    iconsHtml: '',
                    label: '2 Days to Birthday'
                };
            }
            // Within 7 days (not clickable)
            if (diffDays > 2.5 && diffDays <= 7.5) {
                return {
                    tier: 'seven_days',
                    clickable: false,
                    rowClass: 'bg-gray-600/25 border border-gray-500/40 text-gray-300 cursor-not-allowed opacity-75',
                    iconsHtml: '',
                    label: '7 Days Remaining'
                };
            }
            return {
                tier: 'normal',
                clickable: true,
                rowClass: 'bg-black/30 border border-white/10 text-white hover:border-amber-400/40',
                iconsHtml: '',
                label: dobStr
            };
        }

        async function submitMemberFinancialRecord(e, encodedCategoryKey) {
            e.preventDefault();
            const categoryKey = decodeURIComponent(encodedCategoryKey);
            const sunAmt = Number(document.getElementById('finSundayAmt')?.value || 0);
            const tueAmt = Number(document.getElementById('finTuesdayAmt')?.value || 0);
            const vigAmt = Number(document.getElementById('finVigilAmt')?.value || 0);
            const btn = document.getElementById('saveFinRecordBtn');
            const todayStr = new Date().toISOString().split('T')[0];

            const entries = [
                { service_type: 'Sunday Service', amount: sunAmt },
                { service_type: 'Tuesday Service', amount: tueAmt },
                { service_type: 'Night Vigil', amount: vigAmt }
            ].filter(x => x.amount > 0);

            if (entries.length === 0) {
                showModal('Enter Figure', 'Please enter an amount greater than 0 in at least one service field.', null, false);
                return;
            }

            if (btn) { btn.disabled = true; btn.innerText = 'Saving...'; }

            const tableMap = {
                'offering record': 'offering_record',
                'tithe record': 'tithe_record',
                'seed record': 'seed_record',
                'building offering': 'building_offering',
                'welfare offering': 'welfare_offering',
                'welfare record': 'welfare_record',
                'maintenance record': 'maintenance_record'
            };
            const targetTable = tableMap[categoryKey] || 'offering_record';

            try {
                const isExpenseTable = (targetTable === 'welfare_record' || targetTable === 'maintenance_record');
                const rowsToInsert = entries.map(en => isExpenseTable
                    ? {
                        title: `${categoryKey.toUpperCase()} (${en.service_type})`,
                        amount: en.amount,
                        record_date: todayStr,
                        recorded_by: activeMemberSession?.full_name || 'Member',
                        is_read: false
                    }
                    : {
                        service_type: en.service_type,
                        amount: en.amount,
                        record_date: todayStr,
                        recorded_by: activeMemberSession?.full_name || 'Member',
                        is_read: false
                    }
                );

                const { error } = await supabaseClient.from(targetTable).insert(rowsToInsert);
                if (error) throw error;

                const totalSaved = entries.reduce((s, x) => s + x.amount, 0);
                showModal(
                    'Record Saved',
                    `Saved ${formatNaira(totalSaved)} under ${categoryKey.toUpperCase()} (${entries.length} service entry/entries) to the Admin Dashboard.`,
                    () => {
                        openMemberAssignedRoleInline(encodeURIComponent(activeMemberAssignedDuty || categoryKey));
                    }
                );
            } catch (err) {
                showModal('Save Error', err.message || 'Could not save record.', null, false);
                if (btn) { btn.disabled = false; btn.innerText = `Save ${categoryKey}`; }
            }
        }

        function toggleDuesCollectorMemberRow(memberId, fellowshipName) {
            expandedDuesCollectorMemberId = expandedDuesCollectorMemberId === memberId ? null : memberId;

        }

        function recordCollectedMemberDues(memberId, memberName, fellowshipName) {
            const selectEl = document.getElementById(`duesAmountDropdown-${memberId}`);
            const amount = Number(selectEl?.value || 500);
            const settings = getGroupSettings(fellowshipName);
            const targetMember = duesCollectorDirectoryCache.find(m => String(m.id) === String(memberId)) || { id: memberId, full_name: memberName };

            const ledger = getAllDuesPaymentsLedger();
            ledger.push({
                id: 'dues-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                memberId: String(memberId),
                memberName,
                fellowshipName,
                amount,
                rateAtPayment: settings.monthlyDues,
                collectedBy: activeMemberSession?.full_name || 'Dues Collector',
                paidAt: new Date().toISOString()
            });
            saveAllDuesPaymentsLedger(ledger);

            const updatedAcct = computeMemberDuesAccount(targetMember, fellowshipName);
            const advNote = updatedAcct.advanceAmount > 0
                ? `\nAdvance Balance: ${formatNaira(updatedAcct.advanceAmount)} (${updatedAcct.advanceMonths} month(s) ahead)`
                : `\nRemaining Arrears: ${formatNaira(updatedAcct.arrearsAmount)} (${updatedAcct.monthsOwing} month(s))`;

            showModal(
                'Dues Paid & Saved',
                `Saved ${formatNaira(amount)} to ${memberName}'s Total Dues.\nLast Paid Month: ${updatedAcct.lastPaidYm ? formatMonthLabel(updatedAcct.lastPaidYm) : 'N/A'}${advNote}`,
                () => {
                    expandedDuesCollectorMemberId = null;
                    filterDuesCollectorMembers(fellowshipName);
                }
            );
        }

        function computeGroupPurseStats(fellowshipName) {
            const ledger = getAllDuesPaymentsLedger().filter(p => p.fellowshipName === fellowshipName);
            const collectedDuesTotal = ledger.reduce((sum, p) => sum + Number(p.amount || 0), 0);

            const transfers = getTreasurerTransfers().filter(t => t.fellowshipName === fellowshipName);
            const receivedByAdminTotal = transfers
                .filter(t => t.status === 'admin_received')
                .reduce((sum, t) => sum + Number(t.amount || 0), 0);

            const currentBalance = Math.max(0, collectedDuesTotal - receivedByAdminTotal);

            return {
                collectedDuesTotal,
                receivedByAdminTotal,
                currentBalance,
                transfers
            };
        }

            treasurerFlowState.subView = 'receive';
            renderTreasurerModule(fName);

        function backToTreasurerCards(fellowshipName) {
            treasurerFlowState.subView = 'cards';
            renderTreasurerModule(fellowshipName);
        }

        function onTreasurerRecipientTypeChange(val, fellowshipName) {
            treasurerFlowState.recipientType = val;
            treasurerFlowState.selectedAccount = null;
            treasurerFlowState.showProofStep = false;
            renderTreasurerModule(fellowshipName);
        }

        function selectTreasurerTargetAccount(type, index, fellowshipName) {
            if (type === 'admin') {
                const banks = getAdminBankAccounts();
                treasurerFlowState.selectedAccount = banks[index] || null;
            } else {
                const gs = getGroupSettings(fellowshipName);
                treasurerFlowState.selectedAccount = {
                    bankName: gs.leaderBankName || 'Group Leader Bank',
                    accountName: gs.leaderAccountName || 'Group Leader Account',
                    accountNumber: gs.leaderAccountNumber
                };
            }
            treasurerFlowState.showProofStep = false;
            renderTreasurerModule(fellowshipName);
        }

        function proceedTreasurerToProofUpload(fellowshipName) {
            const amt = Number(document.getElementById('treasurerSendAmountInput')?.value || 0);
            const details = document.getElementById('treasurerSendDetailsInput')?.value.trim() || '';
            if (amt <= 0) {
                showModal('Invalid Amount', 'Please enter a valid amount to send.', null, false);
                return;
            }
            if (!details) {
                showModal('Details Required', 'Please enter transaction details before proceeding.', null, false);
                return;
            }
            treasurerFlowState.amount = String(amt);
            treasurerFlowState.details = details;
            treasurerFlowState.showProofStep = true;
            renderTreasurerModule(fellowshipName);
        }

        function handleTreasurerProofFile(event, fellowshipName) {
            const file = event?.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                treasurerFlowState.proofDataUrl = e.target.result;
                treasurerFlowState.proofFileName = file.name;
                renderTreasurerModule(fellowshipName);
            };
            reader.readAsDataURL(file);
        }

        function promptTreasurerSendConfirmation(fellowshipName) {
            const amt = Number(treasurerFlowState.amount || 0);
            const acct = treasurerFlowState.selectedAccount;
            if (!acct || amt <= 0) {
                showModal('Missing Information', 'Please select an account and enter an amount.', null, false);
                return;
            }
            if (!treasurerFlowState.proofDataUrl) {
                showModal('Proof Required', 'Please upload Proof of Payment before clicking Send.', null, false);
                return;
            }

            openConfirmActionModal(
                'Confirm Transaction',
                `You are about to send ${formatNaira(amt)} to ${acct.accountName} (${acct.bankName} - ${acct.accountNumber}).\n\nDo you want to proceed?`,
                'Yes',
                () => {
                    const transfers = getTreasurerTransfers();
                    transfers.unshift({
                        id: 'tx-' + Date.now(),
                        fellowshipName,
                        treasurerId: String(activeMemberSession.id),
                        treasurerName: activeMemberSession.full_name,
                        recipientType: treasurerFlowState.recipientType,
                        bankName: acct.bankName,
                        accountName: acct.accountName,
                        accountNumber: acct.accountNumber,
                        amount: amt,
                        details: treasurerFlowState.details,
                        proofDataUrl: treasurerFlowState.proofDataUrl,
                        status: 'pending_leader_approval',
                        createdAt: new Date().toISOString()
                    });
                    saveTreasurerTransfers(transfers);

                    showModal(
                        'Transaction Sent',
                        'Transaction sent. Waiting for your group leader approval.',
                        () => {
                            treasurerFlowState.subView = 'cards';
                            renderTreasurerModule(fellowshipName);
                        }
                    );
                }
            );

            let totalArrears = 0;
            membersList.forEach(mem => {
                const acct = computeMemberDuesAccount(mem, fellowshipName);
                totalDuesPaid += acct.totalPaidAmount;
                totalArrears += acct.arrearsAmount;
            });

            currentGroupLeaderMetrics = {
                fellowshipName,
                membersList,
                totalInflow: purse.collectedDuesTotal,
                totalDues: totalDuesPaid,
                totalArrears,
                projectPaid: 0,
                projectUnpaid: 0,
                expenses: purse.receivedByAdminTotal,
                totalBalance: purse.currentBalance
            };
        }

        function saveGroupExcoMemberRoles(memberId, memberName, fellowshipName) {
            const checkboxes = document.querySelectorAll(`.group-exco-role-cb-${memberId}:checked`);
            const selectedRoles = Array.from(checkboxes).map(cb => cb.value);

            let excos = getGroupExcoAssignments(fellowshipName);
            excos = excos.filter(e => String(e.memberId) !== String(memberId));
            if (selectedRoles.length > 0) {
                excos.push({
                    memberId: String(memberId),
                    memberName,
                    roles: selectedRoles,
                    assignedAt: new Date().toISOString()
                });
            }
            saveGroupExcoAssignments(fellowshipName, excos);

            const roleText = selectedRoles.length > 0 ? selectedRoles.join(', ') : 'No roles';
            showModal(
                'Exco Role Saved',
                `${memberName} has been updated (${roleText}) in ${fellowshipName}. Their assigned dashboard button is now active in their member portal.`,
                () => {
                    expandedGroupExcoMemberId = null;
                    switchGroupLeaderView('assign-excos', fellowshipName);
                }
            );
        }

        function approveTreasurerTransferByLeader(txId, fellowshipName) {
            const transfers = getTreasurerTransfers();
            const tx = transfers.find(t => t.id === txId);
            if (!tx) return;

            tx.status = 'leader_approved';
            tx.approvedByLeader = activeMemberSession?.full_name || 'Group Leader';
            tx.leaderApprovedAt = new Date().toISOString();
            saveTreasurerTransfers(transfers);

            pushMemberInboxNotification(
                tx.treasurerId,
                'Transaction Approved by Group Leader',
                `Your transfer of ${formatNaira(tx.amount)} to ${tx.accountName} has been approved by your Group Leader and forwarded to Main Admin.`
            );

            showModal(
                'Approved & Sent to Admin',
                `Transaction of ${formatNaira(tx.amount)} has been approved, notified to the Treasurer, and sent to Admin Notifications.`,
                () => {
                    switchGroupLeaderView('notifications', fellowshipName);
                }
            );
        }

        function declineTreasurerTransferByLeader(txId, fellowshipName) {
            const transfers = getTreasurerTransfers();
            const tx = transfers.find(t => t.id === txId);
            if (!tx) return;

            tx.status = 'leader_rejected';
            saveTreasurerTransfers(transfers);

            pushMemberInboxNotification(
                tx.treasurerId,
                'Transaction Declined by Group Leader',
                `Your transfer request of ${formatNaira(tx.amount)} to ${tx.accountName} was declined by your Group Leader.`
            );

            showModal('Transaction Declined', 'The Treasurer has been notified.', () => {
                switchGroupLeaderView('notifications', fellowshipName);
            });
        }

        async function loadAndRenderCarParkedReports() {
            const dbRows = await safeSupabaseSelect('car_parked_reports');
            const localRows = getLocalCarParkedReports();
            const merged = [...dbRows, ...localRows];
            carParkedReportsCache = merged;

            const container = document.getElementById('carParkedReportsListContainer');
            if (!container) return;
            if (merged.length === 0) {

        async function submitCarParkedReportEntry(e) {
            e.preventDefault();
            const plate = document.getElementById('carParkedPlateInput')?.value.trim().toUpperCase() || '';
            const model = document.getElementById('carParkedModelInput')?.value.trim() || '';
            const serviceDay = document.getElementById('carParkedServiceInput')?.value || 'Sunday Service';
            const todayStr = new Date().toISOString().split('T')[0];
            if (!plate || !model) return;

            const entry = {
                plate_number: plate,
                car_model: model,
                service_day: serviceDay,
                report_date: todayStr,
                recorded_by: activeAdminSession?.full_name || activeMemberSession?.full_name || 'Officer'
            };

            const { error } = await supabaseClient.from('car_parked_reports').insert([entry]);
            if (error) {
                const localList = getLocalCarParkedReports();
                localList.unshift(entry);
                saveLocalCarParkedReports(localList);
            }

            document.getElementById('carParkedPlateInput').value = '';
            document.getElementById('carParkedModelInput').value = '';
            await loadAndRenderCarParkedReports();
            showModal('Car Report Saved', `Car ${plate} (${model}) has been recorded for ${todayStr}.`);
        }

        async function renderAssignDutiesView() {
            const main = document.getElementById('mainContent');
            if (!main) return;
            expandedAdminDutyMemberId = null;

            main.innerHTML = `
                <div class="card-bg p-6 rounded-2xl border border-amber-500/30 space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/10 pb-4">
                        <div>
                            <h3 class="text-base font-bold text-amber-400">Assign Duties to Registered Members</h3>
                            <p class="text-xs text-gray-400 mt-0.5">Search by name, phone number, or WhatsApp number, click a member name, tick duties, and click Approve.</p>
                        </div>
                        <div class="relative w-full sm:w-80">
                            <i class="fa-solid fa-magnifying-glass text-xs text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                            <input type="text" id="adminAssignDutiesSearchInput" oninput="filterAdminAssignDutiesMembers()" placeholder="Search name, phone, or WhatsApp..." class="w-full bg-black/30 border border-white/15 rounded-lg pl-9 pr-4 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                    <div id="adminAssignDutiesListContainer" class="divide-y divide-white/5">
                        <p class="py-6 text-center text-gray-400 text-xs">Loading members...</p>
                    </div>
                </div>
            `;

            const { data: members, error } = await supabaseClient
                .from('members')
                .select('*')
                .order('full_name', { ascending: true });

            if (error) {
                document.getElementById('adminAssignDutiesListContainer').innerHTML = `<p class="py-6 text-center text-red-400 text-xs">Error: ${error.message}</p>`;
                return;
            }

            adminAssignDutiesMembersCache = members || [];
            renderAdminAssignDutiesRows(adminAssignDutiesMembersCache);
        }

        function filterAdminAssignDutiesMembers() {
            const q = (document.getElementById('adminAssignDutiesSearchInput')?.value || '').trim().toLowerCase();
            const filtered = q
                ? adminAssignDutiesMembersCache.filter(m =>
                    (m.full_name || '').toLowerCase().includes(q) ||
                    (m.phone || '').toLowerCase().includes(q) ||
                    (m.whatsapp || '').toLowerCase().includes(q)
                )
                : adminAssignDutiesMembersCache;
            renderAdminAssignDutiesRows(filtered);
        }

        function renderAdminAssignDutiesRows(members) {
            const container = document.getElementById('adminAssignDutiesListContainer');
            if (!container) return;

            if (!members || members.length === 0) {
                container.innerHTML = `<p class="py-6 text-center text-gray-400 text-xs">No matching members found.</p>`;
                return;
            }

            const localMap = getLocalAssignedDutiesMap();

            container.innerHTML = members.map(m => {
                const isExpanded = expandedAdminDutyMemberId === m.id;
                const savedDuties = localMap[String(m.id)]?.duties || [];
                const safeName = (m.full_name || '').replace(/'/g, "\\'");

                return `
                    <div class="py-3 px-2">
                        <div onclick="toggleAdminAssignDutyDropdown('${m.id}')" class="flex items-center justify-between gap-3 p-2.5 rounded-xl hover:bg-white/5 cursor-pointer transition">
                            <div class="min-w-0">
                                <h4 class="text-sm font-semibold text-white hover:text-amber-300 transition truncate">${m.full_name}</h4>
                                <p class="text-[11px] text-gray-400 truncate">
                                    Phone: ${m.phone || 'N/A'} • WhatsApp: ${m.whatsapp || 'N/A'}
                                    ${savedDuties.length > 0 ? ` • <span class="text-emerald-400 font-semibold">Duties: ${savedDuties.join(', ')}</span>` : ''}
                                </p>
                            </div>
                            <i class="fa-solid ${isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs text-gray-400 shrink-0"></i>
                        </div>

                        <div id="adminDutyDropdown-${m.id}" class="${isExpanded ? '' : 'hidden'} mt-2 ml-2 mr-2 p-4 rounded-xl bg-black/35 border border-amber-500/25 space-y-3">
                            <p class="text-xs font-semibold text-gray-300">Select Duty / Duties to Assign to <strong class="text-white">${m.full_name}</strong>:</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 text-xs">
                                ${ASSIGNABLE_DUTIES_LIST.map(duty => {
                                    const checked = savedDuties.includes(duty) ? 'checked' : '';
                                    return `
                                        <label class="flex items-center space-x-2 p-2.5 rounded-lg bg-black/40 border border-white/10 hover:border-amber-400/40 cursor-pointer">
                                            <input type="checkbox" class="admin-assign-duty-cb-${m.id} accent-amber-500 w-4 h-4" value="${duty}" ${checked}>
                                            <span class="text-gray-200 font-medium">${duty}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                            <div class="flex justify-end pt-1">
                                <button type="button" onclick="approveMemberAssignedDuties('${m.id}', '${safeName}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg text-xs transition shadow-lg">
                                    Approve
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleAdminAssignDutyDropdown(memberId) {
            expandedAdminDutyMemberId = expandedAdminDutyMemberId === memberId ? null : memberId;
            filterAdminAssignDutiesMembers();
        }

        async function approveMemberAssignedDuties(memberId, memberName) {
            const checkboxes = document.querySelectorAll(`.admin-assign-duty-cb-${memberId}:checked`);
            const selectedDuties = Array.from(checkboxes).map(cb => cb.value);
            const memberObj = adminAssignDutiesMembersCache.find(m => String(m.id) === String(memberId)) || { id: memberId, full_name: memberName };

            await saveMemberAssignedDuties(memberObj, selectedDuties);

            showModal(
