        // PIN SHA-256 helper
        async function hashPin(pin) {
            const encoder = new TextEncoder();
            const data = encoder.encode("OCM_SALT_" + pin);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        }

        async function handleAdminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('adminAuthBtn');
            if (!email || !password) {
                showAlert('adminLoginAlert', 'Please enter your Admin Email and Password.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (authError) throw authError;

                const { data: roleRows, error: roleError } = await supabaseClient
                    .from('user_roles')
                    .select('roles(name)')
                    .eq('user_id', authData.user.id);
                if (roleError) throw roleError;

                const roleNames = (roleRows || []).map(r => r.roles?.name);
                const isAuthorizedAdmin = roleNames.includes('Super Administrator') || roleNames.includes('Administrator');

                if (!isAuthorizedAdmin) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Access Denied: Your account does not hold an Administrator role.');
                }

                activeAdminSession = { user: authData.user, roles: roleNames };
                renderFullAdminDashboard();
            } catch (err) {
                showAlert('adminLoginAlert', err.message || 'Invalid admin credentials.');
                btn.disabled = false;
                btn.innerText = 'Authenticate Admin Access';
            }
        }

        async function saveRegStep4(e) {
            e.preventDefault();
            const pin = document.getElementById('regPin').value;
            const confirmPin = document.getElementById('regConfirmPin').value;
            const btn = document.getElementById('regSubmitBtn');
            if (pin !== confirmPin) {
                showAlert('regAlert', 'PIN numbers do not match! Please verify and re-enter.');
                return;
            }
            if (!/^\d{4}$/.test(pin)) {
                showAlert('regAlert', 'PIN must be exactly 4 numeric digits.');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Saving to Database...';
            try {
                registrationData.dateJoined = document.getElementById('regDateJoined').value;
                const hashedPin = await hashPin(pin);
                const generatedMemberId = `OCM/MEM/${new Date().getFullYear()}/${Math.floor(1000 + Math.random() * 9000)}`;
                const formattedJoinDate = registrationData.dateJoined ? `${registrationData.dateJoined}-01` : new Date().toISOString().split('T')[0];

                const { data: insertedMember, error: memberError } = await supabaseClient
                    .from('members')
                    .insert([{
                        member_id: generatedMemberId,
                        full_name: registrationData.fullName,
                        gender: registrationData.gender,
                        phone: registrationData.phone,
                        whatsapp: registrationData.whatsapp || null,
                        email: registrationData.email || null,
                        address: registrationData.address,
                        date_of_birth: registrationData.dob,
                        nationality: registrationData.nationality,
                        state: registrationData.stateOfOrigin,
                        residence_state: registrationData.stateOfResidence,
                        is_married: registrationData.isMarried === 'yes',
                        is_worker: registrationData.isWorker === 'yes',
                        date_joined: formattedJoinDate,
                        pin_code: hashedPin
                    }])
                    .select()
                    .single();
                if (memberError) throw memberError;

                const { data: fellowshipRow } = await supabaseClient.from('fellowships').select('id').eq('name', registrationData.fellowship).single();
                if (fellowshipRow) {
                    await supabaseClient.from('member_fellowships').insert([{ member_id: insertedMember.id, fellowship_id: fellowshipRow.id }]);
                }

                if (registrationData.isWorker === 'yes' && registrationData.department !== 'None') {
                    const { data: deptRow } = await supabaseClient.from('departments').select('id').eq('name', registrationData.department).single();
                    if (deptRow) {
                        await supabaseClient.from('member_departments').insert([{ member_id: insertedMember.id, department_id: deptRow.id }]);
                    }
                }

                alert(`Registration successful! Your Member ID is ${generatedMemberId} (${registrationData.fellowship}). Please log in.`);
                renderLoginPage();
            } catch (err) {
                showAlert('regAlert', err.message || 'Error saving registration.');
                btn.disabled = false;
                btn.innerHTML = 'Save & Login <i class="fa-solid fa-check ml-1"></i>';
            }
        }

        // --- 4. MEMBER LOGIN HANDLER ---
        async function handleMemberLogin() {
            const identifier = document.getElementById('loginPhone').value.trim();
            const pin = document.getElementById('loginPin').value.trim();
            const btn = document.getElementById('memberLoginBtn');
            if (!identifier || !pin) {
                showAlert('loginAlert', 'Please enter your Phone Number (or Member ID) and 4-digit PIN.');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Verifying PIN...';
            try {
                const hashedPin = await hashPin(pin);
                const { data: member, error } = await supabaseClient
                    .from('members')
                    .select(`*, member_fellowships(fellowships(name)), member_departments(departments(name)), group_leaders(is_active, fellowships(name)), executive_assignments(is_active, role_type, fellowships(name))`)
                    .or(`phone.eq.${identifier},member_id.eq.${identifier}`)
                    .eq('pin_code', hashedPin)
                    .single();

                if (error || !member) throw new Error('Invalid Phone Number/Member ID or 4-Digit PIN.');
                if (member.membership_status !== 'Active') throw new Error(`Account is currently ${member.membership_status}.`);

                activeMemberSession = member;
                renderMemberDashboard();
            } catch (err) {
                showAlert('loginAlert', err.message || 'Login failed.');
                btn.disabled = false;
                btn.innerText = 'Member Login';
            }
        }

        async function saveGroupLeaderRole(memberId, makeLeader) {
            try {
                if (makeLeader) {
                    // Check fellowship ID of member
                    const { data: mf } = await supabaseClient.from('member_fellowships').select('fellowship_id').eq('member_id', memberId).single();
                    if (mf) {
                        await supabaseClient.from('group_leaders').upsert([{
                            member_id: memberId,
                            fellowship_id: mf.fellowship_id,
                            is_active: true
                        }], { onConflict: 'member_id,fellowship_id' });
                    }
                    alert('Successfully assigned as Group Leader! The Member Dashboard will now display the Group Leader button.');
                } else {
                    await supabaseClient.from('group_leaders').update({ is_active: false }).eq('member_id', memberId);
                    alert('Successfully removed Group Leader role.');
                }
                // Refresh list
                switchAdminView('assign-men');
            } catch (err) {
                alert('Error updating leader status: ' + err.message);
            }
        }

        async function loadAdminMemberCount() {
            const { count } = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
            const el = document.getElementById('statTotalMembers');
            if (el) el.innerText = count !== null ? count : '0';
        }

        function initChart() {
            const ctx = document.getElementById('financialChart');
            if (!ctx) return;
            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'],
                    datasets: [
                        { label: 'Dues', data: [300, 340, 320, 410, 390, 482], borderColor: '#10b981', tension: 0.4 },
                        { label: 'Expenses', data: [90, 110, 95, 130, 115, 125], borderColor: '#ef4444', tension: 0.4 },
                        { label: 'Balance', data: [210, 230, 225, 280, 275, 356], borderColor: '#2563eb', tension: 0.4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- 6. MEMBER DASHBOARD & GROUP LEADER DASHBOARD ---

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-screen overflow-hidden">

                        <div class="flex items-center space-x-3">

                        </div>
                        <button onclick="activeMemberSession = null; renderLoginPage();" class="text-xs text-red-400 hover:underline">

                    </header>
                    <main class="flex-1 overflow-y-auto p-6 space-y-6">
                        <!-- AUTOMATICALLY SHOWN GROUP LEADER BUTTON AT THE TOP CENTER -->
                        ${isGroupLeader ? `
                        <div class="flex justify-center">

                                <i class="fa-solid fa-crown text-sm"></i>
                                <span>OPEN GROUP LEADER DASHBOARD</span>
                            </button>
                        </div>
                        ` : ''}

                        <div class="grid grid-cols-2 gap-4">
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Fellowship & Unit</p>
                                <h3 class="text-sm sm:text-base font-bold mt-1 text-blue-400">${fellowshipName}</h3>
                                <p class="text-[11px] text-gray-400 mt-1">Dept: ${deptName}</p>
                            </div>
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Current Dues Paid</p>
                                <h3 class="text-lg sm:text-2xl font-bold mt-1 text-emerald-400">₦0.00</h3>
                            </div>
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Dues Arrears</p>
                                <h3 class="text-lg sm:text-2xl font-bold mt-1 text-red-400">₦0.00</h3>
                            </div>
                            <div class="card-bg p-4 sm:p-5 rounded-xl border border-white/5">
                                <p class="text-xs sm:text-sm text-gray-400">Account Status</p>
                                <h3 class="text-sm sm:text-base font-bold mt-1 text-emerald-400">${m.membership_status}</h3>
                            </div>
                        </div>
                        <div class="card-bg p-6 rounded-xl border border-white/5">
                            <h3 class="text-base font-bold mb-3">Member Profile Summary</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs text-gray-300">
                                <p><span class="text-gray-400">Phone:</span> ${m.phone}</p>
                                <p><span class="text-gray-400">WhatsApp:</span> ${m.whatsapp || 'N/A'}</p>
                                <p><span class="text-gray-400">Date of Birth:</span> ${m.date_of_birth}</p>
                                <p><span class="text-gray-400">State of Origin:</span> ${m.state}</p>
                                <p><span class="text-gray-400">Status:</span> <span class="text-emerald-400 font-semibold">${m.membership_status}</span></p>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        // --- GROUP LEADER DASHBOARD (Similar to Admin Dashboard) ---

            const m = activeMemberSession;

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-screen overflow-hidden">
                    <header class="card-bg border-b border-white/10 h-16 flex items-center justify-between px-6 z-40">

                </div>
            `;
        }

        async function adminLogout() {
            await supabaseClient.auth.signOut();
            activeAdminSession = null;
            renderLoginPage();
        }

        // Initialize application on load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === 'true') {
                renderFullAdminDashboard();
            } else {
                renderLoadingScreen();
            }
        });
    </script>
</body>
</html>
